<!DOCTYPE html>

<head>

<title>2.3 Quiz: Induktion und Regel von Lenz</title>
<style>
  :root{--petrol:#0B3B47;--petrol2:#0E7490;--lila:#7A2E8E;--orange:#E97132;--orange-hell:#FDEEE5;--grau:#F2F2F2;

        --dunkel:#1F2F3D;--text2:#4b5963;--nord:#D9363E;--sued:#3F8A4E;--feld:#5DBB46;--ifeld:#7B45C8;--blau:#1565C0}

  [hidden]{display:none!important}
  html{background:var(--petrol)}
  body{margin:0;background:var(--petrol);color:var(--dunkel);font-family:Calibri,Carlito,"Segoe UI",Roboto,Arial,sans-serif;
       font-size:17px;line-height:1.42;padding-bottom:30px;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible{outline:3px solid var(--gelb);outline-offset:2px}

  /* ---------- Kopf ---------- */
  header{color:#fff;max-width:680px;margin:0 auto;padding:12px 14px 4px}
  header small{opacity:.85;display:block;font-size:13px}
  header h1{margin:2px 0 8px;font-size:21px;line-height:1.22}
  .zurStart{display:inline-block;margin:0 0 6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.22);color:#fff;
            font-size:14px;font-weight:bold;text-decoration:none}
  .teile{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}

  .fort{display:flex;align-items:center;gap:10px;font-size:14px}
  .balken{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}

  .fort .pkt{white-space:nowrap;opacity:.95}

  main{max-width:680px;margin:0 auto;padding:8px 12px}
  .karte{background:#fff;border-radius:16px;padding:14px 14px 16px;box-shadow:0 4px 14px rgba(0,0,0,.22);animation:rein .28s ease-out}
  @keyframes rein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kopfzeile{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}

  .tag{font-size:12.5px;font-weight:bold;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .t-em{background:#E3EEFB;color:var(--blau)} .t-ind{background:#DFF1F5;color:var(--petrol2)}
  .t-strom{background:#FCEBDD;color:#A4500F} .t-lenz{background:#F4E8F8;color:var(--lila)} .t-pole{background:#FBE5EC;color:#AD1457}
  .aufgabe{background:var(--grau);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:17px}

  h2.titel{margin:0 0 8px;font-size:21px;color:var(--petrol)}

  /* Merkkasten (wie auf dem AB: orange) */
  .merke{border:2.5px solid var(--orange);background:var(--orange-hell);border-radius:14px;padding:10px 14px;margin:8px 0}
  .merke h3{margin:0 0 6px;color:var(--orange);font-size:18px}
  .merke ol{margin:4px 0;padding-left:22px} .merke li{margin:3px 0}
  .merke .regel{background:#fff;border-radius:10px;padding:8px 10px;margin:8px 0 4px;font-weight:bold}

  /* Ursache-Wirkungs-Kette (immer 0. = Ursache) */
  ol.kette{list-style:none;margin:8px 0 4px;padding:0}

  ol.kette .n{flex:none;width:26px;height:26px;border-radius:50%;background:#dfe6ea;color:var(--dunkel);font-weight:bold;
              display:inline-flex;align-items:center;justify-content:center;font-size:14.5px}
  ol.kette li.u .n{background:var(--orange);color:#fff}
  ol.kette li.w .n{background:var(--petrol2);color:#fff}
  ol.kette .lab{font-weight:bold} ol.kette li.u .lab{color:#B4521A} ol.kette li.w .lab{color:var(--petrol2)}
  ol.kette li + li::before{content:"";}
  @keyframes kette{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .pn{color:var(--nord);font-weight:bold} .ps{color:var(--sued);font-weight:bold}

  /* Auswahl */
  .mc{list-style:none;margin:8px 0;padding:0}
  .mc li{margin:7px 0}
  .mc button{width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start;border:2px solid #d5dde3;background:#fff;

  .mc .kx{flex:none;width:22px;height:22px;border:2px solid #9aa8b2;margin-top:1px;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px}
  .mc.einzel .kx{border-radius:50%} .mc.mehr .kx{border-radius:5px}
  .mc button.an{border-color:var(--petrol2);background:#eef7fa}
  .mc button.an .kx{background:var(--petrol2);border-color:var(--petrol2);color:#fff}
  .mc button.r{border-color:var(--gruen);background:var(--gruen-hell)} .mc button.r .kx{background:var(--gruen);border-color:var(--gruen);color:#fff}
  .mc button.f{border-color:var(--rot);background:var(--rot-hell)} .mc button.f .kx{background:var(--rot);border-color:var(--rot);color:#fff}
  .mc button.fehlt{border-style:dashed;border-color:var(--gruen)}
  .mc button:disabled{cursor:default;color:inherit}
  .mc .fb{font-size:14.5px;margin:3px 4px 0 34px;color:#444}

  /* Knöpfe und Rückmeldung */
  .qknopf{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .qknopf button{border:0;border-radius:10px;padding:10px 14px;font-size:15.5px;font-weight:bold;min-height:44px}
  .qknopf .pr{background:var(--petrol2);color:#fff}
  .qknopf .zeig,.qknopf .noch{background:#e1e6ea;color:var(--dunkel)}
  .qknopf .zeig.warn{background:var(--gelb-hell);outline:2px solid #e0a93c}
  .qknopf button:disabled{opacity:.35;cursor:default}
  .rueck{margin-top:10px;border-radius:10px;padding:9px 12px;font-size:16px}
  .rueck:empty{display:none}
  .rueck.gut{background:var(--gruen-hell);border-left:5px solid var(--gruen)}
  .rueck.falsch{background:var(--rot-hell);border-left:5px solid var(--rot)}
  .rueck.fast{background:var(--gelb-hell);border-left:5px solid #e0a93c}
  .rueck .warum{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.15);color:#273540}

  /* Lücken */
  .speicher{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 10px;padding:9px;background:#fff;border:2px dashed #c7d1d8;border-radius:12px}
  .speicher .ws{width:100%;font-size:13px;font-weight:bold;color:var(--text2);letter-spacing:.04em;text-transform:uppercase}
  .speicher button{border:2px solid #b9c6cf;background:#fff;border-radius:999px;padding:6px 13px;font-size:16px;min-height:40px}
  .speicher button.weg{visibility:hidden}
  .lt p{margin:6px 0;line-height:2.25}
  .luecke{display:inline-block;min-width:96px;min-height:34px;vertical-align:middle;border:0;border-bottom:2.5px solid #8a99a6;background:#f3f6f8;
    border-radius:6px 6px 0 0;font-size:16.5px;padding:2px 8px;color:var(--blau);font-weight:bold;line-height:1.5}
  .luecke.ziel{background:var(--gelb-hell);border-bottom-color:#e0a93c}
  .luecke.r{background:var(--gruen-hell);border-bottom-color:var(--gruen);color:var(--gruen)}
  .luecke.f{background:var(--rot-hell);border-bottom-color:var(--rot);color:var(--rot)}

  /* Fehlertext */
  .fehlertext{font-size:18px;line-height:2.1;background:#fff;border:2px solid #e1e6ea;border-radius:12px;padding:8px 12px}
  .fehlertext .w{border-radius:6px;padding:2px 1px;cursor:pointer}
  .fehlertext .w:hover{background:#f1f4f6}
  .fehlertext .w.zu{background:var(--gelb-hell)}
  .fehlertext .w.falschtipp{background:var(--rot-hell);transition:background .6s}
  .fehlertext .w.gefunden{text-decoration:line-through;text-decoration-color:var(--rot);text-decoration-thickness:2.5px;color:#8b1e1e;cursor:default;background:none}
  .fehlertext .neu{color:var(--gruen);font-weight:bold;margin-left:4px}
  .ersatz{margin:8px 0;padding:8px 10px;background:var(--gelb-hell);border-radius:12px}
  .ersatz .ws{font-size:14px;font-weight:bold;color:#6b5400;margin-bottom:4px}
  .ersatz button{border:2px solid #e0c46c;background:#fff;border-radius:999px;padding:6px 13px;font-size:16px;min-height:40px;margin:3px 6px 3px 0}
  .ersatz button.f{border-color:var(--rot);background:var(--rot-hell);text-decoration:line-through}

  /* Ordnen */
  .ord-ziel{list-style:none;margin:6px 0;padding:0;min-height:52px;border:2px dashed #c7d1d8;border-radius:12px;padding:6px}
  .ord-ziel:empty::before{content:"Tippe unten die Sätze in der richtigen Reihenfolge an.";display:block;color:#8a97a0;font-size:14.5px;padding:8px}
  .ord-ziel li,.ord-pool button{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;border:2px solid #d5dde3;background:#fff;border-radius:12px;padding:8px 10px;font-size:16px;margin:5px 0;min-height:44px}
  .ord-ziel li{cursor:pointer}
  .ord-ziel li .n{flex:none;width:26px;height:26px;border-radius:50%;background:#dfe6ea;font-weight:bold;display:inline-flex;align-items:center;justify-content:center;font-size:14.5px}
  .ord-ziel li.r{border-color:var(--gruen);background:var(--gruen-hell)} .ord-ziel li.f{border-color:var(--rot);background:var(--rot-hell)}
  .ord-pool{margin-top:8px}
  .ord-pool .ws{font-size:13px;font-weight:bold;color:var(--text2);letter-spacing:.04em;text-transform:uppercase}

  /* Tabelle / Zuordnen */
  .zeile{border:2px solid #e1e6ea;border-radius:12px;padding:8px 10px;margin:7px 0}
  .zeile .tx{margin-bottom:6px}
  .zeile .spalten{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
  .zeile .sp{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;color:var(--text2)}
  .seg{display:inline-flex;border:2px solid #d5dde3;border-radius:10px;overflow:hidden;background:#fff}
  .seg button{border:0;background:#fff;padding:7px 12px;font-size:15.5px;min-height:40px;color:var(--dunkel)}
  .seg button+button{border-left:2px solid #d5dde3}
  .seg button.an{background:var(--petrol2);color:#fff;font-weight:bold}
  .seg button.r{background:var(--gruen);color:#fff;font-weight:bold}
  .seg button.f{background:var(--rot);color:#fff;font-weight:bold}
  .seg button.soll{box-shadow:inset 0 0 0 3px var(--gruen)}
  .zeile.r{border-color:var(--gruen)} .zeile.f{border-color:var(--rot)}

  /* Szenen (Pole eintragen) */
  .szene{background:#fbfcfd;border:2px solid #e1e6ea;border-radius:12px;padding:4px;margin:6px 0}
  .szene svg{display:block;width:100%;height:auto;max-height:340px;user-select:none;-webkit-user-select:none}
  .szene .box{cursor:pointer}
  .szene .box rect{fill:#fff;stroke:#7b8a95;stroke-width:2;stroke-dasharray:4 3}
  .szene .box.N rect{fill:var(--nord);stroke:var(--nord);stroke-dasharray:none}
  .szene .box.S rect{fill:var(--sued);stroke:var(--sued);stroke-dasharray:none}
  .szene .box.r rect{stroke:var(--gruen);stroke-width:4;stroke-dasharray:none}
  .szene .box.f rect{stroke:#111;stroke-width:4;stroke-dasharray:3 2}
  .szene .box text{font-weight:bold;font-size:17px;fill:#fff;pointer-events:none}
  .szene .box .frag{fill:#7b8a95;font-size:15px}
  .tipphinweis{font-size:14px;color:var(--text2);margin:2px 2px 6px}
  .f2{margin-top:8px} .f2 .seg button{font-size:16px}

  /* Erkunden (Mini-Simulationen) */
  .sim{background:#fbfcfd;border:2px solid #e1e6ea;border-radius:12px;padding:6px;margin:8px 0}
  .sim svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;touch-action:pan-y}
  .sim .regler{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:6px 2px}
  .sim .knopf{border:0;border-radius:10px;padding:8px 13px;font-size:15px;font-weight:bold;background:var(--orange);color:#fff;min-height:42px}
  .sim .knopf.grau{background:#e1e6ea;color:var(--dunkel)}
  .sim .knopf:disabled{opacity:.35;cursor:default}
  .sim input[type=range]{flex:1;min-width:160px;accent-color:var(--orange);height:32px}
  .status{background:var(--grau);border-radius:10px;padding:8px 11px;font-size:15.5px;min-height:3.2em;margin-top:6px}
  .messer{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:14px;margin:6px 2px}
  .messer .rohr{position:relative;height:14px;border-radius:7px;background:#e1e6ea;overflow:hidden}
  .messer .rohr i{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--feld);border-radius:7px}
  .messer .rohr.mitte::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#7b8a95}
  .messer .rohr.mitte i{border-radius:0}
  .auftrag{background:#EEF6F8;border:1.5px solid #9cc9d4;border-radius:12px;padding:8px 12px;margin:6px 0 4px;font-size:16px}
  .groß{display:inline-block;margin-top:6px;font-weight:bold;color:var(--petrol2)}
  .frage-nach{margin-top:14px;border-top:2px solid #eef1f3;padding-top:10px}

  /* Navigation unten */
  .nav{display:flex;justify-content:space-between;gap:10px;max-width:680px;margin:10px auto 0;padding:0 12px}
  .nav button{border:0;border-radius:12px;padding:10px 18px;font-size:16.5px;font-weight:bold;min-height:48px;background:rgba(255,255,255,.18);color:#fff}
  .nav button.vor{background:#fff;color:var(--petrol)}
  .nav button.vor.jetzt{background:var(--gelb);color:#222;box-shadow:0 0 0 4px rgba(255,210,63,.35)}
  .nav button:disabled{opacity:.3;cursor:default}

  /* Start und Ende */
  .fahrplan{list-style:none;padding:0;margin:10px 0}
  .fahrplan li{display:flex;gap:10px;align-items:flex-start;margin:9px 0}
  .fahrplan .tag{flex:none;min-width:78px;text-align:center}
  .los{display:block;width:100%;border:0;border-radius:999px;min-height:52px;font-size:18px;font-weight:bold;color:#fff;margin-top:10px;
       background:linear-gradient(135deg,#8E3BA6,#5B3FC4)}
  .los.zweit{background:#e1e6ea;color:var(--dunkel)}
  table.erg{border-collapse:collapse;width:100%;font-size:15.5px;margin:6px 0}
  table.erg td{padding:5px 6px;border-bottom:1px solid #e5e9ec}
  table.erg td:last-child{text-align:right;font-weight:bold;white-space:nowrap}
  .sterne{font-size:30px;letter-spacing:4px;text-align:center;margin:4px 0}
  .springe{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .springe button{border:2px solid #d5dde3;background:#fff;border-radius:999px;padding:5px 12px;font-size:14.5px;min-height:38px}

  @media (prefers-reduced-motion:reduce){ .karte,ol.kette li{animation:none;opacity:1} .balken i{transition:none} }
</style>

<header>
  <a class="zurStart" href="material.html">‹ Material</a>
  <small>Physik 10c · 2.3 Regel von Lenz · Quiz zum Üben</small>
  <h1>Quiz: Induktion und Regel von Lenz</h1>
  <div class="teile" id="teile"></div>
  <div class="fort"><div class="balken"><i id="balken"></i></div><span class="pkt" id="zaehler"></span></div>
</header>
<main><section class="karte" id="karte"></section></main>
<div class="nav"><button type="button" id="zur">‹ Zurück</button><button type="button" class="vor" id="vor">Weiter ›</button></div>

<script>
/* =====================================================================
   Physik 10c · 2.3 Quiz: Induktion und Regel von Lenz (Stand 24.11.2026)
   Ziel: Grundlagen „reinhämmern“ – dieselbe Information in vielen Formen:
     Elektromagnetismus (Strom → Magnetfeld) · Induktion (Magnetfeldstärke ändert sich → Induktionsspannung)
     · Induktionsstrom (nur bei geschlossenem Stromkreis) · Regel von Lenz (Pole am Ring/an der Spule)
   Erklärungen immer als Kette: 0. Ursache → … → Wirkung (Benennungsregel der Einheit).
   Richtung nur über Pole (Abstoßung/Anziehung), ohne Linke-Hand-Regel (Zweig II).
   Kartentypen: merke · einzel · mehr · luecke · fehler · ordnen · tabelle · pole · erkunden
   ===================================================================== */

/* ---------- kleine Helfer ---------- */
var NP = '<span class="pn">Nordpol</span>', SP = '<span class="ps">Südpol</span>';
function polName(p) { return p === 'N' ? NP : SP; }
function anders(p) { return p === 'N' ? 'S' : 'N'; }
/* Kette: Schritte ab 0; Schritt 0 = Ursache, Schritt w = Wirkung */
function K(schritte, w) {
  if (w === undefined) w = 2;
  return '<ol class="kette">' + schritte.map(function (s, i) {
    var cls = i === 0 ? 'u' : (i === w ? 'w' : ''), lab = i === 0 ? '<span class="lab">Ursache:</span> ' : (i === w ? '<span class="lab">Wirkung:</span> ' : '');
    return '<li class="' + cls + '" style="animation-delay:' + (i * 0.32).toFixed(2) + 's"><span class="n">' + i + '</span><span>' + lab + s + '</span></li>';
  }).join('') + '</ol>';
}
var TAGS = { em: ['t-em', 'Strom → Magnetfeld'], ind: ['t-ind', 'Induktion'], strom: ['t-strom', 'Induktionsstrom'],
             lenz: ['t-lenz', 'Regel von Lenz'], pole: ['t-pole', 'Pole bestimmen'] };
var TEILE = { A: 'A · Grundlagen', B: 'B · Regel von Lenz', C: 'C · Endspurt' };

/* Ketten, die oft vorkommen */
var K_EM = function (ursache, folge) {
  return K([ursache || 'Es fließt ein elektrischer Strom.', 'Um den Leiter entsteht ein Magnetfeld.'].concat(folge ? [folge] : []), 1) +
    'Diese Erscheinung heißt <b>Elektromagnetismus</b>: Immer wenn ein Strom fließt, entsteht ein Magnetfeld.';
};
var K_RING = function (pol, hin) {
  return K([ 'Der Magnet wird mit dem ' + polName(pol) + (hin ? ' zum Ring hinbewegt.' : ' vom Ring weggezogen.'),
    'Die Magnetfeldstärke im Ring ändert sich.',
    'Es entsteht eine Induktionsspannung; im geschlossenen Ring fließt ein Induktionsstrom.',
    'Der Induktionsstrom erzeugt ein eigenes Magnetfeld – der Ring wird zum Magneten.',
    hin ? 'Der Ring zeigt dem Magneten einen ' + polName(pol) + ': gleichnamige Pole → <b>Abstoßung</b>.'
        : 'Der Ring zeigt dem Magneten einen ' + polName(anders(pol)) + ': ungleichnamige Pole → <b>Anziehung</b>.' ]);
};
var MERKE_INDUKTION = '<div class="merke"><h3>Merke: Elektromagnetische Induktion</h3><ol>' +
  '<li>Ändert sich die <b>Magnetfeldstärke</b> in einer Spule (z. B. durch Bewegung eines Magneten oder der Spule), …</li>' +
  '<li>… entsteht zwischen den Enden der Spule eine <b>Induktionsspannung</b> U<sub>ind</sub>.</li>' +
  '<li>Ist der Stromkreis <b>geschlossen</b>, fließt ein <b>Induktionsstrom</b> I<sub>ind</sub>.</li></ol></div>';
var MERKE_EM = '<div class="merke"><h3>Merke: Elektromagnetismus</h3>Immer wenn ein elektrischer <b>Strom</b> fließt, entsteht um den Leiter ein <b>Magnetfeld</b>. ' +
  'Eine Spule, durch die Strom fließt, wird so zum Magneten (Elektromagnet).</div>';

/* =====================================================================
   DIE KARTEN
   ===================================================================== */
var KARTEN = [
  { typ: 'start' },

  /* ---------------- Teil A: Grundlagen ---------------- */
  { teil: 'A', tag: 'em', typ: 'einzel', frage: 'Durch ein Kabel fließt ein elektrischer Strom. Was entsteht dabei <b>immer</b> um das Kabel herum?',
    a: [ { t: 'Ein Magnetfeld.', ok: true },
         { t: 'Nichts – dafür braucht man einen Magneten.', fb: 'Auch ohne Magnet: Jeder Strom erzeugt ein Magnetfeld.' },
         { t: 'Eine Induktionsspannung.', fb: 'Dafür müsste sich die Magnetfeldstärke in einer Spule ändern. Hier fließt einfach ein Strom.' },
         { t: 'Nur Wärme.', fb: 'Warm wird das Kabel auch – aber es entsteht immer auch ein Magnetfeld.' } ],
    warum: K_EM('Durch das Kabel fließt ein Strom.') },

  { teil: 'A', tag: 'ind', typ: 'einzel', frage: 'Wann entsteht in einer Spule eine <b>Induktionsspannung</b>?',
