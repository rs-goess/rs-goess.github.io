<title>2.6 Übung Gewichtskraft, Masse und Ortsfaktor – Lernpfad</title>

<body>
<script>
/* =====================================================================
   Physik 8b · 2.6 Übungsblatt Gewichtskraft, Masse und Ortsfaktor – Lernpfad
   Bilder: bilder/2-6/ue-*.webp · Maße in cm wie in der PowerPoint (21 × 29,7 cm)
   Auf der Erde: g = 9,81 N/kg. Bewertung wie in der Ex 8b: geg./ges. ½ · Formel ½ · Ergebnis mit Einheit + Ziffern 1
   ===================================================================== */
var U = function (e) { return '\\,\\mathrm{' + e + '}'; };
var NKG = '\\,\\dfrac{\\mathrm{N}}{\\mathrm{kg}}';
var NKGt = '\\,\\tfrac{\\mathrm{N}}{\\mathrm{kg}}';
var FG = 'F_{\\mathrm{G}}';
var FGE = 'F_{\\mathrm{G,Erde}}', FGM = 'F_{\\mathrm{G,Mars}}', GE = 'g_{\\mathrm{Erde}}', GM = 'g_{\\mathrm{Mars}}';
var EIN = '\\phantom{a)\\;\\;}';
function ZELLE(x, y, z, s, o) { return Object.assign({ x: x, y: y, z: z, s: s, mitte: true }, o || {}); }
function SATZ(x, y, z, s, o) { return Object.assign({ x: x, y: y, z: z, s: s, cls: 'satz' }, o || {}); }

var E_ZIFFERN = function (angaben, erg) { return { schritte: [
  { k: 'Regel', t: 'Das Ergebnis bekommt so viele Ziffern wie die Angabe mit den <b>wenigsten Ziffern</b> – aber mindestens 2.' },
  { k: 'Ziffern zählen', t: angaben },
  { k: 'Also', f: erg }] }; };
var E_EINHEIT_N = { schritte: [
  { k: 'Einheiten', t: 'Kilogramm mal Newton pro Kilogramm: Das kg kürzt sich weg.', f: '$\\mathrm{kg} \\cdot \\dfrac{\\mathrm{N}}{\\mathrm{kg}} = \\mathrm{N}$' },
  { k: 'Taschenrechner', t: 'Tippe nur die Zahlen: <b>6,5 × 9,81</b>.' }] };
var E_PLANET = { schritte: [
  { k: 'Was misst man?', t: 'Die Masse des Massestücks kennt man (4,0 kg). Der Kraftmesser misst, wie stark Planet X daran zieht (18 N).' },
  { k: 'Ortsfaktor', t: 'Der Ortsfaktor sagt, wie viel Newton auf <b>jedes Kilogramm</b> wirken – also Kraft geteilt durch Masse:', f: '$g = \\dfrac{' + FG + '}{m}$' },
  { k: 'Genau so', t: 'haben wir in Versuch 2 den Ortsfaktor der Erde bestimmt.' }] };
var E_WAAGE = { schritte: [
  { k: 'Was misst die Waage wirklich?', t: 'In einer Personenwaage steckt ein Sensor, der misst, wie stark du auf die Waage <b>drückst</b>. Das ist deine <b>Gewichtskraft</b>.' },
  { k: 'Umrechnen', t: 'Die Waage rechnet diese Kraft mit dem Ortsfaktor der Erde in kg um:', f: '$m_{\\mathrm{Anzeige}} = \\dfrac{' + FG + '}{9{,}81' + NKGt + '}$' },
  { k: 'Auf dem Mond', t: 'Lisas Gewichtskraft ist dort nur', f: '$' + FG + ' = 50' + U('kg') + ' \\cdot 1{,}6' + NKGt + ' = 80' + U('N') + '$' },
  { k: 'Anzeige', t: 'Die Waage rechnet trotzdem mit dem Ortsfaktor der Erde:', f: '$\\dfrac{80' + U('N') + '}{9{,}81' + NKGt + '} \\approx 8' + U('kg') + '$' },
  { k: 'Gut zu wissen', t: 'Eine <b>Balkenwaage</b> vergleicht mit Wägestücken. Die werden auf dem Mond genauso schwächer angezogen – deshalb zeigt sie auch dort 50 kg.' }] };

window.PFAD = {
  fach: 'Physik 8b', titel: '2.6 Übung Gewichtskraft, Masse und Ortsfaktor', zurueck: 'material.html', breite: 21,
  ueberschrift: 'Lernpfad zum Übungsblatt – Lösung Zeile für Zeile',
  karten: [

  /* ===================== Start ===================== */
  { chip: 'Start', start: true, titel: '2.6 Übung: Gewichtskraft, Masse und Ortsfaktor',
    html:
    '<p>Hier siehst du dein Übungsblatt. Mit <span class="mini" style="background:var(--petrol2);color:#fff">Nächster Schritt</span> erscheint die Lösung <b>Zeile für Zeile</b> in Blau.</p>' +
    '<ol class="start"><li>Erst <b>selbst</b> rechnen – mit Taschenrechner.</li><li>Ergebnis bei <b>Ergebnis prüfen</b> eingeben.</li>' +
    '<li>Hängst du fest? <span class="mini" style="background:var(--gelb)">Tipp</span> hilft beim nächsten Schritt. Der gelbe Rahmen zeigt, wo die nächste Zeile hinkommt.</li>' +
    '<li><span class="mini" style="background:var(--orange);color:#fff">Glühbirne</span> = Erklärung zu einer schwierigen Zeile.</li>' +
    '<li>Mit <b>Bewertung einblenden</b> siehst du grüne Haken – so wird in der Ex korrigiert: Punkte gibt es für <b>geg./ges.</b>, die <b>Formel</b> und das <b>Ergebnis mit Einheit</b>. <span class="mini-haken"><svg viewBox="0 0 26 24"><path d="M2 13 L9 20 L24 2" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span> = 1 Punkt, <span class="mini-haken"><svg viewBox="0 0 26 24"><path d="M2 12 L9 20 L17 8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span> = ½ Punkt.</li></ol>' +
    '<div class="box">📱 Am Handy: <b>quer halten</b> oder die <b>Lupe</b> nehmen. Zoomen mit zwei Fingern geht auch.</div>' +
    '<div class="box"><b>Fahrplan:</b> geg. → ges. → Formel → Einsetzen mit Einheiten → Ergebnis (sinnvoll runden) → Antwort.</div>' +
    '<div class="merk"><b>Die zwei Formeln</b><br>$' + FG + ' = m \\cdot g$ &nbsp;·&nbsp; $g = \\dfrac{' + FG + '}{m}$<br>Auf der Erde: $g = 9{,}81' + NKG + '$</div>' },

  /* ===================== Aufgabe 1: Bowling auf dem Mars ===================== */
  { chip: 'A1', name: 'Aufgabe 1',
    check: { frage: 'b) Ergebnis prüfen: Gib die Gewichtskraft der Kugel auf dem Mars ein.', einh: 'N', ok: [24], exakt: 24.05, bsp: '24',
      runden: 'Wie viele Ziffern haben 6,5 kg und 3,7 N/kg?',
      fehler: [{ w: 64, t: 'Das ist die Gewichtskraft auf der <b>Erde</b> (Teil a). Rechne jetzt mit dem Ortsfaktor des Mars.' },
               { w: 63.765, rel: 0.002, t: 'Das ist die Gewichtskraft auf der <b>Erde</b> (Teil a). Rechne jetzt mit dem Ortsfaktor des Mars.' },
               { w: 1.757, rel: 0.02, t: '<b>Geteilt statt mal?</b> Die Gewichtskraft ist Masse <b>mal</b> Ortsfaktor.' }] },
    teile: [
      { bild: 'bilder/2-6/ue-a1.webp', top: 2.3, y0: 2.3, y1: 4.3 },
      { rechnung: { x0: 1.5, w: 18.0, strich: 7.5, lx: 1.75,
        links: [
          { z: '$m = 6{,}5' + U('kg') + '$', tipp: 'Die Masse der Kugel – mit Formelzeichen.' },
          { z: '$' + GE + ' = 9{,}81' + NKGt + '$', tipp: 'Ortsfaktor der Erde.' },
          { z: '$' + GM + ' = 3{,}7' + NKGt + '$', tipp: 'Ortsfaktor des Mars.' }],
        ges: { z: 'a) $' + FGE + '$ &nbsp;b) $' + FGM + '$', p: 0.5, tipp: 'Zweimal die Gewichtskraft – einmal auf der Erde, einmal auf dem Mars.' },
        rechts: [
          { z: 'a) &nbsp;$' + FGE + ' = m \\cdot ' + GE + '$', s: 'a) Formel', p: 0.5, tipp: 'Gewichtskraft = Masse mal Ortsfaktor.' },
          { z: '$' + EIN + FGE + ' = 6{,}5' + U('kg') + ' \\cdot 9{,}81' + NKGt + '$', s: 'a) Einsetzen', tipp: 'Zahlen mit Einheiten einsetzen.', erkl: E_EINHEIT_N },
          { z: '$' + EIN + FGE + ' = 63{,}765' + U('N') + ' \\approx$&nbsp;<span class="unter">$64' + U('N') + '$</span>', s: 'a) Ergebnis', p: 1,
            tipp: 'Runde auf so viele Ziffern wie die ungenaueste Angabe.', erkl: E_ZIFFERN('$6{,}5$ kg → 2 Ziffern · $9{,}81$ N/kg → 3 Ziffern. Am wenigsten: 2.', '$63{,}765' + U('N') + ' \\approx 64' + U('N') + '$') },
          { z: 'b) &nbsp;$' + FGM + ' = m \\cdot ' + GM + '$', s: 'b) Formel', p: 0.5, tipp: 'Dieselbe Masse – nur ein anderer Ortsfaktor.' },
          { z: '$' + EIN + FGM + ' = 6{,}5' + U('kg') + ' \\cdot 3{,}7' + NKGt + '$', s: 'b) Einsetzen', tipp: 'Die Masse bleibt 6,5 kg – auch auf dem Mars!' },
          { z: '$' + EIN + FGM + ' = 24{,}05' + U('N') + ' \\approx$&nbsp;<span class="unter">$24' + U('N') + '$</span>', s: 'b) Ergebnis', p: 1,
            tipp: 'Beide Angaben haben 2 Ziffern.' }],
        antwort: { z: 'Die Kugel hat auf der Erde etwa 64 N Gewichtskraft, auf dem Mars nur etwa 24 N.', tipp: 'Beide Ergebnisse in einem ganzen Satz.' } } }
    ] },

  /* ===================== Aufgabe 2: Planet X ===================== */
  { chip: 'A2', name: 'Aufgabe 2',
    check: { frage: 'a) Ergebnis prüfen: Gib den Ortsfaktor auf Planet X ein.', einh: 'N/kg', ok: [4.5], exakt: 4.5, bsp: '4,5',
      fehler: [{ w: 72, t: '<b>Mal statt geteilt?</b> Der Ortsfaktor ist Kraft <b>geteilt</b> durch Masse.' },
               { w: 0.2222, rel: 0.02, t: '<b>Bruch falsch herum?</b> Oben steht die Gewichtskraft, unten die Masse.' },
               { w: 9.81, t: 'Das ist der Ortsfaktor der <b>Erde</b>. Rechne mit den Messwerten von Planet X.' }] },
    teile: [
      { bild: 'bilder/2-6/ue-a2.webp', top: 8.7, y0: 8.7, y1: 10.85 },
      { rechnung: { x0: 1.5, w: 18.0, strich: 7.5, lx: 1.75,
        links: [
          { z: '$m = 4{,}0' + U('kg') + '$', tipp: 'Masse des Massestücks.' },
          { z: '$' + FG + ' = 18' + U('N') + '$', tipp: 'Was zeigt der Kraftmesser an?' }],
        ges: { z: '$g$', p: 0.5, tipp: 'Gesucht ist der Ortsfaktor auf Planet X.' },
        rechts: [
          { z: 'a) &nbsp;$g = \\dfrac{' + FG + '}{m}$', s: 'Formel', p: 0.5, tipp: 'Wie in Versuch 2: Gewichtskraft geteilt durch Masse.', erkl: E_PLANET },
          { z: '$' + EIN + 'g = \\dfrac{18' + U('N') + '}{4{,}0' + U('kg') + '}$', s: 'Einsetzen', tipp: 'Zahlen mit Einheiten einsetzen.' },
          { z: '$' + EIN + 'g =$&nbsp;<span class="unter">$4{,}5' + NKGt + '$</span>', s: 'Ergebnis', p: 1, tipp: '18 geteilt durch 4. Die Einheit: N geteilt durch kg.' }],
        antwort: { z: 'Auf Planet X beträgt der Ortsfaktor 4,5 N/kg – weniger als halb so viel wie auf der Erde.', tipp: 'Vergleiche mit der Erde.' } } },
      { bild: 'bilder/2-6/ue-a2b.webp', top: 14.25, y0: 14.25, y1: 15.95, zeilen: [
        SATZ(2.15, 14.55, 'Höher: Der Ortsfaktor ist auf Planet X kleiner (4,5 N/kg statt 9,81 N/kg).', 'b) 1. Satz', { p: 0.5,
          tipp: 'Vergleiche den Ortsfaktor von Planet X mit dem der Erde.' }),
        SATZ(2.15, 15.31, 'Deshalb zieht dich dort eine kleinere Gewichtskraft nach unten.', 'b) 2. Satz', { p: 0.5,
          tipp: 'Was bedeutet ein kleinerer Ortsfaktor für deine Gewichtskraft?',
          erkl: { schritte: [
            { k: 'Masse bleibt', t: 'Deine Masse ist auf Planet X genauso groß wie auf der Erde.' },
            { k: 'Gewichtskraft', t: 'Mit dem kleineren Ortsfaktor ist deine Gewichtskraft dort kleiner – Planet X zieht dich schwächer nach unten.' },
            { k: 'Springen', t: 'Mit derselben Sprungkraft kommst du deshalb höher – wie die Astronauten auf dem Mond.' }] } })] }
    ] },

  /* ===================== Aufgabe 3: Rangfolge ===================== */
  { chip: 'A3', name: 'Aufgabe 3',
    bild: { src: 'bilder/2-6/ue-a3.webp', y0: 16.25, y1: 23.6 },
    zeilen: [
      ZELLE(15.6, 18.75, '$16' + U('N') + '$', 'Koffer', { tipp: '$' + FG + ' = m \\cdot g = 10' + U('kg') + ' \\cdot 1{,}6' + NKGt + '$' }),
      ZELLE(15.6, 19.45, '$\\approx 22' + U('N') + '$', 'Hantel', { tipp: '$6{,}0' + U('kg') + ' \\cdot 3{,}7' + NKGt + ' = 22{,}2' + U('N') + '$' }),
      ZELLE(15.6, 20.15, '$\\approx 20' + U('N') + '$', 'Kartoffeln', { tipp: '$2{,}0' + U('kg') + ' \\cdot 9{,}81' + NKGt + ' = 19{,}62' + U('N') + '$' }),
      ZELLE(15.6, 20.85, '$\\approx 25' + U('N') + '$', 'Äpfel', { tipp: '$1{,}0' + U('kg') + ' \\cdot 24{,}8' + NKGt + ' = 24{,}8' + U('N') + '$' }),
      ZELLE(18.6, 20.85, '1', 'Platz 1', { tipp: 'Welcher Gegenstand hat die größte Gewichtskraft?' }),
      ZELLE(18.6, 19.45, '2', 'Platz 2', { tipp: 'Welche Gewichtskraft ist die zweitgrößte?' }),
      ZELLE(18.6, 20.15, '3', 'Platz 3', { tipp: '20 N liegt zwischen 16 N und 22 N.' }),
      ZELLE(18.6, 18.75, '4', 'Platz 4', { tipp: 'Wer bleibt übrig?' }),
      SATZ(1.6, 22.1, 'Die Äpfel haben die kleinste Masse, aber die größte Gewichtskraft – beim Koffer ist es umgekehrt.', 'Was fällt auf? 1',
        { tipp: 'Vergleiche die Masse mit dem Platz in der Rangfolge.' }),
      SATZ(1.6, 22.86, 'Die Gewichtskraft hängt von der Masse und vom Ortsfaktor ab.', 'Was fällt auf? 2',
        { tipp: 'Wovon hängt die Gewichtskraft also ab – nur von der Masse?',
          erkl: { schritte: [
            { k: 'Formel', f: '$' + FG + ' = m \\cdot g$' },
            { k: 'Zwei Faktoren', t: 'Die Gewichtskraft wird groß, wenn die Masse groß ist <b>oder</b> der Ortsfaktor groß ist.' },
            { k: 'Jupiter', t: 'Der Jupiter zieht fast zweieinhalbmal so stark wie die Erde – deshalb gewinnen die leichten Äpfel.' }] } })
    ] },

  /* ===================== Aufgabe 4: Knobeln ===================== */
  { chip: 'A4', name: 'Aufgabe 4',
    bild: { src: 'bilder/2-6/ue-a4.webp', y0: 23.8, y1: 28.75 },
    zeilen: [
      SATZ(1.6, 26.45, 'Nein, Lisas Masse bleibt überall 50 kg.', 'Antwort', { tipp: 'Ändert sich die Masse, wenn man zum Mond fliegt?' }),
      SATZ(1.6, 27.21, 'Die Personenwaage misst eigentlich die Gewichtskraft und rechnet sie mit 9,81 N/kg in kg um.', 'Was misst die Waage?',
        { tipp: 'Die Waage spürt, wie stark Lisa auf sie drückt. Welche Kraft ist das?', erkl: E_WAAGE }),
      SATZ(1.6, 27.97, 'Auf dem Mond ist Lisas Gewichtskraft kleiner – deshalb zeigt die Waage weniger an.', 'Begründung',
        { tipp: 'Wie groß ist Lisas Gewichtskraft auf dem Mond im Vergleich zur Erde?' })
    ] },

  /* ===================== Ende ===================== */
  { chip: 'Ende', start: true, titel: 'Geschafft! 🎉',
    html: '<p>Checkliste für die Ex:</p><ul><li>Die <b>Masse</b> ist überall gleich, die <b>Gewichtskraft</b> hängt vom Ortsfaktor ab.</li>' +
      '<li>Ich berechne die Gewichtskraft mit $' + FG + ' = m \\cdot g$ – auch mit anderen Ortsfaktoren.</li>' +
      '<li>Ich bestimme einen Ortsfaktor mit $g = \\dfrac{' + FG + '}{m}$.</li>' +
      '<li>Ich schreibe geg. und ges. auf, setze mit Einheiten ein und runde sinnvoll.</li></ul>' +
      '<p><a href="ab-2-6.html" style="color:var(--petrol2);font-weight:bold">← Lernpfad zum Arbeitsblatt 2.6</a> &nbsp;·&nbsp; <a href="material.html" style="color:var(--petrol2);font-weight:bold">Zum Material</a></p>' }
  ] };
</script>
