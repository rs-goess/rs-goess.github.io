<script>
/* =====================================================================
   Physik 7a · 2.7 Quiz Gewichtskraft und Ortsfaktor (zum Üben vor dem Leistungstest)
   Übernommen aus p8/quiz-2-6.html (25.11.2026), angepasst an die 7a: ohne Taschenrechner (g ≈ 10 N/kg, Kopfrechnen),
   keine sinnvollen Ziffern, N/kg als Bruch, Bewertung wie im LT 7a
   Teil B: Begriffe (Auswahl, Lückentext) · Teil R: Rechnen im Lernpfad-Format · Teil L: Logikfragen
   Aufgabenbilder: bilder/2-7-quiz/r1–r4.webp (selbst gesetzt im AB-Stil, 21 cm breit, 104 px/cm)
   Bewertung Rechnen: geg./ges. ½ · Formel 1 · Einsetzen mit Einheiten ½ · Ergebnis: Wert ½ + Einheit ½  → 3 Punkte je Aufgabe
   ===================================================================== */
var U = function (e) { return '\\,\\mathrm{' + e + '}'; };
var NKG = '\\,\\dfrac{\\mathrm{N}}{\\mathrm{kg}}';
var NKGt = '\\,\\tfrac{\\mathrm{N}}{\\mathrm{kg}}';
var FG = 'F_{\\mathrm{G}}';

var E_MAL10 = { schritte: [
  { k: 'Einheiten', t: 'Kilogramm mal Newton pro Kilogramm: Das kg kürzt sich weg.', f: '$\\mathrm{kg} \\cdot \\dfrac{\\mathrm{N}}{\\mathrm{kg}} = \\mathrm{N}$' },
  { k: 'Mal 10 im Kopf', t: 'Mal 10 heißt: Komma <b>eine Stelle nach rechts</b>.', f: '$7{,}5 \\cdot 10 = 75$' }] };
var E_MOND = { schritte: [
  { k: 'Zerlegen', t: 'Zerlege 150 in 100 und 50 – das rechnet sich leichter.', f: '$150 \\cdot 1{,}6 = 100 \\cdot 1{,}6 + 50 \\cdot 1{,}6$' },
  { k: 'Teile rechnen', t: '$100 \\cdot 1{,}6 = 160$ und $50 \\cdot 1{,}6$ ist die Hälfte davon:', f: '$160 + 80 = 240$' },
  { k: 'Einheit', t: 'kg mal N/kg ergibt N – also $240\\,\\mathrm{N}$.' }] };
var E_ZYRA = { schritte: [
  { k: 'Trick: beide verdoppeln', t: 'Durch 2,5 teilt man schlecht im Kopf. Verdopple oben und unten – der Bruch bleibt gleich groß:', f: '$\\dfrac{30}{2{,}5} = \\dfrac{60}{5}$' },
  { k: 'Ausrechnen', f: '$\\dfrac{60}{5} = 12$' },
  { k: 'Probe', t: '$2{,}5 \\cdot 12 = 30$ ✓', f: '$\\dfrac{\\mathrm{N}}{\\mathrm{kg}}$ bleibt als Einheit stehen.' }] };
var E_ROVER = { schritte: [
  { k: 'Kürzen', t: 'Beide Zahlen enden auf 0 – streiche bei beiden eine Null:', f: '$\\dfrac{3330}{900} = \\dfrac{333}{90}$' },
  { k: 'Überschlag', t: '$90 \\cdot 3 = 270$ und $90 \\cdot 4 = 360$ – das Ergebnis liegt also zwischen 3 und 4.' },
  { k: 'Genau', t: '$90 \\cdot 3{,}7 = 270 + 63 = 333$ ✓', f: '$\\dfrac{333}{90} = 3{,}7$' }] };
/* Umstellen von F_G = m · g nach g – beide Wege (erst umstellen oder erst einsetzen), Wunsch 24.11. */
var E_UMSTELLEN = function (F, m) { return { schritte: [
  { k: 'Woher kommt die Formel?', t: 'Du kennst: Gewichtskraft = Masse mal Ortsfaktor.', f: '$' + FG + ' = m \\cdot g$' },
  { k: 'Umstellen nach g', t: '$g$ soll allein stehen. Neben $g$ steht „$m \\cdot$“ – also teilst du beide Seiten durch $m$.', f: '$' + FG + ' = m \\cdot g \\quad | :m$' },
  { k: 'Kürzen', t: 'Rechts kürzt sich $m$ weg:', f: '$\\dfrac{' + FG + '}{m} = \\dfrac{\\weg{m} \\cdot g}{\\weg{m}}$' },
  { k: 'Ergebnis', t: 'Seiten tauschen – fertig ist die Formel für den Ortsfaktor:', f: '$g = \\dfrac{' + FG + '}{m}$' },
  { k: 'Auch richtig: erst einsetzen', t: 'Du kannst auch zuerst die Werte <b>mit Einheiten</b> in $' + FG + ' = m \\cdot g$ einsetzen und dann durch die Masse teilen:',
    f: '$' + F + U('N') + ' = ' + m + U('kg') + ' \\cdot g \\quad | :' + m + U('kg') + '$' },
  { k: 'Gleiche Rechnung', f: '$g = \\dfrac{' + F + U('N') + '}{' + m + U('kg') + '}$', t: 'Beide Wege führen zur selben Rechnung – beide sind richtig.' }] }; };

/* ---------- Quiz-Fragen ---------- */
var QZ = {
  b1: { typ: 'einzel', frage: 'Was versteht man unter der <b>Gewichtskraft</b>?',
    a: [ { t: 'Die Kraft, mit der ein Himmelskörper (z. B. die Erde) einen Körper anzieht.', ok: true },
         { t: 'Wie viel Stoff in einem Körper steckt.', fb: 'Das ist die <b>Masse</b>.' },
         { t: 'Die Anzeige einer Küchenwaage in Kilogramm.', fb: 'Kilogramm ist die Einheit der <b>Masse</b>.' },
         { t: 'Wie viel Newton auf 1 kg wirken.', fb: 'Das ist der <b>Ortsfaktor</b>.' } ],
    warum: 'Die Erde zieht jeden Körper zu ihrem Mittelpunkt hin. Diese Kraft heißt Gewichtskraft $' + FG + '$.' },
  b2: { typ: 'luecke', frage: 'Ergänze mit dem Wortspeicher.',
    saetze: [ 'Die Masse hat das Formelzeichen [$m$] und die Einheit [kg]. Man misst sie mit einer [Waage].',
              'Die Gewichtskraft hat das Formelzeichen [$' + FG + '$] und die Einheit [N]. Man misst sie mit einem [Kraftmesser].',
              'Der Ortsfaktor hat das Formelzeichen [$g$] und die Einheit [$\\tfrac{\\mathrm{N}}{\\mathrm{kg}}$].' ],
    extra: [ 'Lineal', '$\\tfrac{\\mathrm{kg}}{\\mathrm{N}}$' ],
    warum: 'Masse: $m$ in kg (Waage)<br>Gewichtskraft: $' + FG + '$ in N (Kraftmesser)<br>Ortsfaktor: $g$ in $\\tfrac{\\mathrm{N}}{\\mathrm{kg}}$.' },
  b3: { typ: 'einzel', frage: 'Was gibt der <b>Ortsfaktor</b> an?',
    a: [ { t: 'Wie viel Newton Gewichtskraft an diesem Ort auf jedes Kilogramm Masse wirken.', ok: true },
         { t: 'Wie viel Kilogramm ein Körper an diesem Ort hat.', fb: 'Die Masse hängt nicht vom Ort ab – sie ist überall gleich.' },
         { t: 'Wie weit ein Ort vom Erdmittelpunkt entfernt ist.', fb: 'Das ist eine Länge – der Ortsfaktor hat die Einheit N/kg.' },
         { t: 'Welche Masse 1 Newton an diesem Ort hat.', fb: 'Andersherum: Newton <b>pro</b> Kilogramm.' } ],
    warum: '$g = \\dfrac{' + FG + '}{m}$ – auf der Erde wirken auf 1 kg etwa 9,81 N ≈ 10 N.' },
  b4: { typ: 'mehr', frage: 'Welche Aussagen stimmen?',
    a: [ { t: 'Die Gewichtskraft greift im Schwerpunkt eines Körpers an.', ok: true },
         { t: 'Die Gewichtskraft zeigt immer senkrecht nach unten – zum Erdmittelpunkt.', ok: true },
         { t: 'Die Masse eines Körpers ist überall im Weltall gleich.', ok: true },
         { t: 'Die Gewichtskraft eines Körpers ist überall gleich.', fb: 'Nein – sie hängt vom Ortsfaktor ab.' },
         { t: 'Auf einer schiefen Rampe zeigt die Gewichtskraft parallel zur Rampe nach unten.', fb: 'Nein – auch dort zeigt sie senkrecht nach unten.' } ],
    warum: 'Angriffspunkt: Schwerpunkt · Richtung: senkrecht nach unten · Betrag: hängt von Masse <b>und</b> Ort ab.' },
  b5: { typ: 'einzel', frage: 'Mia sagt: „Mein Rucksack hat eine Gewichtskraft von 8 kg.“ Was ist falsch?',
    a: [ { t: 'Kilogramm ist die Einheit der Masse. Die Gewichtskraft gibt man in Newton an.', ok: true },
         { t: 'Nichts – Gewichtskraft und Masse sind dasselbe.', fb: 'Masse = wie viel Stoff (kg). Gewichtskraft = wie stark die Erde zieht (N).' },
         { t: 'Es müsste „8 N/kg“ heißen.', fb: 'N/kg ist die Einheit des <b>Ortsfaktors</b>.' },
         { t: 'Ein Rucksack hat keine Gewichtskraft.', fb: 'Jeder Körper mit Masse wird von der Erde angezogen.' } ],
    warum: 'Richtig wäre: Der Rucksack hat eine <b>Masse</b> von 8 kg – seine Gewichtskraft ist etwa $8' + U('kg') + ' \\cdot 10' + NKGt + ' = 80' + U('N') + '$.' },

  zyra: { typ: 'einzel', frage: 'Auf Zyra ist der Ortsfaktor $12' + NKGt + '$. Könntest du dort höher springen als auf der Erde?',
    a: [ { t: 'Nein – Zyra zieht stärker als die Erde. Meine Gewichtskraft ist größer, ich springe etwas weniger hoch.', ok: true },
         { t: 'Ja, weil meine Masse auf Zyra kleiner ist.', fb: 'Die Masse ist überall gleich.' },
         { t: 'Genauso hoch, weil meine Masse überall gleich ist.', fb: 'Die Masse ist gleich – aber die Gewichtskraft nicht.' },
         { t: 'Ja, viel höher – wie auf dem Mond.', fb: 'Der Mond hat einen <b>kleineren</b> Ortsfaktor (etwa 1,6 N/kg).' } ],
    warum: '$12' + NKGt + '$ ist mehr als etwa $10' + NKGt + '$ auf der Erde → auf jedes Kilogramm wirkt mehr Kraft.' },
  planet: { typ: 'einzel', frage: 'Vergleiche deinen Ortsfaktor: Auf welchem Himmelskörper ist der Rover gelandet?',
    a: [ { t: 'Mond ($1{,}6' + NKGt + '$)', fb: 'Dein Ergebnis ist mehr als doppelt so groß.' },
         { t: 'Mars ($3{,}7' + NKGt + '$)', ok: true },
         { t: 'Venus ($8{,}9' + NKGt + '$)', fb: 'Rechne nochmal: 3330 N geteilt durch 900 kg.' },
         { t: 'Jupiter ($24{,}8' + NKGt + '$)', fb: 'Viel zu groß – vergleiche mit deinem Ergebnis.' } ],
    warum: '$3{,}7' + NKGt + '$ passt genau zum Mars. Übrigens: Der echte Mars-Rover „Curiosity“ hat fast genau diese Masse – 899 kg – und fährt seit 2012 über den Mars.' },

  l1: { typ: 'einzel', frage: 'Ein Astronaut fliegt von der Erde zum Mond. Was passiert mit seiner Masse und seiner Gewichtskraft?',
    a: [ { t: 'Die Masse bleibt gleich, die Gewichtskraft wird kleiner.', ok: true },
         { t: 'Beides wird kleiner.', fb: 'Er verliert unterwegs keinen „Stoff“ – die Masse bleibt.' },
         { t: 'Beides bleibt gleich.', fb: 'Der Mond zieht schwächer als die Erde.' },
         { t: 'Die Masse wird kleiner, die Gewichtskraft bleibt gleich.', fb: 'Genau andersherum.' } ],
    warum: '$' + FG + ' = m \\cdot g$: $m$ bleibt gleich, $g$ wird kleiner (etwa $1{,}6' + NKGt + '$ statt etwa $10' + NKGt + '$) – also wird $' + FG + '$ kleiner.' },
  l2: { typ: 'einzel', frage: 'Du packst doppelt so viele gleiche Bücher in deinen Rucksack – die Masse verdoppelt sich. Was passiert mit der Gewichtskraft?',
    a: [ { t: 'Sie wird doppelt so groß.', ok: true },
         { t: 'Sie bleibt gleich.', fb: 'Mehr Masse wird stärker angezogen.' },
         { t: 'Sie wird halb so groß.' },
         { t: 'Sie wird viermal so groß.', fb: 'Doppelte Masse – nicht vierfache.' } ],
    warum: 'Gewichtskraft und Masse sind <b>direkt proportional</b> (Versuch mit den Massestücken): doppelte Masse → doppelte Gewichtskraft.' },
  l3: { typ: 'einzel', frage: 'Ein Gegenstand wird von der Erde zum Jupiter gebracht ($g \\approx 24{,}8' + NKGt + '$). Seine Gewichtskraft ist dort …',
    a: [ { t: '… etwa 2,5-mal so groß wie auf der Erde.', ok: true },
         { t: '… gleich groß, weil die Masse gleich bleibt.', fb: 'Die Masse bleibt gleich – der Ortsfaktor aber nicht.' },
         { t: '… etwa 2,5-mal so klein wie auf der Erde.', fb: 'Jupiter zieht <b>stärker</b>: 24,8 ist mehr als 10.' },
         { t: '… etwa 25-mal so groß wie auf der Erde.', fb: 'Vergleiche 24,8 mit etwa 10 – nicht mit 1.' } ],
    warum: 'Erde etwa $10' + NKGt + '$, Jupiter etwa $25' + NKGt + '$ – und $25 : 10 = 2{,}5$. Jedes Kilogramm wird etwa 2,5-mal so stark angezogen.' },
  l4: { typ: 'einzel', frage: 'Stein A (2 kg) liegt auf dem Mars ($3{,}7' + NKGt + '$). Stein B (1 kg) liegt auf der Erde (etwa $10' + NKGt + '$). Welcher Stein hat die größere Gewichtskraft?',
    a: [ { t: 'Stein B auf der Erde.', ok: true },
         { t: 'Stein A – er hat ja die doppelte Masse.', fb: 'Die Masse allein entscheidet nicht – rechne nach!' },
         { t: 'Beide gleich, weil die Masse überall gleich ist.', fb: 'Die Gewichtskraft hängt auch vom Ort ab.' } ],
    warum: 'A: $2' + U('kg') + ' \\cdot 3{,}7' + NKGt + ' = 7{,}4' + U('N') + '$<br>B: $1' + U('kg') + ' \\cdot 10' + NKGt + ' = 10' + U('N') + '$<br>Die Gewichtskraft hängt von Masse <b>und</b> Ortsfaktor ab.' },
  l5: { typ: 'einzel', frage: 'Eine Raumsonde fliegt weit draußen im All – weit weg von allen Planeten und Sternen. Was stimmt?',
    a: [ { t: 'Ihre Masse ist unverändert, ihre Gewichtskraft ist fast 0 N.', ok: true },
         { t: 'Ihre Masse ist dort 0 kg.', fb: 'Die Sonde verliert keinen Stoff – die Masse bleibt.' },
         { t: 'Masse und Gewichtskraft sind genauso groß wie auf der Erde.', fb: 'Weit weg von allen Himmelskörpern zieht fast nichts an ihr.' },
         { t: 'Ihre Gewichtskraft ist riesig, weil sie so schnell fliegt.', fb: 'Die Gewichtskraft hängt nicht von der Geschwindigkeit ab.' } ],
    warum: 'Ohne einen Himmelskörper in der Nähe ist der Ortsfaktor fast 0 – also auch $' + FG + ' = m \\cdot g$ fast 0. Die Masse bleibt gleich.' }
};

/* ---------- Quiz-Technik ---------- */
var STAND = {};               /* id → true/false beim ersten Überprüfen */
function qtex(s) {
  return String(s || '').replace(/\$([^$]+)\$/g, function (_, x) {
    try { return katex.renderToString(x.replace(/\\cdot(?!\\nobreak)/g, '\\cdot\\nobreak '), { throwOnError: false }); } catch (e) { return x; }
  });
}
function mischen(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function merke(id, ok) {
  if (!(id in STAND)) STAND[id] = ok;
  if (ok) { var sec = document.querySelector('.qz[data-id="' + id + '"]'); sec = sec && sec.closest('section.karte');
    if (sec && sec.pruefe && !sec.querySelector('.check')) { sec.checkOk = true; sec.pruefe(); } }
  auswerten();
}
function knoepfe(box) {
  var d = document.createElement('div');
  d.innerHTML = '<div class="qknopf"><button class="pr" type="button">Überprüfen</button><button class="zeig" type="button" disabled>Lösung anzeigen</button>' +
    '<button class="nochmal" type="button" disabled>Nochmal</button></div><div class="rueck"></div>';
  while (d.firstChild) box.appendChild(d.firstChild);
  return { pr: box.querySelector('.pr'), zeig: box.querySelector('.zeig'), noch: box.querySelector('.nochmal'), rk: box.querySelector('.rueck') };
}
function rueck(q, k, art, text) { k.rk.className = 'rueck ' + art; k.rk.innerHTML = text + (q.warum && art !== 'fast' ? '<div class="warum">' + qtex(q.warum) + '</div>' : ''); }

function baueQuiz(box, id) {
  var q = QZ[id]; if (!q) return;
  if (q.typ === 'luecke') return baueLuecke(box, id, q);
  box.innerHTML = '<p class="frage">' + qtex(q.frage) + (q.typ === 'mehr' ? ' <span class="klein">(mehrere Antworten möglich)</span>' : '') + '</p><ul class="mc ' + q.typ + '"></ul>';
  var ul = box.querySelector('.mc'), k = knoepfe(box), liste = [];
  function aufbauen() {
    ul.innerHTML = ''; liste = []; k.rk.className = 'rueck'; k.rk.innerHTML = '';
    mischen(q.a).forEach(function (a) {
      var li = document.createElement('li'), b = document.createElement('button'); b.type = 'button';
      b.innerHTML = '<span class="kx"></span><span>' + qtex(a.t) + '</span>';
      b.onclick = function () { if (q.typ === 'einzel') liste.forEach(function (x) { x.b.classList.remove('an'); }); b.classList.toggle('an'); };
      li.appendChild(b); ul.appendChild(li); liste.push({ b: b, a: a, li: li });
    });
    k.pr.disabled = false; k.zeig.disabled = true; k.noch.disabled = true;
  }
  k.pr.onclick = function () {
    var gew = liste.filter(function (x) { return x.b.classList.contains('an'); });
    if (!gew.length) { k.rk.className = 'rueck fast'; k.rk.innerHTML = 'Wähle zuerst eine Antwort aus.'; return; }
    var alle = true;
    liste.forEach(function (x) {

    else rueck(q, k, 'falsch', '<b>Noch nicht ganz.</b> Lies die Rückmeldung – dann <b>Nochmal</b> oder <b>Lösung anzeigen</b>.');
    if (!alle) k.rk.querySelector('.warum').hidden = true;

function baueLuecke(box, id, q) {
  var woerter = [];
  var html = q.saetze.map(function (s) {
    return '<p>' + qtex(s.replace(/\[([^\]]+)\]/g, function (_, w) { woerter.push(w); return '§' + (woerter.length - 1) + '§'; }))
      .replace(/§(\d+)§/g, function (_, n) { return '<button type="button" class="luecke" data-n="' + n + '">&nbsp;</button>'; }) + '</p>';
  }).join('');
  box.innerHTML = '<p class="frage">' + qtex(q.frage) + ' <span class="klein">Tippe auf ein Wort – es kommt in die gelbe Lücke. Tippe auf eine volle Lücke, um sie zu leeren.</span></p>' +
    '<div class="speicher"></div><div class="lt">' + html + '</div>';
  var sp = box.querySelector('.speicher'), lk = [].slice.call(box.querySelectorAll('.luecke')), k = knoepfe(box), ziel = null, fertig = false;
  function markiere(l) { lk.forEach(function (x) { x.classList.remove('ziel'); }); ziel = l; if (l) l.classList.add('ziel'); }
  function naechste() { for (var i = 0; i < lk.length; i++) if (lk[i].dataset.v == null) return lk[i]; return null; }
  function aufbauen() {
    sp.innerHTML = ''; fertig = false; k.rk.className = 'rueck'; k.rk.innerHTML = '';
    lk.forEach(function (l) { delete l.dataset.v; l.innerHTML = '&nbsp;'; l.className = 'luecke'; l.disabled = false; });
    mischen(woerter.concat(q.extra || [])).forEach(function (w) {
      var b = document.createElement('button'); b.type = 'button'; b.innerHTML = qtex(w); b.dataset.w = w;
      b.onclick = function () {
        if (fertig) return; var z = ziel || naechste(); if (!z) return;
        if (z.dataset.v != null) freigeben(z);
        z.dataset.v = w; z.innerHTML = qtex(w); b.disabled = true; markiere(naechste());
      };
      sp.appendChild(b);
    });
    k.pr.disabled = false; k.zeig.disabled = true; k.noch.disabled = true; markiere(lk[0]);
  }
  function freigeben(l) { [].forEach.call(sp.children, function (b) { if (b.dataset.w === l.dataset.v) b.disabled = false; }); delete l.dataset.v; l.innerHTML = '&nbsp;'; }
  lk.forEach(function (l) { l.onclick = function () { if (fertig) return; if (l.dataset.v != null) freigeben(l); markiere(l); }; });
  k.pr.onclick = function () {
    if (naechste()) { k.rk.className = 'rueck fast'; k.rk.innerHTML = 'Fülle zuerst alle Lücken.'; return; }
    var alle = true; fertig = true; markiere(null);
    lk.forEach(function (l) { var ok = l.dataset.v === woerter[+l.dataset.n]; l.classList.add(ok ? 'r' : 'f'); l.disabled = true; if (!ok) alle = false; });
    if (alle) rueck(q, k, 'gut', '<b>Alles richtig!</b>');
    else { rueck(q, k, 'falsch', '<b>Rot markierte Lücken stimmen noch nicht.</b> Versuch es nochmal oder lass dir die Lösung zeigen.'); k.rk.querySelector('.warum').hidden = true; }
    k.pr.disabled = true; k.zeig.disabled = alle; k.noch.disabled = false; merke(id, alle);
  };
  k.zeig.onclick = function () {
    lk.forEach(function (l) { l.innerHTML = qtex(woerter[+l.dataset.n]); l.className = 'luecke r'; });
    rueck(q, k, 'gut', 'So ist es richtig.'); k.zeig.disabled = true;
  };
  k.noch.onclick = aufbauen;
  aufbauen();
}

function rechnungG(o) {   /* Gewichtskraft: F_G = m · g */
  return { x0: 1.5, w: 18.0, strich: 7.5, lx: 1.75,
    links: [ { z: '$m = ' + o.m + U('kg') + '$', tipp: o.tm },

    ges: { z: '$' + FG + '$', p: 0.5, pl: 'geg./ges.', tipp: 'Was sollst du berechnen? Schreib das Formelzeichen auf. (½ Punkt für geg. und ges. zusammen)' },
    rechts: [

      { z: '$' + FG + ' = ' + o.m + U('kg') + ' \\cdot ' + o.g + NKG + '$', s: 'Einsetzen', p: 0.5, pl: 'Einsetzen', tipp: 'Setze die Zahlen <b>mit Einheiten</b> ein.' },

    antwort: { z: o.satz, tipp: 'Antworte in einem ganzen Satz.' } };
}
function rechnungO(o) {   /* Ortsfaktor: g = F_G / m */
  return { x0: 1.5, w: 18.0, strich: 7.5, lx: 1.75,
    links: [ { z: '$m = ' + o.m + U('kg') + '$', tipp: o.tm },
             { z: '$' + FG + ' = ' + o.F + U('N') + '$', tipp: o.tF } ],
    ges: { z: '$g$', p: 0.5, pl: 'geg./ges.', hdy: -0.5, tipp: 'Gesucht ist der Ortsfaktor. (½ Punkt für geg. und ges. zusammen)' },
    rechts: [

      { z: '$g = \\dfrac{' + o.F + U('N') + '}{' + o.m + U('kg') + '}$', s: 'Einsetzen', p: 0.5, pl: 'Einsetzen', tipp: 'Oben die Gewichtskraft, unten die Masse – jeweils <b>mit Einheit</b>.' },
      { z: '$g = \\underline{\\underline{' + o.erg + NKG + '}}$', s: 'Ergebnis', p: 1, pl: [[0.5, 'Wert'], [0.5, 'Einheit']], tipp: 'Im Kopf rechnen! Wert (½ Punkt) und Einheit N/kg (½ Punkt).', erkl: o.erklE }],
    antwort: { z: o.satz, tipp: 'Antworte in einem ganzen Satz.' } };
}
