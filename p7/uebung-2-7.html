<title>2.7 Übung Masse, Ortsfaktor und Gewichtskraft – Lernpfad</title>

<body>
<script>
/* =====================================================================
   Physik 7a · 2.7 Übungsblatt Masse, Ortsfaktor und Gewichtskraft – Lernpfad
   Bilder: bilder/2-7/ue-*.webp · Maße in cm wie in der PowerPoint (21 × 29,7 cm)
   7a rechnet ohne Taschenrechner: g ≈ 10 N/kg, Werte im Kopf rechenbar.
   Bewertung wie im Leistungstest 7a: geg./ges. ½ · Formel bzw. Umstellen 1 · Einsetzen ½ · Ergebnis ½ + Einheit ½
   ===================================================================== */
var U = function (e) { return '\\,\\mathrm{' + e + '}'; };
var NKG = '\\,\\dfrac{\\mathrm{N}}{\\mathrm{kg}}';
var FG = 'F_{\\mathrm{G}}';
function ZELLE(x, y, z, s, o) { return Object.assign({ x: x, y: y, z: z, s: s, mitte: true, p: 0.5 }, o || {}); }
function SATZ(x, y, z, s, o) { return Object.assign({ x: x, y: y, z: z, s: s, cls: 'satz' }, o || {}); }
function OVAL(x, y, w, s, o) { return Object.assign({ typ: 'oval', x: x, y: y, w: w, h: 0.62, s: s, p: 0.5, haken: [18.9, y] }, o || {}); }

window.PFAD = {
  fach: 'Physik 7a', titel: '2.7 Übung Masse, Ortsfaktor, Gewichtskraft', zurueck: 'material.html', breite: 21,
  ueberschrift: 'Lernpfad zum Übungsblatt – Lösung Zeile für Zeile',
  karten: [

  /* ===================== Start ===================== */
  { chip: 'Start', start: true, titel: '2.7 Übung: Masse, Ortsfaktor und Gewichtskraft',
    html:
    '<p>Hier siehst du dein Übungsblatt. Mit <span class="mini" style="background:var(--petrol2);color:#fff">Nächster Schritt</span> erscheint die Lösung <b>Zeile für Zeile</b> in Blau.</p>' +
    '<ol class="start"><li>Erst <b>selbst</b> rechnen – ohne Taschenrechner, die Zahlen gehen im Kopf.</li><li>Ergebnis bei <b>Ergebnis prüfen</b> eingeben.</li>' +
    '<li>Hängst du fest? <span class="mini" style="background:var(--gelb)">Tipp</span> hilft beim nächsten Schritt. Der gelbe Rahmen zeigt, wo die nächste Zeile hinkommt.</li>' +
    '<li><span class="mini" style="background:var(--orange);color:#fff">Glühbirne</span> = Erklärung zu einer schwierigen Zeile.</li>' +
    '<li>Mit <b>Bewertung einblenden</b> siehst du grüne Haken – so wird im Leistungstest korrigiert: <span class="mini-haken"><svg viewBox="0 0 26 24"><path d="M2 13 L9 20 L24 2" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span> = 1 Punkt, <span class="mini-haken"><svg viewBox="0 0 26 24"><path d="M2 12 L8 18.5 L18 3.5 M9 10 L18.5 12.6" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span> = ½ Punkt.</li></ol>' +
    '<div class="box">📱 Am Handy: <b>quer halten</b> oder die <b>Lupe</b> nehmen. Zoomen mit zwei Fingern geht auch.</div>' +
    '<div class="box"><b>Fahrplan:</b> geg. (Masse gleich in kg) → ges. → Formel → Umstellen → Einsetzen mit Einheiten → Ergebnis → Antwort.</div>' +
    '<div class="merk"><b>Die Formel in drei Richtungen</b><br>$' + FG + ' = m \\cdot g$ &nbsp;·&nbsp; $m = \\dfrac{' + FG + '}{g}$ &nbsp;·&nbsp; $g = \\dfrac{' + FG + '}{m}$<br>Auf der Erde rechnest du mit $g \\approx 10' + NKG + '$.</div>' },

  /* ===================== Aufgabe 1: Fehlertext ===================== */
  { chip: 'A1', name: 'Aufgabe 1',
    bild: { src: 'bilder/2-7/ue-a1.webp', y0: 2.35, y1: 9.4 },
    zeilen: [
      OVAL(10.83, 4.40, 2.3, '1. Fehler markieren', { tipp: 'Satz 1: Mit welchem Messgerät bestimmt man die <b>Masse</b>?' }),
      OVAL(8.62, 5.33, 5.6, '2. Fehler markieren', { tipp: 'Satz 3: Ändert sich die Masse, wenn man zum Mond fliegt?' }),
      OVAL(10.68, 6.27, 1.75, '3. Fehler markieren', { tipp: 'Satz 5: Doppelte Masse – was passiert mit der Gewichtskraft?' }),
      SATZ(1.65, 7.11, '1. Die Masse eines Körpers misst man mit einer Waage.', 'Satz 1 verbessern', { p: 0.5,
        tipp: 'Der Kraftmesser misst Kräfte (in N). Und die Masse?' }),
      SATZ(1.65, 7.88, '3. Auf dem Mond ist die Masse gleich, nur die Gewichtskraft ist kleiner.', 'Satz 3 verbessern', { p: 0.5,
        tipp: 'Was ist auf dem Mond wirklich kleiner?',
        erkl: { schritte: [
          { k: 'Masse', t: 'Wie viel Stoff in einem Körper steckt – überall gleich, in kg.' },
          { k: 'Gewichtskraft', t: 'Wie stark ein Himmelskörper am Körper zieht – hängt vom Ort ab, in N.' },
          { k: 'Mond', t: 'Der Mond zieht schwächer ($g = 1{,}6' + NKG + '$) – also ist nur die Gewichtskraft kleiner.' }] } }),
      SATZ(1.65, 8.62, '5. Verdoppelt man die Masse, dann verdoppelt sich auch die Gewichtskraft.', 'Satz 5 verbessern', { p: 0.5,
        tipp: 'Gewichtskraft und Masse sind direkt proportional.',
        erkl: { schritte: [
          { k: 'Beispiel', t: '1 kg wird mit etwa 10 N angezogen, 2 kg mit etwa 20 N.' },
          { k: 'Also', t: 'Doppelte Masse → doppelte Gewichtskraft. $' + FG + '$ und $m$ sind <b>direkt proportional</b>.' }] } })
    ] },

  /* ===================== Aufgabe 2: Tabelle ===================== */
  { chip: 'A2', name: 'Aufgabe 2',
    bild: { src: 'bilder/2-7/ue-a2.webp', y0: 9.65, y1: 13.1 },
    zeilen: [
      ZELLE(7.2, 12.645, '$2' + U('N') + '$', 'Hamster', { tipp: 'Erst in kg umrechnen: $200' + U('g') + ' = 0{,}2' + U('kg') + '$.',
        erkl: { schritte: [
          { k: 'In kg umrechnen', t: '$1000' + U('g') + ' = 1' + U('kg') + '$ – also durch 1000 teilen:', f: '$200' + U('g') + ' = 0{,}2' + U('kg') + '$' },
          { k: 'Formel', f: '$' + FG + ' = m \\cdot g = 0{,}2' + U('kg') + ' \\cdot 10' + NKG + ' = 2' + U('N') + '$' },
          { k: 'Faustregel', t: '100 g werden mit etwa 1 N angezogen – 200 g also mit 2 N. ✓' }] } }),
      ZELLE(10.8, 11.995, '$6' + U('kg') + '$', 'Schulranzen', { tipp: 'Rückwärts: Die Gewichtskraft ist gegeben. $m = \\dfrac{' + FG + '}{g}$',
        erkl: { schritte: [
          { k: 'Umstellen', f: '$m = \\dfrac{' + FG + '}{g}$' },
          { k: 'Einsetzen', f: '$m = \\dfrac{60' + U('N') + '}{10' + NKG + '} = 6' + U('kg') + '$' },
          { k: 'Im Kopf', t: 'Pro kg 10 N. 60 N sind also 6 kg.' }] } }),
      ZELLE(14.4, 12.645, '$40' + U('N') + '$', 'Katze', { tipp: '$' + FG + ' = m \\cdot g = 4' + U('kg') + ' \\cdot 10' + NKG + '$' }),
      ZELLE(18.0, 11.995, '$500' + U('kg') + '$', 'Pferd', { tipp: 'Wie beim Schulranzen: durch 10 teilen.' })
    ] },

  /* ===================== Aufgabe 3: Planet X ===================== */
  { chip: 'A3', name: 'Aufgabe 3',
    check: { frage: 'a) Ergebnis prüfen: Gib den Ortsfaktor auf Planet X ein.', einh: 'N/kg', ok: [15], exakt: 15, bsp: '15',
      fehler: [{ w: 60, t: '<b>Falsch umgestellt?</b> Du hast mal genommen. Gesucht ist $g$ – also durch $m$ teilen.' },
               { w: 0.0667, rel: 0.02, t: '<b>Bruch falsch herum?</b> Oben steht die Gewichtskraft, unten die Masse.' },
               { w: 10, t: 'Das ist der Ortsfaktor der <b>Erde</b>. Rechne mit den Messwerten von Planet X.' }] },
    teile: [
      { bild: 'bilder/2-7/ue-a3.webp', top: 13.25, y0: 13.25, y1: 16.0 },
      { rechnung: { x0: 1.5, w: 18.0, strich: 8.0, lx: 1.75,
        links: [
          { z: '$m = 2' + U('kg') + '$', tipp: 'Masse des Massestücks.' },
          { z: '$' + FG + ' = 30' + U('N') + '$', tipp: 'Was zeigt der Kraftmesser an?' },
          { z: '$m_{\\mathrm{A}} = 40' + U('kg') + '$', tipp: 'Masse der Ausrüstung – die brauchst du in b).' }],
        ges: { z: 'a) $g$ &nbsp;b) $F_{\\mathrm{G,A}}$', p: 0.5, tipp: 'In a) der Ortsfaktor, in b) die Gewichtskraft der Ausrüstung.' },
        rechts: [
          { z: 'a) &nbsp;$' + FG + ' = m \\cdot g$', s: 'a) Formel', cmd: ':m', tipp: 'Welche Formel verbindet Gewichtskraft, Masse und Ortsfaktor?' },
          { z: '$\\phantom{a)\\;\\;}g = \\dfrac{' + FG + '}{m}$', s: 'a) Umstellen', p: 1, tipp: 'Beide Seiten durch $m$ teilen.',
            erkl: { schritte: [
              { k: 'Ziel', t: '$g$ soll allein stehen. Neben $g$ steht noch „$m \\cdot$“.' },
              { k: 'Gegenteil von mal', t: 'Teile beide Seiten durch $m$:', f: '$' + FG + ' = m \\cdot g \\quad |:m \\qquad\\Rightarrow\\qquad g = \\dfrac{' + FG + '}{m}$' },
              { k: 'So misst man den Ortsfaktor', t: 'Masse bekannt, Kraft gemessen – geteilt ergibt das, wie viel Newton auf jedes Kilogramm wirken.' }] } },
          { z: '$\\phantom{a)\\;\\;}g = \\dfrac{30' + U('N') + '}{2' + U('kg') + '}$', s: 'a) Einsetzen', p: 0.5, tipp: 'Zahlen mit Einheiten einsetzen.' },
          { z: '$\\phantom{a)\\;\\;}g = \\underline{\\underline{15' + NKG + '}}$', s: 'a) Ergebnis', p: 1, tipp: '30 geteilt durch 2. Die Einheit: N geteilt durch kg.' },
          { z: 'b) &nbsp;$F_{\\mathrm{G,A}} = m_{\\mathrm{A}} \\cdot g$', s: 'b) Formel', p: 0.5, tipp: 'Jetzt kennst du $g$ von Planet X.' },
          { z: '$\\phantom{b)\\;\\;}F_{\\mathrm{G,A}} = 40' + U('kg') + ' \\cdot 15' + NKG + '$', s: 'b) Einsetzen', p: 0.5, tipp: 'Masse der Ausrüstung und den Ortsfaktor aus a) einsetzen.' },
          { z: '$\\phantom{b)\\;\\;}F_{\\mathrm{G,A}} =$&nbsp;<span class="unter">$600' + U('N') + '$</span>', s: 'b) Ergebnis', p: 1, tipp: 'Im Kopf: $40 \\cdot 15 = 4 \\cdot 150$.',
            erkl: { schritte: [
              { k: 'Geschickt rechnen', f: '$40 \\cdot 15 = 4 \\cdot 150 = 600$' },
              { k: 'Einheit', t: 'kg kürzt sich weg – übrig bleibt N.' }] } }],
        antwort: { z: 'Auf Planet X ist g = 15 N/kg. Die Ausrüstung hat dort eine Gewichtskraft von 600 N.', tipp: 'Beide Ergebnisse in ganzen Sätzen.' } } },
      { bild: 'bilder/2-7/ue-a3c.webp', top: 20.2, y0: 20.2, y1: 22.05, zeilen: [
        SATZ(2.2, 20.54, 'Schwerer: Auf der Erde hat die Ausrüstung nur 400 N Gewichtskraft,', 'c) 1. Satz', { p: 0.5,
          tipp: 'Rechne die Gewichtskraft der Ausrüstung auf der Erde aus und vergleiche mit b).',
          erkl: { schritte: [
            { k: 'Erde', f: '$' + FG + ' = 40' + U('kg') + ' \\cdot 10' + NKG + ' = 400' + U('N') + '$' },
            { k: 'Planet X', t: 'Aus b): $600' + U('N') + '$.' },
            { k: 'Vergleich', t: '600 N > 400 N – auf Planet X ist die Ausrüstung schwerer zu tragen.' }] } }),
        SATZ(2.2, 21.3, 'auf Planet X 600 N. Der Ortsfaktor ist dort größer (15 statt 10 N/kg).', 'c) 2. Satz', { p: 0.5, tipp: 'Begründe mit dem Ortsfaktor.' })] }
    ] },

  /* ===================== Aufgabe 4: Knobeln ===================== */
  { chip: 'A4', name: 'Aufgabe 4',
    check: { frage: 'Ergebnis prüfen: Gib den Ortsfaktor des unbekannten Himmelskörpers ein.', einh: 'N/kg', ok: [3.7], exakt: 3.7, bsp: '3,7',
      fehler: [{ w: 7.4, t: 'Du hast 74 N durch den Ortsfaktor der Erde geteilt. Bestimme zuerst die <b>Masse</b> des Roboters.' },
               { w: 0.37, t: '<b>Fast!</b> Prüfe das Komma: $\\tfrac{74}{20}$ ist etwas weniger als 4.' },
               { w: 0.27, rel: 0.02, t: '<b>Bruch falsch herum?</b> Oben steht die Gewichtskraft, unten die Masse.' },
               { w: 20, t: 'Das ist die <b>Masse</b> des Roboters in kg. Jetzt noch $g_{\\mathrm{X}}$ bestimmen.' }] },
    teile: [
      { bild: 'bilder/2-7/ue-a4.webp', top: 22.2, y0: 22.2, y1: 24.5 },
      { rechnung: { x0: 1.5, w: 18.0, strich: 8.0, lx: 1.75,
        links: [
          { z: '$F_{\\mathrm{E}} = 200' + U('N') + '$', tipp: 'Gewichtskraft auf der Erde.' },
          { z: '$g_{\\mathrm{E}} = 10' + NKG + '$', tipp: 'Ortsfaktor der Erde – den kennst du.' },
          { z: '$F_{\\mathrm{X}} = 74' + U('N') + '$', tipp: 'Gewichtskraft auf dem unbekannten Himmelskörper.' }],
        ges: { z: '$g_{\\mathrm{X}}$', p: 0.5, tipp: 'Gesucht ist der Ortsfaktor – damit findest du den Himmelskörper.' },
        rechts: [
          { z: '$F_{\\mathrm{E}} = m \\cdot g_{\\mathrm{E}}$', s: 'Formel Erde', cmd: ':g_{\\mathrm{E}}', tipp: 'Die Masse ist überall gleich. Bestimme sie zuerst mit den Werten der Erde.',
            erkl: { schritte: [
              { k: 'Der Trick', t: 'Die <b>Masse</b> des Roboters ändert sich nicht. Mit den Werten der Erde bekommst du sie heraus.' },
              { k: 'Dann', t: 'Mit der Masse und der neuen Gewichtskraft bestimmst du den Ortsfaktor $g_{\\mathrm{X}}$.' }] } },
          { z: '$m = \\dfrac{F_{\\mathrm{E}}}{g_{\\mathrm{E}}}$', s: 'Umstellen', p: 1, tipp: 'Beide Seiten durch $g_{\\mathrm{E}}$ teilen.' },
          { z: '$m = \\dfrac{200' + U('N') + '}{10' + NKG + '} = 20' + U('kg') + '$', s: 'Masse', p: 1, tipp: '200 geteilt durch 10.' },
          { z: '$g_{\\mathrm{X}} = \\dfrac{F_{\\mathrm{X}}}{m}$', s: 'Formel Planet', p: 0.5, tipp: 'Wie in Aufgabe 3a): Kraft geteilt durch Masse.' },
          { z: '$g_{\\mathrm{X}} = \\dfrac{74' + U('N') + '}{20' + U('kg') + '}$', s: 'Einsetzen', p: 0.5, tipp: 'Die gemessene Kraft und die Masse aus der Zeile darüber.' },
          { z: '$g_{\\mathrm{X}} = \\underline{\\underline{3{,}7' + NKG + '}}$', s: 'Ergebnis', p: 1, tipp: 'Im Kopf: erst durch 10, dann durch 2.',
            erkl: { schritte: [
              { k: 'Geschickt teilen', t: 'Durch 20 teilen heißt: erst durch 10, dann durch 2.', f: '$\\dfrac{74}{20} = \\dfrac{7{,}4}{2} = 3{,}7$' },
              { k: 'Vergleichen', t: 'In der Liste hat der <b>Mars</b> den Ortsfaktor $3{,}7' + NKG + '$.' }] } }],
        antwort: { z: 'Der Ortsfaktor beträgt 3,7 N/kg – der Roboter ist auf dem Mars gelandet.', p: 0.5, tipp: 'Vergleiche mit den Ortsfaktoren in der Aufgabe.' } } }
    ] },

  /* ===================== Ende ===================== */
  { chip: 'Ende', start: true, titel: 'Geschafft! 🎉',
    html: '<p>Checkliste für den Leistungstest:</p><ul><li>Ich weiß: Die <b>Masse</b> ist überall gleich, die <b>Gewichtskraft</b> hängt vom Ortsfaktor ab.</li>' +
      '<li>Ich stelle $' + FG + ' = m \\cdot g$ nach $m$ oder nach $g$ um.</li>' +
      '<li>Ich rechne Gramm in <b>Kilogramm</b> um, bevor ich einsetze.</li><li>Bei Knobelaufgaben bestimme ich zuerst die Masse – die bleibt gleich.</li></ul>' +
      '<p><a href="ab-2-7.html" style="color:var(--petrol2);font-weight:bold">← Lernpfad zum Arbeitsblatt 2.7</a> &nbsp;·&nbsp; <a href="material.html" style="color:var(--petrol2);font-weight:bold">Zum Material</a></p>' }
  ] };
</script>
