var S1 = 'bilder/2-2/s1.webp', S2 = 'bilder/2-2/s2.webp';
function TEIL(src, y0, y1, zeilen) { return { bild: src, top: 0, y0: y0, y1: y1, zeilen: zeilen || [] }; }
var M = '\\,\\mathrm{m}';

/* ---------- Tinte in der Tabelle: eine Zeile = alle Zellen einer Tabellenzeile ---------- */
function reihe(werte, breite) {   /* breite = Zellenbreite in cm */
  return werte.map(function (w) { return '<span style="display:inline-block;width:' + (breite * 52) + 'px;text-align:center">$' + w + '$</span>'; }).join('');
}

/* ---------- Graphen im Koordinatensystem von Aufgabe 1 (Box 9 × 10 cm, Ursprung bei 4,5 | 5,5) ---------- */
function graph(f, x0, x1, extra, beschr) {
  var d = '', n = 120;
  for (var i = 0; i <= n; i++) {
    var x = x0 + (x1 - x0) * i / n, X = 4.5 + x, Y = 5.5 - f(x);
    d += (i ? 'L' : 'M') + X.toFixed(3) + ' ' + Y.toFixed(3);
  }
  return '<svg viewBox="0 0 9 10" width="100%" height="100%" overflow="hidden">' +
    '<path d="' + d + '" fill="none" stroke="#1F3FBF" stroke-width="0.07" stroke-linecap="round" ' + (extra || '') + '/>' + (beschr || '') + '</svg>';
}
function punkte(f, xs) {
  return xs.map(function (x) { return '<circle cx="' + (4.5 + x) + '" cy="' + (5.5 - f(x)) + '" r="0.09" fill="#1F3FBF"/>'; }).join('');
}
function txt(x, y, t) { return '<text x="' + x + '" y="' + y + '" font-family="Caveat, cursive" font-size="0.62" fill="#1F3FBF">' + t + '</text>'; }

var G_Q = graph(function (x) { return -0.25 * x * x; }, -4.45, 4.45, '', punkte(function (x) { return -0.25 * x * x; }, [-4, -3, -2, -1, 1, 2, 3, 4]) + txt(7.2, 9.2, 'q'));
