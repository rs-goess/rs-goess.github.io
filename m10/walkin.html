<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b77a8">
<title>Walk-in-Quiz Trigonometrie – Mathe 10c</title>
<style>
:root{--blau:#3b77a8;--dunkel:#1f2f3d;--orange:#e97132;--orange-hell:#fdeee5;--lila:#7a2e8e;--lila-hell:#f6ecf9;--gruen:#2e8b57;
      --gruen-hell:#e6f4ec;--grau:#f2f2f2;--gelb:#ffd23f;--gelb-hell:#fff6d6;--rot:#c00000;--rot-hell:#fde8e8}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Calibri,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--blau);color:var(--dunkel);
     font-size:17px;line-height:1.45;overflow-x:hidden}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
a{color:inherit}
header{color:#fff;padding:12px 16px 4px;max-width:600px;margin:0 auto}
header .oben{display:flex;align-items:center;gap:10px}
header small{opacity:.9;display:block;font-size:13px}
header h1{margin:1px 0 6px;font-size:20px;line-height:1.2}
#heim{flex:0 0 auto;border:0;border-radius:999px;background:rgba(255,255,255,.22);color:#fff;font-weight:bold;font-size:14px;
      padding:8px 12px;cursor:pointer;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;min-width:36px;border:0;border-radius:999px;padding:6px 11px;font-size:14px;font-weight:bold;
              background:rgba(255,255,255,.22);color:#fff;cursor:pointer}
.chips button.gut{background:#bfe6cf;color:#14532d}
.chips button.spaet{background:#ffe9a3;color:#5c4400}
.chips button.offen{background:#f7c9c9;color:#7a1010}
.chips button.an{outline:3px solid var(--gelb);outline-offset:-1px;background:#fff;color:var(--dunkel)}
main{max-width:600px;margin:0 auto;padding:6px 12px 0}
.karte{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.18);margin-bottom:12px;animation:rein .25s ease}
@keyframes rein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.karte h2{margin:0 0 10px;font-size:19px;line-height:1.25;color:var(--lila);text-decoration:underline;text-underline-offset:3px;font-weight:normal}
.karte p{margin:8px 0}
.zaehler{font-size:13.5px;color:#5b6770;margin-bottom:2px;display:flex;justify-content:space-between;gap:8px}
.aufgabentext{background:var(--grau);border-radius:12px;padding:10px 12px;margin:8px 0 10px;font-size:16.5px}
.geg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.geg span.g1{background:#fff;border:1.5px solid #d5dde3;border-radius:999px;padding:2px 10px;font-size:15.5px}
/* Formeln */
.f{font-family:"Cambria Math",Cambria,"STIX Two Math","Times New Roman",serif;white-space:normal;font-size:1.04em}
.f i{font-style:italic}
.fz{font-family:"Cambria Math",Cambria,"STIX Two Math","Times New Roman",serif;font-size:1.08em;margin:7px 0 3px;padding:2px 0 3px;
    overflow-x:auto;overflow-y:hidden;white-space:normal;scrollbar-width:thin;line-height:2.05}
.w{text-decoration:overline}
.nw{white-space:nowrap}
.f.kurz{white-space:nowrap!important}
.bruch{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.12;margin:0 2px}
.bruch>span:first-child{border-bottom:1.4px solid currentColor;padding:0 3px 1px}
.bruch>span:last-child{padding:1px 3px 0}
.wz{white-space:nowrap}
.wz>span{border-top:1.4px solid currentColor;padding:0 2px 0 1px;margin-left:-1px}
sub,sup{font-size:.72em;line-height:0}
/* Zeichnung */
.figbox{display:flex;justify-content:center;margin:6px 0 4px}
svg.fig{width:100%;max-width:340px;height:auto;display:block}
svg.fig text{font-family:"Cambria Math",Cambria,"Times New Roman",serif}
/* Antworten */
.wahl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.wahl.eins{grid-template-columns:1fr}
.wahl button{border:2px solid #d5dde3;background:#fff;border-radius:12px;padding:12px 8px;font-size:16.5px;cursor:pointer;
             min-height:52px;line-height:1.35;color:var(--dunkel)}
.wahl.eins button{text-align:left;padding:11px 12px}
.wahl button .f{white-space:normal}
.wahl button.richtig{background:var(--gruen-hell);border-color:var(--gruen);color:#14532d;font-weight:bold}
.wahl button.falsch{background:var(--rot-hell);border-color:var(--rot);color:#7a1010;animation:wackel .3s}
.wahl button:disabled{cursor:default}
.wahl button.aus{opacity:.55}
@keyframes wackel{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{margin-top:10px}
.fb .nein{background:var(--rot-hell);border-radius:12px;padding:9px 12px;font-size:15.5px;animation:rein .25s ease}
.fb .nein b.kopf{color:var(--rot)}
.fb .ja{background:var(--gruen-hell);border-radius:12px;padding:9px 12px;font-size:16px;animation:rein .25s ease}
.fb .ja b.kopf{color:var(--gruen)}
.fb .f{white-space:normal}
.gross{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16.5px;font-weight:bold;cursor:pointer;margin-top:10px;text-align:center;text-decoration:none}
.k-erkl{background:var(--lila);color:#fff}
.k-leise{background:transparent;color:#4b5963;font-weight:normal;font-size:15px;text-decoration:underline;padding:8px}
.k-grau{background:#e1e6ea;color:var(--dunkel)}
/* Erklärung */
.schritte{list-style:none;margin:10px 0 0;padding:0;counter-reset:s}
.schritte li{position:relative;background:#f7fbff;border-left:4px solid var(--blau);border-radius:8px;padding:9px 10px 9px 44px;margin:8px 0;
             animation:rein .25s ease;counter-increment:s;font-size:16px}
.schritte li::before{content:counter(s);position:absolute;left:9px;top:9px;width:25px;height:25px;border-radius:50%;background:var(--gelb);
                     font-weight:bold;font-size:14.5px;display:flex;align-items:center;justify-content:center}
.schritte li[hidden]{display:none}
.knoepfe{display:flex;gap:8px;margin-top:10px}
.knoepfe button{flex:1;border:0;border-radius:12px;padding:12px 8px;font-size:16px;font-weight:bold;cursor:pointer}
.k-zeile{background:var(--blau);color:#fff}
.k-alles{background:#e1e6ea;color:var(--dunkel)}
.ok{background:var(--gruen-hell);border:2px solid var(--gruen);border-radius:12px;padding:10px 12px;margin:10px 0;animation:rein .25s ease}
.ok small{display:block;font-weight:bold;color:var(--gruen);font-size:13.5px}
.ok .f{white-space:normal;font-size:1.12em}
.merk{border:2px solid var(--orange);border-radius:12px;padding:9px 12px;background:var(--orange-hell);margin:10px 0;font-size:15.5px;animation:rein .25s ease}
.merk::before{content:"Merke: ";font-weight:bold;color:#b8501a}
.merk .f{white-space:normal}
.hinweis-klein{font-size:14px;color:#55606a}
/* Start */
.themen{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.thema{display:flex;align-items:center;gap:11px;border:2px solid #dbe2e8;background:#fff;border-radius:14px;padding:10px 12px;cursor:pointer;
       text-align:left;width:100%;font-size:16.5px}
.thema .tn{flex:0 0 46px;height:46px;border-radius:12px;background:var(--lila-hell);color:var(--lila);font-weight:bold;display:flex;
           align-items:center;justify-content:center;font-size:16px}
.thema .tt{flex:1;min-width:0;font-weight:bold;line-height:1.25}
.thema .tt small{display:block;font-weight:normal;color:#5b6770;font-size:13.5px;line-height:1.3;margin-top:2px}
.thema .tp{flex:0 0 auto;font-size:13.5px;color:#5b6770;text-align:right;white-space:nowrap}
.thema .balken{display:block;width:46px;height:6px;background:#e3e9ee;border-radius:9px;overflow:hidden;margin-top:4px}
.thema .balken i{display:block;height:100%;background:var(--gruen)}
.thema.fertig{border-color:var(--gruen)}
.thema.fertig .tn{background:var(--gruen-hell);color:var(--gruen)}
.mix{background:var(--gelb-hell);border:2px dashed #e0a93c}
.mix .tn{background:var(--gelb);color:#3d2f00}
ol.start{margin:6px 0;padding-left:22px}
ol.start li{margin:4px 0}
.punkte{font-size:44px;font-weight:bold;color:var(--lila);text-align:center;margin:4px 0}
.liste{list-style:none;margin:8px 0 0;padding:0}
.liste li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #e6e9ec;font-size:15.5px}
.liste .mark{flex:0 0 26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;background:#e3e9ee;color:#55606a}
.liste .mark.gut{background:#bfe6cf;color:#14532d}.liste .mark.spaet{background:#ffe9a3;color:#5c4400}.liste .mark.offen{background:#f7c9c9;color:#7a1010}
.liste .lt{flex:1;min-width:0}
.liste button{flex:0 0 auto;border:0;border-radius:9px;background:var(--lila-hell);color:var(--lila);font-weight:bold;font-size:14px;padding:7px 10px;cursor:pointer}
.legende{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:#55606a;margin-top:10px}
.legende i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
/* Navigation steht direkt unter der Karte (nicht am Bildschirmrand fixiert), darunter bleibt Platz frei */
nav{max-width:600px;margin:0 auto;padding:0 12px;display:flex;gap:10px}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;border-radius:14px;padding:15px 8px;font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);min-height:54px}
#zurueck{background:#fff;color:var(--dunkel);flex:0 1 38%} #weiter{background:var(--gelb);color:#222}
nav button:disabled{opacity:.4}
nav[hidden]{display:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--gelb);outline-offset:2px}
@media (max-width:360px){body{font-size:16px}.wahl{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<body>
<header>
  <div class="oben">
    <div style="flex:1;min-width:0"><small id="kopfKlein">Mathe 10c · Kapitel 1 Trigonometrie</small><h1 id="kopfGross">Walk-in-Quiz</h1></div>
    <button type="button" id="heim" hidden>‹ Themen</button>
  </div>
  <div class="chips" id="chips" hidden></div>
</header>
<main id="main"><section class="karte"><h2>Walk-in-Quiz Trigonometrie</h2><p>Die Seite braucht JavaScript. Bitte öffne sie im normalen Browser deines Handys (Chrome, Safari, Firefox).</p></section></main>
<nav id="nav" hidden><button type="button" id="zurueck">‹ Zurück</button><button type="button" id="weiter">Weiter ›</button></nav>
<script>
window.STARTSEITE="./";
/* ---------- Formelsatz: kleine Kurzschrift -> HTML ----------
   $...$ Formel in der Zeile, $$...$$ eigene Formelzeile
   @f{Zähler}{Nenner} Bruch · @w{...} Wurzel · @s{AB} Strecke · @l{AB} Streckenlänge · @t{Text} aufrecht
   _n _{max} tiefgestellt · ^2 ^{−1} hochgestellt */
const AUFRECHT = new Set(['sin','cos','tan','cm','mm','dm','km','LE','FE','und','oder','für','bei','mit','TR','max','min','Rechteck','Dreieck']);
const BUCHST = /[A-Za-zÄÖÜäöüßα-ωΑ-Ωφ]/;
function mth(s){
  let i = 0;
  function arg(){ i++; const r = seq('}'); i++; return r; }
  function roh(){ i++; let j = s.indexOf('}', i); const r = s.slice(i, j); i = j + 1; return r; }
  function seq(ende){
    let out = '';
    while (i < s.length && s[i] !== ende){
      const c = s[i];
      if (c === '@'){
        const k = s[i+1]; i += 2;
        if (k === 't'){ out += roh(); continue; }
        const a = arg();
        if (k === 'f'){ const b = arg(); out += '<span class="bruch"><span>' + a + '</span><span>' + b + '</span></span>'; }
        else if (k === 'w') out += '<span class="wz">√<span>' + a + '</span></span>';
        else if (k === 's') out += '<span class="w">' + a + '</span>';
        else if (k === 'l') out += '<span class="nw">|<span class="w">' + a + '</span>|</span>';
      } else if (c === '_' || c === '^'){
        i++; let a;
        if (s[i] === '{') a = arg(); else { a = BUCHST.test(s[i]) ? '<i>' + s[i] + '</i>' : s[i]; i++; }
        out += (c === '_' ? '<sub>' : '<sup>') + a + (c === '_' ? '</sub>' : '</sup>');
      } else if (BUCHST.test(c)){
        let j = i; while (j < s.length && BUCHST.test(s[j])) j++;
        const w = s.slice(i, j); i = j;
        out += AUFRECHT.has(w) ? w : '<i>' + w + '</i>';
      } else if (c === ' '){ out += '&nbsp;'; i++; }
      else { out += c; i++; }
    }
    return out;
  }
  /* Umbruch nur vor =, ⇒ und ≈ erlauben */
  return seq(null).replace(/&nbsp;(=|⇒|≈)/g, ' $1');
}
function fmt(s){
  if (!s) return '';
  const K = x => (window.Formel && window.Formel.html(x, false)) || mth(x);
  return s.replace(/\$\$([^$]+)\$\$/g, (_, x) => '<div class="fz">' + ((window.Formel && window.katex) ? window.katex.renderToString('\\displaystyle ' + window.Formel.tex(x), {throwOnError:false, strict:'ignore'}) : mth(x)) + '</div>')
          .replace(/\$([^$]+)\$/g, (_, x) => '<span class="f' + (x.replace(/@\w\{|[{}_^]/g, '').length <= 24 ? ' kurz' : '') + '">' + K(x) + '</span>');
}

/* ---------- Zeichnungen (SVG) ---------- */
const FARBE = { hyp:'#7a2e8e', ank:'#2f6fa3', geg:'#c0392b', ges:'#e97132', gruen:'#2e8b57', std:'#1f2f3d', grau:'#8a959e', hell:'#eaf1f7' };
function farbe(c){ return FARBE[c] || c || FARBE.std; }
/* Beschriftung in SVG: einzelne Buchstaben kursiv, _x tiefgestellt */
function svgt(s, fs){
  let out = '', i = 0;
  const tief = a => '<tspan dy="' + (fs*0.26).toFixed(1) + '" font-size="' + (fs*0.72).toFixed(1) + '" font-style="italic">' + a +
                    '</tspan><tspan dy="' + (-fs*0.26).toFixed(1) + '">​</tspan>';
  while (i < s.length){
    const c = s[i];
    if (c === '_'){ i++; let a; if (s[i] === '{'){ const j = s.indexOf('}', i); a = s.slice(i+1, j); i = j+1; } else { a = s[i]; i++; } out += tief(a); }
    else if (BUCHST.test(c)){
      let j = i; while (j < s.length && BUCHST.test(s[j])) j++;
      const w = s.slice(i, j); i = j;
      const einheit = w === 'm' && /\d $/.test(s.slice(0, i - 1));
      out += (AUFRECHT.has(w) || w.length > 3 || einheit) ? w : '<tspan font-style="italic">' + w + '</tspan>';
    } else { out += c; i++; }
  }
  return out;
}
function txt(x, y, s, o){
  o = o || {}; const fs = o.fs || 15;
  return '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" font-size="' + fs + '" text-anchor="' + (o.a || 'middle') +
         '" fill="' + farbe(o.c) + '"' + (o.b ? ' font-weight="bold"' : '') + ' dominant-baseline="central">' + svgt(String(s), fs) + '</text>';
}
/* Allgemeine Geometrie-Zeichnung.
   o.P Punkte (Mathe-Koordinaten, y nach oben) · o.poly Flächen · o.seg Strecken · o.ang Winkelbögen · o.rw rechte Winkel
   o.lab Eckenbeschriftung · o.dot Punkte · o.W Breite · o.pad [links, oben, rechts, unten] */
function geo(o){
  const P = o.P, namen = Object.keys(P);
  const W = o.W || 320, pad = o.pad || [34, 26, 34, 28], Hmax = o.H || 210;
  const rahmen = (o.box || namen).map(n => P[n]);
  const xs = rahmen.map(p => p[0]), ys = rahmen.map(p => p[1]);
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const sc = Math.min((W - pad[0] - pad[2]) / (maxx - minx || 1), (Hmax - pad[1] - pad[3]) / (maxy - miny || 1));
  const ox = pad[0] + ((W - pad[0] - pad[2]) - (maxx - minx) * sc) / 2;
  const H = pad[1] + pad[3] + (maxy - miny) * sc;
  const X = n => { const p = P[n]; return [ox + (p[0] - minx) * sc, pad[1] + (maxy - p[1]) * sc]; };
  const mitte = o.cen ? o.cen.map(n => X(n)) : namen.map(n => X(n));
  const cx = mitte.reduce((a, p) => a + p[0], 0) / mitte.length, cy = mitte.reduce((a, p) => a + p[1], 0) / mitte.length;
  const ein = (dx, dy) => { const l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
  let s = '';
  (o.poly || []).forEach(pl => {
    const pts = pl.p.map(n => X(n).map(v => v.toFixed(1)).join(',')).join(' ');
    s += '<polygon points="' + pts + '" fill="' + (pl.f || FARBE.hell) + '" stroke="none"/>';
  });
  /* Winkelbögen */
  (o.ang || []).forEach(a => {
    const [u, v, w, op0] = a, op = op0 || {};
    const V = X(v), U = X(u), Wp = X(w);
    let a1 = Math.atan2(U[1] - V[1], U[0] - V[0]), a2 = Math.atan2(Wp[1] - V[1], Wp[0] - V[0]);
    let d = a2 - a1; while (d <= -Math.PI) d += 2 * Math.PI; while (d > Math.PI) d -= 2 * Math.PI;
    const th = Math.abs(d), r = op.r || (th < 0.6 ? 38 : th < 0.95 ? 30 : 26);
    const p1 = [V[0] + r * Math.cos(a1), V[1] + r * Math.sin(a1)], p2 = [V[0] + r * Math.cos(a1 + d), V[1] + r * Math.sin(a1 + d)];
    const col = farbe(op.c);
    if (op.f) s += '<path d="M' + V[0].toFixed(1) + ',' + V[1].toFixed(1) + ' L' + p1[0].toFixed(1) + ',' + p1[1].toFixed(1) + ' A' + r + ',' + r + ' 0 0 ' + (d > 0 ? 1 : 0) + ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1) + ' Z" fill="' + op.f + '"/>';
    s += '<path d="M' + p1[0].toFixed(1) + ',' + p1[1].toFixed(1) + ' A' + r + ',' + r + ' 0 0 ' + (d > 0 ? 1 : 0) + ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1) + '" fill="none" stroke="' + col + '" stroke-width="1.6"/>';
    if (op.t){
      const am = a1 + d / 2, len = String(op.t).replace(/_/g, '').length;
      const innen = !op.aus && !op.d && th >= 0.95 && len <= 1;
      const dd = innen ? r * 0.6 : (op.d || r + 7 + 3.7 * len);
      s += txt(V[0] + dd * Math.cos(am), V[1] + dd * Math.sin(am), op.t, { fs: op.fs || 14, c: op.c });
    }
  });
  /* rechte Winkel: Viertelkreis mit Punkt */
  (o.rw || []).forEach(a => {
    const [u, v, w, op0] = a, op = op0 || {};
    const V = X(v), U = X(u), Wp = X(w), r = op.r || 17;
    let a1 = Math.atan2(U[1] - V[1], U[0] - V[0]), a2 = Math.atan2(Wp[1] - V[1], Wp[0] - V[0]);
    let d = a2 - a1; while (d <= -Math.PI) d += 2 * Math.PI; while (d > Math.PI) d -= 2 * Math.PI;
    const p1 = [V[0] + r * Math.cos(a1), V[1] + r * Math.sin(a1)], p2 = [V[0] + r * Math.cos(a2), V[1] + r * Math.sin(a2)];
    const col = farbe(op.c), am = a1 + d / 2;
    s += '<path d="M' + p1[0].toFixed(1) + ',' + p1[1].toFixed(1) + ' A' + r + ',' + r + ' 0 0 ' + (d > 0 ? 1 : 0) + ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1) + '" fill="none" stroke="' + col + '" stroke-width="1.6"/>';
    s += '<circle cx="' + (V[0] + r * 0.5 * Math.cos(am)).toFixed(1) + '" cy="' + (V[1] + r * 0.5 * Math.sin(am)).toFixed(1) + '" r="1.7" fill="' + col + '"/>';
  });
  /* Strecken */
  (o.seg || []).forEach(g => {
    const [p, q, op0] = g, op = op0 || {};
    const A = X(p), B = X(q), col = farbe(op.c);
    s += '<line x1="' + A[0].toFixed(1) + '" y1="' + A[1].toFixed(1) + '" x2="' + B[0].toFixed(1) + '" y2="' + B[1].toFixed(1) + '" stroke="' + col +
         '" stroke-width="' + (op.w || (op.c ? 3 : 1.9)) + '" stroke-linecap="round"' + (op.d ? ' stroke-dasharray="' + (op.d === true ? '5 4' : op.d) + '"' : '') + '/>';
    if (op.t){

/* Quader im Schrägbild: Kanten a (nach rechts), b (nach hinten), c (nach oben); o.dreieck z. B. ['A','C','G'] */
function koerperPunkte(a, b, c){
  const k = 0.5 * Math.SQRT1_2, P = {};

  return P;

function quader(o){

  if (kt.CG) g.seg.push(['C','G', { w:0.01, t:kt.CG, o:1, ab:12 }]);
  (o.linien || []).forEach(l => g.seg.push([l[0], l[1], Object.assign({ c:'ges', w:2.6 }, l[2] || {})]));
  (o.rw || []).forEach(r => g.rw.push(r));

/* Hilfen für Zeichnungen im Koordinatensystem */
function bogen(cx, cy, r, g1, g2, c, fuell){
  const a = [cx + r * cosd(g1), cy - r * sind(g1)], b = [cx + r * cosd(g2), cy - r * sind(g2)];
  const gross = Math.abs(g2 - g1) > 180 ? 1 : 0;
  return (fuell ? '<path d="M' + cx.toFixed(1) + ',' + cy.toFixed(1) + ' L' + a[0].toFixed(1) + ',' + a[1].toFixed(1) + ' A' + r + ',' + r + ' 0 ' + gross + ' 0 ' + b[0].toFixed(1) + ',' + b[1].toFixed(1) + ' Z" fill="' + fuell + '"/>' : '') +
    '<path d="M' + a[0].toFixed(1) + ',' + a[1].toFixed(1) + ' A' + r + ',' + r + ' 0 ' + gross + ' 0 ' + b[0].toFixed(1) + ',' + b[1].toFixed(1) + '" fill="none" stroke="' + farbe(c) + '" stroke-width="1.8"/>';
}
const strich = (x1, y1, x2, y2, c, d, w) => '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="' + farbe(c) + '" stroke-width="' + (w || 1.8) + '"' + (d ? ' stroke-dasharray="5 4"' : '') + ' stroke-linecap="round"/>';
const punkt = (x, y, c, r) => '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (r || 4) + '" fill="' + farbe(c) + '"/>';

/* zwei Geraden g und h */
function geraden(o){
  return koord({ x:[-3,3.6], y:[-2,3.2], e:44, tx:[-2,-1,1,2,3], ty:[-1,1,2,3], alt:'Geraden im Koordinatensystem', zeichne:(X, Y) => {
    let s = '';
    o.g.forEach(l => { s += gerade(X, Y, l.m, l.t, l.x1, l.x2, l.c) + txt(X(l.lx), Y(l.ly), l.n, { fs:14, c:l.c, a:l.a || 'middle' }); });
    if (o.dreiecke) o.dreiecke.forEach(d => {
      s += strich(X(d.x), Y(d.y), X(d.x + d.dx), Y(d.y), d.c, 1) + strich(X(d.x + d.dx), Y(d.y), X(d.x + d.dx), Y(d.y + d.dy), d.c, 1) +
           txt(X(d.x + d.dx * (d.lx || 0.5)), Y(d.y) + 11, String(d.dx), { fs:13, c:d.c, b:1 }) + txt(X(d.x + d.dx) + 9, Y(d.y + d.dy * (d.ly || 0.5)), String(d.dy), { fs:13, c:d.c, b:1 }) + punkt(X(d.x), Y(d.y), d.c, 3);
    });
    if (o.phi){ const p = o.phi; s += bogen(X(p.x), Y(p.y), p.r || 34, p.g1, p.g2, 'ges') + txt(X(p.x) + (p.d || 52) * cosd((p.g1 + p.g2) / 2), Y(p.y) - (p.d || 52) * sind((p.g1 + p.g2) / 2), p.t, { fs:14, c:'ges' }); }
    if (o.winkel) o.winkel.forEach(p => { s += bogen(X(p.x), Y(p.y), p.r || 26, 0, p.g, p.c) + txt(X(p.x) + (p.d || 38) * cosd(p.g / 2), Y(p.y) - (p.d || 38) * sind(p.g / 2) , p.t, { fs:12.5, c:p.c }); });
    return s;
  } });
}

/* Gerade durch den Ursprung mit Punkt P und Steigungsdreieck */
function ursprungsgerade(o){
  return koord({ x:[-1.2,3.4], y:[-1,2.8], e:56, gitter:false, alt:'Gerade durch den Ursprung', zeichne:(X, Y) => {
    const px = 2.4, py = 1.6;
    let s = gerade(X, Y, py / px, 0, -1.2, 3.4, 'geg');
    if (o.dreieck) s += strich(X(0), Y(0), X(px), Y(0), 'ank', 0, 3) + strich(X(px), Y(0), X(px), Y(py), 'ges', 0, 3) +
        txt(X(px / 2), Y(0) + 14, o.xt || 'x', { fs:15, c:'ank' }) + txt(X(px) + 11, Y(py / 2), o.yt || 'y', { fs:15, c:'ges' });
    else s += strich(X(px), Y(0), X(px), Y(py), 'grau', 1) + strich(X(0), Y(py), X(px), Y(py), 'grau', 1);
    if (o.alpha) s += bogen(X(0), Y(0), 30, 0, atand(py / px), 'std') + txt(X(0) + 43 * cosd(16), Y(0) - 43 * sind(16), 'α', { fs:15 });
    s += punkt(X(px), Y(py), 'ges') + txt(X(px) - 6, Y(py) - 15, 'P(x | y)', { fs:15, c:'ges', b:1, a:'end' }) + txt(X(0) - 12, Y(0) + 13, 'O', { fs:14 });
    return s;
  } });
}
/* Einheitskreis */
function ekreis(o){
  return koord({ x:[-1.35,1.35], y:[-1.3,1.3], e:98, gitter:false, alt:'Einheitskreis', zeichne:(X, Y) => {
    const r = X(1) - X(0);
    let s = '<circle cx="' + X(0) + '" cy="' + Y(0) + '" r="' + r + '" fill="#e9eef2" fill-opacity=".75" stroke="#1f2f3d" stroke-width="1.8"/>';
    s += strich(X(-1.35), Y(0), X(1.35), Y(0), 'std', 0, 1.6) + strich(X(0), Y(-1.3), X(0), Y(1.3) - 10, 'std', 0, 1.6);
    if (!o.ohneZahlen) s += txt(X(1) + 9, Y(0) + 13, '1', { fs:12.5 }) + txt(X(-1) - 11, Y(0) + 13, '−1', { fs:12.5 }) + txt(X(0) - 9, Y(1) - 9, '1', { fs:12.5 }) + txt(X(0) - 12, Y(-1) + 11, '−1', { fs:12.5 });
    (o.linien || []).forEach(l => { s += strich(X(l[0]), Y(l[1]), X(l[2]), Y(l[3]), l[4], l[5], l[6]); });
    (o.radien || []).forEach(g => { s += strich(X(0), Y(0), X(cosd(g.g)), Y(sind(g.g)), g.c || 'std', 0, 2.4); });

    (o.punkte || []).forEach(p => { s += punkt(X(p.x), Y(sind(p.x)), p.c || 'ges') + (p.t ? txt(X(p.x) + (p.dx || 0), Y(sind(p.x)) + (p.dy == null ? -13 : p.dy), p.t, { fs:12.5, c:p.c || 'ges', b:1, a:p.a || 'middle' }) : ''); });

/* 1.9: B_n auf [AB], C_n oben */
function beide(o){
  return geo({ P:{ A:[0,0], Bn:[o.bn,0], Cn:[0,o.cn], B:[o.b,0] }, poly:[{ p:['A','Bn','Cn'], f:'#eaf1f7' }],

    rw:[['Bn','A','Cn']], ang:o.ang || [], lab:{ A:['A',-1,1], Bn:[o.nb || 'B_n',0,1.2], Cn:[o.nc || 'C_n',-1,-0.6], B:['B',0.6,1] }, dot:['Bn','B'],
    pad:[76,24,34,36], box:['A','B','Cn'], cen:['A','Bn','Cn'], H:o.H || 200, alt:'Dreieck mit wandernden Punkten' });
}
function parabel(o){
  return koord({ x:[0,o.xmax], y:[0,o.ymax], ex:o.ex, ey:o.ey, sx:o.sx, sy:o.sy, tx:o.tx, ty:o.ty, xn:'x', yn:o.yn || 'A', alt:'Parabel', zeichne:(X, Y) => {

    s += strich(X(o.S[0]), Y(0), X(o.S[0]), Y(o.S[1]), 'ges', 1) + strich(X(0), Y(o.S[1]), X(o.S[0]), Y(o.S[1]), 'ges', 1) + punkt(X(o.S[0]), Y(o.S[1]), 'ges') +
         txt(X(o.S[0]) + 8, Y(o.S[1]) - 12, o.St, { fs:13.5, c:'ges', b:1, a:'start' });
    return s;
  } });
}
/* 1.10 Musteraufgabe */
function muster(o){
  const x = 3, E = pol(6 - 0.5 * x, 70);
  return geo({ P:{ A:[0,0], B:[8,0], C:pol(6,70), D:[x,0], E:E }, poly:[{ p:['A','D','E'], f:'#fdeee5' }],
    seg:[['A','B'], ['B','C'], ['C','A'], ['D','E',{ c:'ges' }], ['A','D',{ w:0.01, t:'x', o:1, tc:'ges', ab:12 }], ['C','E',{ w:0.01, t:'0,5x', o:1, tc:'ges', ab:14 }]].concat(o && o.ae ? [['A','E',{ w:3.4, c:'gruen' }]] : []),

}

/* ---------- Ablauf ---------- */
(function(){
  const KEY = 'walkin-trigo-10c-v1', MIXKEY = KEY + '-mix';
  let stand = {};
  try { stand = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { stand = {}; }
  const sichern = () => { try { localStorage.setItem(KEY, JSON.stringify(stand)); } catch (e) {} };

  THEMEN.forEach(t => t.fragen.forEach((f, i) => { f.id = t.nr + '/' + (i + 1); f.thema = t; f.nr = i + 1; }));
  const ALLE = [].concat.apply([], THEMEN.map(t => t.fragen));
  const sitzung = {};
  let mix = null;

  const $ = id => document.getElementById(id);
  const main = $('main'), chips = $('chips'), kopfKlein = $('kopfKlein'), kopfGross = $('kopfGross'), heim = $('heim'),
        nav = $('nav'), bZur = $('zurueck'), bWei = $('weiter');
  const mische = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  const S = f => sitzung[f.id] || (sitzung[f.id] = { reihe: mische(f.o.map((_, i) => i)), falsch: [], gesehen: false });
  const geloest = f => stand[f.id] === 1 || stand[f.id] === 2;
  const frisch = f => !!(sitzung[f.id] && sitzung[f.id].neu);           /* im Mix: wird noch einmal neu gelöst */
  const erledigt = f => geloest(f) && !frisch(f);
  const klasse = f => frisch(f) ? (sitzung[f.id].falsch.length ? 'offen' : '') : stand[f.id] === 1 ? 'gut' : stand[f.id] === 2 ? 'spaet' : stand[f.id] === 3 ? 'offen' : '';
  const geh = h => { if (location.hash === '#' + h) zeige(); else location.hash = h; };

  function neuerMix(){
    const offen = mische(ALLE.filter(f => stand[f.id] !== 1)), rest = mische(ALLE.filter(f => stand[f.id] === 1));
    mix = offen.concat(rest).slice(0, 10);
    mix.forEach(f => { sitzung[f.id] = { reihe: mische(f.o.map((_, i) => i)), falsch: [], gesehen: false, neu: true }; });
    try { sessionStorage.setItem(MIXKEY, JSON.stringify(mix.map(f => f.id))); } catch (e) {}
  }
  function lauf(key){
    if (key === 'mix'){
      if (!mix){
        try { const ids = JSON.parse(sessionStorage.getItem(MIXKEY) || 'null'); if (ids) mix = ids.map(id => ALLE.find(f => f.id === id)).filter(Boolean); } catch (e) {}
        if (!mix || !mix.length) neuerMix();
      }
      return { key:'mix', nr:'Mix', titel:'Gemischtes Training', fragen:mix };
    }
    const t = THEMEN.find(t => t.nr === key);
    return t ? { key:t.nr, nr:t.nr, titel:t.titel, fragen:t.fragen } : null;
  }

  function aufgabentext(f){
    let h = '<div class="aufgabentext">' + fmt(f.q);
    if (f.geg) h += '<div class="geg">' + f.geg.map(g => '<span class="g1">' + fmt(g) + '</span>').join('') + '</div>';
    return h + '</div>';
  }
  const figur = fn => fn ? '<div class="figbox">' + fn() + '</div>' : '';

  function setzeKopf(klein, gross, mitHeim){
    kopfKlein.textContent = klein; kopfGross.textContent = gross;
    /* im Quiz: zurück zur Themenliste; auf der Themenliste (nur im Paket mit Startseite): zurück zur Startseite */
    if (mitHeim){ heim.hidden = false; heim.textContent = '‹ Themen'; heim.onclick = () => geh(''); }
    else if (window.STARTSEITE){ heim.hidden = false; heim.textContent = '‹ Startseite'; heim.onclick = () => { location.href = window.STARTSEITE; }; }
    else heim.hidden = true;
  }
  function setzeChips(L, n){
    if (!L){ chips.innerHTML = ''; chips.hidden = true; return; }
    chips.hidden = false;
    chips.innerHTML = L.fragen.map((f, i) => '<button type="button" class="' + klasse(f) + (i + 1 === n ? ' an' : '') + '" data-n="' + (i + 1) + '" aria-label="Aufgabe ' + (i + 1) + '">' + (i + 1) + '</button>').join('') +
      '<button type="button" data-n="a"' + (n === 'a' ? ' class="an"' : '') + '>Auswertung</button>';
    chips.querySelectorAll('button').forEach(b => { b.onclick = () => geh(b.dataset.n === 'a' ? 'a/' + L.key : 'q/' + L.key + '/' + b.dataset.n); });
    const an = chips.querySelector('.an'); if (an && an.scrollIntoView) an.scrollIntoView({ block:'nearest', inline:'center' });
  }
  function setzeNav(zt, zf, wt, wf){
    nav.hidden = false; bZur.textContent = zt; bZur.onclick = zf; bWei.textContent = wt; bWei.onclick = wf;
  }
  const herkunft = (L, f) => L.key === 'mix' ? ' · aus ' + f.thema.nr + ' ' + f.thema.titel : '';

  /* ----- Start ----- */
  function zeigeStart(){
    setzeKopf('Mathe 10c · Kapitel 1 Trigonometrie', 'Walk-in-Quiz', false); setzeChips(null); nav.hidden = true;
    const gesamt = ALLE.length, gut = ALLE.filter(geloest).length;
    let h = '<section class="karte"><h2>So funktioniert’s</h2><ol class="start">' +
      '<li><b>Thema antippen</b> – dort findest du die Walk-in-Aufgaben aus dem Unterricht.</li>' +
      '<li><b>Erst selbst rechnen</b> – auf einem Blatt, mit dem Taschenrechner (er muss auf Grad stehen: „D“ im Display).</li>' +
      '<li><b>Ergebnis antippen.</b> Bei einem Fehler bekommst du einen Hinweis und darfst es noch einmal versuchen.</li>' +
      '<li>Über <b>„Ausführliche Erklärung“</b> siehst du den Lösungsweg Schritt für Schritt.</li></ol></section>';
    h += '<section class="karte"><h2>Themen</h2><div class="hinweis-klein">' + gut + ' von ' + gesamt + ' Aufgaben gelöst</div><div class="themen">';
    THEMEN.forEach(t => {
      const n = t.fragen.length, g = t.fragen.filter(geloest).length;
      h += '<button type="button" class="thema' + (g === n ? ' fertig' : '') + '" data-t="' + t.nr + '"><span class="tn">' + t.nr + '</span><span class="tt">' + t.titel +
           '<small>' + t.sub + '</small></span><span class="tp">' + g + ' / ' + n + '<span class="balken"><i style="width:' + Math.round(100 * g / n) + '%"></i></span></span></button>';
    });
    h += '<button type="button" class="thema mix" data-t="mix"><span class="tn">Mix</span><span class="tt">Gemischtes Training<small>10 zufällige Aufgaben aus allen Themen – ideal vor der Schulaufgabe</small></span></button>';
    h += '</div></section>';
    h += '<section class="karte"><div class="legende"><span><i style="background:#bfe6cf"></i>beim 1. Versuch richtig</span><span><i style="background:#ffe9a3"></i>mit Hilfe gelöst</span><span><i style="background:#f7c9c9"></i>noch offen</span></div>' +
      '<p class="hinweis-klein">Dein Fortschritt wird nur auf diesem Gerät gespeichert. Die Aufgaben funktionieren auch ohne Internet, sobald die Seite geladen ist.</p>' +
      '<button type="button" class="gross k-leise" id="loeschen">Fortschritt löschen</button></section>';
    main.innerHTML = h;
    main.querySelectorAll('.thema').forEach(b => { b.onclick = () => {
      if (b.dataset.t === 'mix'){ neuerMix(); geh('q/mix/1'); return; }
      const t = THEMEN.find(t => t.nr === b.dataset.t), i = t.fragen.findIndex(f => !geloest(f));
      geh(i < 0 ? 'a/' + t.nr : 'q/' + t.nr + '/' + (i + 1));
    }; });
    const l = $('loeschen'); let sicher = false;
    l.onclick = () => {
      if (!sicher){ sicher = true; l.textContent = 'Wirklich alles löschen? Dann noch einmal tippen.'; return; }
      stand = {}; Object.keys(sitzung).forEach(k => delete sitzung[k]); sichern(); zeigeStart();
    };
  }

  /* ----- Aufgabe ----- */
  function zeigeFrage(L, n){
    const f = L.fragen[n - 1], s = S(f), N = L.fragen.length;
    setzeKopf('Mathe 10c · Walk-in-Quiz', L.nr + ' ' + L.titel, true); setzeChips(L, n);
    const lang = f.o.some(o => o[0].replace(/<[^>]+>|\$|@\w\{|\}/g, '').length > 19 || o[0].indexOf('<br>') >= 0);
    let h = '<section class="karte"><div class="zaehler"><span>Aufgabe ' + n + ' von ' + N + herkunft(L, f) + '</span></div><h2>' + f.t + '</h2>' +
      aufgabentext(f) + figur(f.fig) + '<div class="wahl' + (lang ? ' eins' : '') + '" id="wahl">';
    s.reihe.forEach(i => { h += '<button type="button" data-i="' + i + '">' + fmt(f.o[i][0]) + '</button>'; });
    h += '</div><div class="fb" id="fb"></div><div id="nach"></div></section>';
    main.innerHTML = h;
    const wahl = $('wahl'), fb = $('fb'), nach = $('nach');
    const knopf = i => wahl.querySelector('button[data-i="' + i + '"]');
    const richtigI = f.o.findIndex(o => o[1]);
    function fertig(neu){
      wahl.querySelectorAll('button').forEach(b => { b.disabled = true; if (+b.dataset.i !== richtigI && !b.classList.contains('falsch')) b.classList.add('aus'); });
      knopf(richtigI).classList.add('richtig');
      fb.innerHTML = '<div class="ja"><b class="kopf">' + (neu ? 'Richtig! ' : 'Gelöst: ') + '</b>' + fmt(f.k || f.e) + '</div>';
      nach.innerHTML = '<button type="button" class="gross k-erkl" id="zurErkl">Ausführliche Erklärung ansehen ›</button>';
      $('zurErkl').onclick = () => geh('e/' + L.key + '/' + n);
    }
    function offenLink(){
      nach.innerHTML = '<button type="button" class="gross k-leise" id="zurErkl">Ich komme nicht weiter – zur ausführlichen Erklärung</button>';
      $('zurErkl').onclick = () => geh('e/' + L.key + '/' + n);
    }
    s.falsch.forEach(i => { const b = knopf(i); b.classList.add('falsch'); b.disabled = true; });
    if (erledigt(f)) fertig(false); else offenLink();
    wahl.querySelectorAll('button').forEach(b => { b.onclick = () => {
      const i = +b.dataset.i;
      if (f.o[i][1]){
        stand[f.id] = (s.falsch.length || s.gesehen) ? (stand[f.id] === 1 ? 1 : 2) : 1; s.neu = false; sichern(); fertig(true); setzeChips(L, n);
      } else {
        b.classList.add('falsch'); b.disabled = true; s.falsch.push(i);
        if (!geloest(f)){ stand[f.id] = 3; sichern(); }
        fb.innerHTML = '<div class="nein"><b class="kopf">Noch nicht. </b>' + fmt(f.o[i][2] || '') + ' <span class="hinweis-klein">Versuche es noch einmal.</span></div>';
        setzeChips(L, n);
      }
    }; });
    setzeNav(n > 1 ? '‹ Zurück' : '‹ Themen', () => geh(n > 1 ? 'q/' + L.key + '/' + (n - 1) : ''),
             n < N ? 'Weiter ›' : 'Auswertung ›', () => geh(n < N ? 'q/' + L.key + '/' + (n + 1) : 'a/' + L.key));
  }

  /* ----- Erklärung ----- */
  function zeigeErkl(L, n){
    const f = L.fragen[n - 1], s = S(f), N = L.fragen.length;
    if (!erledigt(f)){ s.gesehen = true; if (!stand[f.id]){ stand[f.id] = 3; sichern(); } }
    setzeKopf('Mathe 10c · Walk-in-Quiz', L.nr + ' ' + L.titel, true); setzeChips(L, n);
    let h = '<section class="karte"><div class="zaehler"><span>Ausführliche Erklärung · Aufgabe ' + n + herkunft(L, f) + '</span></div><h2>' + f.t + '</h2>' +
      aufgabentext(f) + figur(f.figL || f.fig) + '<ol class="schritte" id="schritte">';
    f.s.forEach((x, i) => { h += '<li' + (i ? ' hidden' : '') + '>' + fmt(x) + '</li>'; });
    h += '</ol><div class="knoepfe" id="knoepfe"><button type="button" class="k-zeile" id="mehr">Nächster Schritt</button><button type="button" class="k-alles" id="alles">Alles zeigen</button></div>' +
      '<div id="ende" hidden><div class="ok"><small>Ergebnis</small>' + fmt(f.e) + '</div>' + (f.m ? '<div class="merk">' + fmt(f.m) + '</div>' : '') +
      '</div></section>';
    main.innerHTML = h;
    const li = [].slice.call($('schritte').children); let offen = 1;
    function stelle(){
      li.forEach((e, i) => { e.hidden = i >= offen; });
      if (offen >= li.length){ $('knoepfe').hidden = true; $('ende').hidden = false; }
    }
    $('mehr').onclick = () => { offen++; stelle(); const e = offen >= li.length ? $('ende') : li[offen - 1]; if (e.scrollIntoView) e.scrollIntoView({ block:'nearest', behavior:'smooth' }); };
    $('alles').onclick = () => { offen = li.length; stelle(); };
    stelle();
    setzeNav('‹ Zur Aufgabe', () => geh('q/' + L.key + '/' + n),
             n < N ? 'Nächste Aufgabe ›' : 'Auswertung ›', () => geh(n < N ? 'q/' + L.key + '/' + (n + 1) : 'a/' + L.key));
  }

  /* ----- Auswertung ----- */
  function zeigeAuswertung(L){
    const N = L.fragen.length, gut = L.fragen.filter(f => stand[f.id] === 1 && !frisch(f)).length, gel = L.fragen.filter(erledigt).length;
    setzeKopf('Mathe 10c · Walk-in-Quiz', L.nr + ' ' + L.titel, true); setzeChips(L, 'a');
    let text;
    if (gel < N) text = 'Du hast ' + gel + ' von ' + N + ' Aufgaben gelöst. Tippe auf eine offene Aufgabe, um weiterzumachen.';
    else if (gut === N) text = 'Stark – alles beim ersten Versuch richtig. Dieses Thema sitzt!';
    else if (gut >= 0.7 * N) text = 'Gut gemacht! Schau dir bei den gelben Aufgaben die ausführliche Erklärung noch einmal an.';
    else text = 'Hier lohnt sich eine zweite Runde: Lies die ausführlichen Erklärungen und übe das Thema dann noch einmal.';
    let h = '<section class="karte"><h2>Auswertung</h2><p>Beim <b>ersten Versuch</b> richtig:</p><div class="punkte">' + gut + ' / ' + N + '</div><div class="aufgabentext">' + text + '</div><ul class="liste">';
    L.fragen.forEach((f, i) => {
      const k = klasse(f);
      h += '<li><span class="mark ' + k + '">' + (k === 'gut' || k === 'spaet' ? '✓' : k === 'offen' ? '!' : '') + '</span><span class="lt">' + (i + 1) + '. ' + f.t + (L.key === 'mix' ? ' <span class="hinweis-klein">(' + f.thema.nr + ')</span>' : '') + '</span>' +
           '<button type="button" data-q="' + (i + 1) + '">' + (erledigt(f) ? 'Erklärung' : 'Lösen') + '</button></li>';
    });
    h += '</ul><div class="legende"><span><i style="background:#bfe6cf"></i>beim 1. Versuch richtig</span><span><i style="background:#ffe9a3"></i>mit Hilfe gelöst</span><span><i style="background:#f7c9c9"></i>noch offen</span></div>' +
      '<button type="button" class="gross k-grau" id="nochmal">' + (L.key === 'mix' ? 'Neuer Mix mit 10 Aufgaben' : 'Dieses Thema noch einmal üben') + '</button></section>';
    main.innerHTML = h;
    main.querySelectorAll('.liste button').forEach(b => { b.onclick = () => { const f = L.fragen[b.dataset.q - 1]; geh((erledigt(f) ? 'e/' : 'q/') + L.key + '/' + b.dataset.q); }; });
    $('nochmal').onclick = () => {
      if (L.key === 'mix') neuerMix();
      else { L.fragen.forEach(f => { delete stand[f.id]; delete sitzung[f.id]; }); sichern(); }
      geh('q/' + L.key + '/1');
    };
    const i = THEMEN.findIndex(t => t.nr === L.key), naechstes = i >= 0 && i < THEMEN.length - 1 ? THEMEN[i + 1] : null;
    setzeNav('‹ Themen', () => geh(''), naechstes ? 'Thema ' + naechstes.nr + ' ›' : 'Zur Übersicht ›', () => geh(naechstes ? 'q/' + naechstes.nr + '/1' : ''));
  }

  function zeige(){
    const h = decodeURIComponent(location.hash.replace(/^#/, '')), t = h.split('/');
    const L = t[1] ? lauf(t[1]) : null, n = parseInt(t[2], 10);
    if (L && (t[0] === 'q' || t[0] === 'e') && n >= 1 && n <= L.fragen.length){ if (t[0] === 'q') zeigeFrage(L, n); else zeigeErkl(L, n); }
    else if (L && t[0] === 'a') zeigeAuswertung(L);
    else zeigeStart();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', zeige);
  window.WALKIN = { THEMEN, ALLE };
  zeige();
})();
</script>
