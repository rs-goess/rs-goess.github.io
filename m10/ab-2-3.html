<script>
/* =====================================================================
   Mathe 10c · 2.3 AB Verschiebung von Parabeln – Lernpfad auf dem Blatt
   Bilder: bilder/2-3/s1.webp und s2.webp = Seite 1 und 2 des Arbeitsblatts (21 cm breit, ganze Seite)
   Alle Werte nachgerechnet (Python), Notation wie auf dem AB.
   ===================================================================== */
var S1 = 'bilder/2-3/s1.webp', S2 = 'bilder/2-3/s2.webp';
function TEIL(src, y0, y1, zeilen) { return { bild: src, top: 0, y0: y0, y1: y1, zeilen: zeilen || [] }; }
var TINTE = '#1F3FBF';

/* ---------- Tinte in Tabellen und Klammern ---------- */
function feld(breite, inhalt) { return '<span style="display:inline-block;width:' + (breite * 52) + 'px;text-align:center">' + inhalt + '</span>'; }
function reihe(werte, breite) { return werte.map(function (w) { return feld(breite, '$' + w + '$'); }).join(''); }
/* Koordinaten in „( __ | __ )“: Breite der beiden Lücken und des Trennstrichs in cm */
function koord(a, b) { return feld(0.87, '$' + a + '$') + feld(0.18, '') + feld(0.88, '$' + b + '$'); }
/* Zeile der Tabelle in Aufgabe 2: Scheitelpunkt | geöffnet nach | Wertemenge */
function zeile2(s, o, w) { return feld(2.4, '$' + s + '$') + feld(1.85, o) + feld(3.15, '$' + w + '$'); }

/* ---------- Graphen als Tinte im Koordinatensystem ----------
   ox, oy = Lage des Ursprungs in der Box (cm), w × h = Größe der Box (cm) */
function graph(w, h, ox, oy, f, x0, x1, inhalt, gestrichelt) {
  var d = '', n = 140;
  for (var i = 0; i <= n; i++) {
    var x = x0 + (x1 - x0) * i / n;
    d += (i ? 'L' : 'M') + (ox + x).toFixed(3) + ' ' + (oy - f(x)).toFixed(3);
  }
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="100%" overflow="hidden">' +
    '<path d="' + d + '" fill="none" stroke="' + TINTE + '" stroke-width="0.07" stroke-linecap="round"' +
    (gestrichelt ? ' stroke-dasharray="0.25 0.18"' : '') + '/>' + (inhalt || '') + '</svg>';
}
function punkte(ox, oy, f, xs) {
  return xs.map(function (x) { return '<circle cx="' + (ox + x) + '" cy="' + (oy - f(x)) + '" r="0.09" fill="' + TINTE + '"/>'; }).join('');
}
function txt(x, y, t, gr) { return '<text x="' + x + '" y="' + y + '" font-family="Caveat, cursive" font-size="' + (gr || 0.62) + '" fill="' + TINTE + '">' + t + '</text>'; }

/* Aufgabe 1: Box 12 × 13 cm, Ursprung bei (4,5 | 9,5) */
var fP1 = function (x) { return x * x - 3; }, fP2 = function (x) { return (x - 3) * (x - 3); };
var G_P1 = graph(12, 13, 4.5, 9.5, fP1, -3.5, 3.5, punkte(4.5, 9.5, fP1, [-3, -2, -1, 0, 1, 2, 3]) + txt(8.15, 2.95, 'p₁') + txt(4.7, 12.95, 'S₁'));
var G_P2 = graph(12, 13, 4.5, 9.5, fP2, -0.05, 6.05, punkte(4.5, 9.5, fP2, [0, 1, 2, 3, 4, 5, 6]) + txt(10.75, 1.5, 'p₂') + txt(7.3, 9.15, 'S₂'));
/* Aufgabe 2: Box 7 × 6 cm, Ursprung bei (1,5 | 5,5) */
var fA = function (x) { return (x - 2) * (x - 2) + 1; }, fC = function (x) { return -(x - 1) * (x - 1) + 5; };
var G_A = graph(7, 6, 1.5, 5.5, fA, -0.1, 4.1, punkte(1.5, 5.5, fA, [0, 1, 2, 3, 4]) + txt(5.7, 1.1, 'p₁'));
var G_C = graph(7, 6, 1.5, 5.5, fC, -1.3, 3.3, punkte(1.5, 5.5, fC, [-1, 0, 1, 2, 3]) + txt(4.75, 4.7, 'p₃'));
/* Aufgabe 5: Skizze (nicht maßstabsgetreu nötig, hier aber passend): 1 Einheit = 0,5 cm */
var G_5 = (function () {
  var e = 0.5, ox = 0.8, oy = 3.6, d = '';
  for (var i = 0; i <= 80; i++) { var x = 1.6 + 4.8 * i / 80; d += (i ? 'L' : 'M') + (ox + x * e).toFixed(3) + ' ' + (oy - (-(x - 4) * (x - 4) + 5) * e).toFixed(3); }
  function P(x, y) { return '<circle cx="' + (ox + x * e) + '" cy="' + (oy - y * e) + '" r="0.08" fill="' + TINTE + '"/>'; }
  return '<svg viewBox="0 0 6 4.2">' +
    '<path d="M0.3 ' + oy + 'H5.6M' + ox + ' 4.1V0.3" stroke="' + TINTE + '" stroke-width="0.04" fill="none"/>' +
    '<path d="M0.5 ' + (oy - e) + 'H5.4" stroke="' + TINTE + '" stroke-width="0.04" stroke-dasharray="0.16 0.12" fill="none"/>' +
    '<path d="' + d + '" fill="none" stroke="' + TINTE + '" stroke-width="0.06" stroke-linecap="round"/>' +
    P(4, 5) + P(2, 1) + P(6, 1) +
    txt(ox + 4 * e - 0.1, oy - 5 * e - 0.2, 'S (4|5)', 0.5) + txt(ox + 2 * e - 0.95, oy - e - 0.15, 'P₁', 0.5) + txt(ox + 6 * e + 0.15, oy - e - 0.15, 'P₂', 0.5) +
    txt(5.0, oy - e - 0.1, 'y = 1', 0.42) + txt(5.45, oy + 0.45, 'x', 0.45) + txt(ox + 0.12, 0.55, 'y', 0.45) +
    txt(ox + 2 * e - 0.1, oy + 0.5, '2', 0.42) + txt(ox + 4 * e - 0.1, oy + 0.5, '4', 0.42) + txt(ox + 6 * e - 0.1, oy + 0.5, '6', 0.42) + '</svg>';
})();
