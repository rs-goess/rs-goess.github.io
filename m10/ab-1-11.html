 { chip:'A2', untertitel:'Teil A · ohne Taschenrechner', titel:'Aufgabe 2: Besondere Werte', html:
   '<div class="aufgabentext">Gib die Werte an. Leite sie dir am Einheitskreis her, statt sie auswendig zu lernen.</div>',
   teile:[
   { titel:'Die zehn Werte', schritte:[
     { tipp:'Am Einheitskreis gilt $P(cos α | sin α)$: Der Sinus ist der y-Wert, der Kosinus der x-Wert. Bei $0°$ ist $P(1 | 0)$, bei $90°$ ist $P(0 | 1)$, bei $180°$ ist $P(−1 | 0)$.', zeile:'$sin 0° = 0$,  $sin 30° = 0,5$,  $sin 90° = 1$,  $sin 180° = 0$' },
     { tipp:'$cos 60° = 0,5$: Bei $60°$ liegt der Punkt genau über der Mitte zwischen $0$ und $1$.', zeile:'$cos 0° = 1$,  $cos 60° = 0,5$,  $cos 90° = 0$,  $cos 180° = −1$' },
     { tipp:'$tan α = @f{sin α}{cos α}$. Bei $45°$ sind sin und cos gleich groß.', zeile:'$tan 0° = 0$,  $tan 45° = 1$', ende:true } ] },
   { titel:'Berechne damit', schritte:[
     { zeile:'$sin 30° + cos 60° = 0,5 + 0,5 = 1$' },
     { tipp:'Achtung beim Minus: $cos 180° = −1$, und minus minus gibt plus.', zeile:'$2 · sin 90° − cos 180° = 2 · 1 − (−1) = 3$', ende:true } ] }
 ], nachher:'<p class="hinweis-klein" style="margin-top:12px">' + EK + '</p>' },

 { chip:'A3', untertitel:'Teil A · ohne Taschenrechner', titel:'Aufgabe 3: Einheitskreis verstehen', teile:[

     { tipp:'Gleicher Kosinuswert = gleicher x-Wert: Spiegle an der x-Achse. $cos(360° − α) = cos α$', zeile:'Gleicher Kosinuswert: $360° − 70° = 290°$', ende:true } ] },
   { titel:'b) Vorzeichen', frage:'$sin 100°$, $cos 100°$, $sin 250°$, $cos 310°$', schritte:[
     { tipp:'Überlege, in welchem Quadranten der Punkt liegt: oben → sin positiv, rechts → cos positiv.', zeile:'$100°$ liegt im II. Quadranten (links oben): $sin 100°$: $+$,  $cos 100°$: $−$' },
     { zeile:'$250°$ liegt im III. Quadranten (links unten): $sin 250°$: $−$' },

     { tipp:'Was bedeutet $cos α$ am Einheitskreis? Wie groß ist der Radius?', zeile:'$cos α$ ist die x-Koordinate eines Punktes auf dem Einheitskreis. Der Kreis hat den Radius $1$ – also liegt $x$ immer zwischen $−1$ und $1$.' },
     { zeile:'<i>oder:</i> Im rechtwinkligen Dreieck ist die Ankathete nie länger als die Hypotenuse, also ist $@f{Ankathete}{Hypotenuse} ≤ 1$.', ende:true } ] }
 ], nachher:'<p class="hinweis-klein" style="margin-top:12px">' + EK + '</p>' },

 { chip:'A4', untertitel:'Teil A · ohne Taschenrechner', titel:'Aufgabe 4: Fehler finden', html:
   '<div class="aufgabentext">Wahr oder falsch? Verbessere die falschen Aussagen.</div>', teile:[
   { titel:'Die vier Aussagen', knopf:'Nächste Aussage', schritte:[

     { tipp:'Merke: Gegenkathete durch Ankathete – „G vor A“ wie im Alphabet.', zeile:'$tan α = @f{Ankathete}{Gegenkathete}$ – <b>falsch</b>. Richtig: $tan α = @f{Gegenkathete}{Ankathete}$' },

 { chip:'A5', untertitel:'Teil A · ohne Taschenrechner', titel:'Aufgabe 5: Welcher Zusammenhang passt?', html:

   '<div class="box" style="font-size:15px">Faustregel: <b>rechtwinklig?</b> → nur Seiten: Pythagoras, sonst sin/cos/tan. <b>Nicht rechtwinklig?</b> → Seite + Gegenwinkel bekannt: Sinussatz; SWS oder SSS: Kosinussatz.</div>',

     { zeile:'$γ = 90°; a; c$ → $α$: <b>sin/cos/tan</b> ($sin α = @f{a}{c}$)' },
     { tipp:'Zwei Seiten und der Winkel dazwischen (SWS).', zeile:'$b; c; α$ → $a$: <b>Kosinussatz</b>' },
     { zeile:'$c; α; γ$ → $a$: <b>Sinussatz</b> ($c$ und $γ$ sind ein Paar)' },

     { zeile:'$γ = 90°; b; α$ → $a$: <b>sin/cos/tan</b> ($tan α = @f{a}{b}$)' },
     { zeile:'$a; b; α$ → $β$: <b>Sinussatz</b> ($a$ und $α$ sind ein Paar)', ende:true } ] }

 { chip:'A8', untertitel:'Teil B · mit Taschenrechner', titel:'Aufgabe 8: Sinusfunktion', html:

 { chip:'A9', untertitel:'Teil B · mit Taschenrechner', titel:'Aufgabe 9: Flächeninhalt im allgemeinen Dreieck', teile:[

 { chip:'A10', untertitel:'Teil B · mit Taschenrechner', titel:'Aufgabe 10: Dreiecke vollständig berechnen', html:

 { chip:'A11', untertitel:'Teil B · mit Taschenrechner', titel:'Aufgabe 11: Grundstück – Viereck', html:

   { titel:'a) Diagonale $[BD]$', schritte:[
     { tipp:'Dreieck $ABD$: zwei Seiten und der Winkel dazwischen → Kosinussatz.', zeile:'$@l{BD}^2 = 42^2 + 30^2 − 2 · 42 · 30 · cos 75°$' },
     { zeile:'$@l{BD} ≈ 44,85 m$', ende:true } ] },
   { titel:'b) Winkel $∢ADB$', frage:'Falls du a) nicht lösen konntest, rechne mit $@l{BD} = 45 m$.', schritte:[
     { tipp:'Im Dreieck $ABD$ kennst du jetzt das Paar $[BD]$ und $75°$. $∢ADB$ liegt gegenüber von $[AB]$ → Sinussatz.', zeile:'$@f{sin ∢ADB}{42} = @f{sin 75°}{44,85}$' },
     { zeile:'$∢ADB ≈ 64,76°$ (mit $45 m$: $≈ 64,36°$)', ende:true } ] },
   { titel:'c) Seiten $[BC]$ und $[CD]$', schritte:[
     { tipp:'Das Dreieck $BCD$ ist rechtwinklig bei $C$. $[BD]$ ist die Hypotenuse, der Winkel $40°$ liegt bei $B$.', zeile:'$cos 40° = @f{@l{BC}}{44,85}  ⇒  @l{BC} ≈ 34,36 m$' },
     { zeile:'$sin 40° = @f{@l{CD}}{44,85}  ⇒  @l{CD} ≈ 28,83 m$', ende:true } ] },
   { titel:'d) Flächeninhalt des Grundstücks', schritte:[
     { tipp:'Teile das Viereck an der Diagonalen in zwei Dreiecke.', zeile:'$A_{ABD} = @f{1}{2} · 42 · 30 · sin 75° m^2 ≈ 608,53 m^2$' },
     { tipp:'Dreieck $BCD$ ist rechtwinklig: $@f{1}{2} · Kathete · Kathete$.', zeile:'$A_{BCD} = @f{1}{2} · 34,36 · 28,83 m^2 ≈ 495,30 m^2$' },
     { zeile:'$A ≈ 1103,83 m^2$', ende:true } ] },
   { titel:'e) Kürzeste Leitung von $D$ zu $[AB]$', schritte:[
     { tipp:'Die kürzeste Leitung ist das Lot von $D$ auf $[AB]$ – sie steht senkrecht auf $[AB]$ (rote Linie).', zeile:'Lot von $D$ auf $[AB]$ einzeichnen (rechter Winkel!)' },
     { tipp:'Im rechtwinkligen Dreieck mit Hypotenuse $[AD] = 30 m$ liegt das Lot dem $75°$-Winkel gegenüber.', zeile:'$sin 75° = @f{h}{30}  ⇒  h = 30 · sin 75° ≈ 28,98 m$', ende:true } ] }
 ]},

 { chip:'A12', untertitel:'Teil B · mit Taschenrechner', titel:'Aufgabe 12: Giebelwand – Fünfeck', html:
   '<div class="aufgabentext">Giebelwand $ABCDE$, $ABCE$ ist ein Rechteck: $@l{AB} = 8 m$; $@l{BC} = 5 m$; $@l{CD} = 5,5 m$; $@l{DE} = 4,5 m$.</div>' +
   BILD('111-a12.png','Fünfeck ABCDE als Giebelwand', ROT), teile:[
   { titel:'a) Winkel $∢CED$', schritte:[
     { tipp:'$ABCE$ ist ein Rechteck – wie lang ist dann $[EC]$?', zeile:'$@l{EC} = @l{AB} = 8 m$' },
     { tipp:'Im Dreieck $ECD$ kennst du alle drei Seiten (SSS) → Kosinussatz nach dem Winkel umgestellt.', zeile:'$cos ∢CED = @f{4,5^2 + 8^2 − 5,5^2}{2 · 4,5 · 8} = 0,75$' },
     { zeile:'$∢CED ≈ 41,41°$', ende:true } ] },
   { titel:'b) Winkel $∢DCE$ mit dem Sinussatz', frage:'Ersatzwert: $∢CED = 41°$', schritte:[
     { tipp:'$∢DCE$ liegt gegenüber von $[DE] = 4,5 m$, $∢CED$ gegenüber von $[CD] = 5,5 m$.', zeile:'$@f{sin ∢DCE}{4,5} = @f{sin 41,41°}{5,5}$' },
     { zeile:'$∢DCE ≈ 32,76°$ (mit $41°$: $≈ 32,46°$)', ende:true } ] },
   { titel:'c) Flächeninhalt der Giebelwand', schritte:[
     { tipp:'Rechteck plus Dreieck. Für das Dreieck: zwei Seiten und der Winkel dazwischen.', zeile:'$A_{ECD} = @f{1}{2} · 4,5 · 8 · sin 41,41° m^2 ≈ 11,91 m^2$' },
     { zeile:'$A = 8 · 5 m^2 + 11,91 m^2 = 51,91 m^2$', ende:true } ] },
   { titel:'d) Wie hoch liegt der First $D$?', schritte:[
     { tipp:'Zeichne das Lot von $D$ auf $[EC]$ ein (rote Linie). Im rechtwinkligen Dreieck ist $[DE]$ die Hypotenuse.', zeile:'$sin 41,41° = @f{h}{4,5}  ⇒  h ≈ 2,98 m$' },
     { tipp:'Die Höhe des Rechtecks kommt noch dazu.', zeile:'Firsthöhe: $5 m + 2,98 m = 7,98 m$', ende:true } ] },
   { titel:'e) Für Füchse: Strecke $[AD]$', schritte:[
     { tipp:'Dreieck $AED$: $@l{AE} = 5 m$, $@l{ED} = 4,5 m$. Der Winkel bei $E$ setzt sich aus dem rechten Winkel und $∢CED$ zusammen.', zeile:'$∢AED = 90° + 41,41° = 131,41°$' },
     { zeile:'$@l{AD}^2 = 5^2 + 4,5^2 − 2 · 5 · 4,5 · cos 131,41° ≈ 75,01$' },
     { zeile:'$@l{AD} ≈ 8,66 m$', ende:true } ] }
 ]},

 { chip:'A13', untertitel:'Teil B · mit Taschenrechner', titel:'Aufgabe 13: Dreieck im Quader', html:
   '<div class="aufgabentext">Quader $ABCDEFGH$ mit $@l{AB} = 9 cm$, $@l{BC} = 6 cm$ und $@l{AE} = 4 cm$.</div>' +
   BILD('111-a13.png','Quader ABCDEFGH mit Dreieck ACH', ROT), teile:[
   { titel:'a) $[AC]$ und $∢CAG$', schritte:[
     { tipp:'$[AC]$ ist die Diagonale der Grundfläche: Dreieck $ABC$ ist rechtwinklig bei $B$.', zeile:'$@l{AC} = @w{9^2 + 6^2} cm ≈ 10,82 cm$' },
     { tipp:'Dreieck $ACG$ ist rechtwinklig bei $C$. $[CG]$ ($4 cm$) liegt dem Winkel gegenüber, $[AC]$ liegt an.', zeile:'$tan ∢CAG = @f{4}{10,82}  ⇒  ∢CAG ≈ 20,29°$', ende:true } ] },
   { titel:'b) $[AH]$ und $[CH]$', schritte:[
     { tipp:'$[AH]$ ist die Diagonale der linken Seitenfläche $ADHE$ ($6 cm$ × $4 cm$).', zeile:'$@l{AH} = @w{6^2 + 4^2} cm ≈ 7,21 cm$' },
     { tipp:'$[CH]$ ist die Diagonale der hinteren Fläche $DCGH$ ($9 cm$ × $4 cm$).', zeile:'$@l{CH} = @w{9^2 + 4^2} cm ≈ 9,85 cm$', ende:true } ] },
   { titel:'c) Winkel $∢CAH$', schritte:[
     { tipp:'Im Dreieck $ACH$ kennst du alle drei Seiten (SSS) → Kosinussatz. $∢CAH$ liegt gegenüber von $[CH]$.', zeile:'$cos ∢CAH = @f{7,21^2 + 10,82^2 − 9,85^2}{2 · 7,21 · 10,82} ≈ 0,4617$' },
     { zeile:'$∢CAH ≈ 62,50°$', ende:true } ] },
   { titel:'d) Winkel $∢HCA$ mit dem Sinussatz', schritte:[
     { tipp:'$∢HCA$ liegt gegenüber von $[AH]$, $∢CAH$ gegenüber von $[CH]$.', zeile:'$@f{sin ∢HCA}{7,21} = @f{sin 62,50°}{9,85}$' },
     { zeile:'$∢HCA ≈ 40,49°$', ende:true } ] },
   { titel:'e) Flächeninhalt des Dreiecks $ACH$', schritte:[
     { tipp:'Zwei Seiten und der Winkel dazwischen – zum Beispiel $[AH]$, $[AC]$ und $∢CAH$.', zeile:'$A = @f{1}{2} · 7,21 · 10,82 · sin 62,50° cm^2 ≈ 34,60 cm^2$', ende:true } ] }
 ]},

 { chip:'A14', untertitel:'Teil B · mit Taschenrechner', titel:'Aufgabe 14: Punkt auf einer Pyramidenkante', html:
   '<div class="aufgabentext">Gerade Pyramide $ABCDS$ mit quadratischer Grundfläche $ABCD$, $M$ ist der Diagonalenschnittpunkt, $S$ liegt senkrecht über $M$. Es gilt $@l{AC} = 8 cm$ und $@l{MS} = 7,5 cm$.</div>' +
   BILD('111-a14.png','Pyramide ABCDS mit Strecke AP', ROT), teile:[
   { titel:'a) Seitenkante $[AS]$ und $∢CAS$', schritte:[
     { tipp:'Dreieck $AMS$ ist rechtwinklig bei $M$, und $@l{AM}$ ist die Hälfte der Diagonalen.', zeile:'$@l{AM} = 4 cm$;  $@l{AS} = @w{4^2 + 7,5^2} cm = 8,50 cm$' },
     { tipp:'Für den Winkel bei $A$: $[MS]$ gegenüber, $[AM]$ anliegend.', zeile:'$tan ∢CAS = @f{7,5}{4}  ⇒  ∢CAS ≈ 61,93°$', ende:true } ] },
   { titel:'b) Warum $∢SCA = ∢CAS$? Berechne $∢ASC$.', schritte:[
     { tipp:'Wie lang sind $[AS]$ und $[CS]$ im Vergleich?', zeile:'Das Dreieck $ACS$ ist gleichschenklig ($@l{AS} = @l{CS}$), also sind die Basiswinkel gleich groß.' },
     { zeile:'$∢ASC = 180° − 2 · 61,93° = 56,14°$', ende:true } ] },
   { titel:'c) Strecke $[AP]$', frage:'$P$ liegt auf $[CS]$ mit $@l{CP} = 3 cm$. Ersatzwert: $∢CAS = 62°$', schritte:[
     { tipp:'Dreieck $APC$: $@l{AC} = 8 cm$, $@l{CP} = 3 cm$, dazwischen der Winkel bei $C$ ($= ∢CAS$ aus b). → Kosinussatz.', zeile:'$@l{AP}^2 = 8^2 + 3^2 − 2 · 8 · 3 · cos 61,93° ≈ 50,41$' },
     { zeile:'$@l{AP} ≈ 7,10 cm$', ende:true } ] },
   { titel:'d) Winkel $∢PAC$', schritte:[
     { tipp:'Sinussatz im Dreieck $APC$: $∢PAC$ liegt gegenüber von $[PC] = 3 cm$, der Winkel bei $C$ gegenüber von $[AP]$.', zeile:'$@f{sin ∢PAC}{3} = @f{sin 61,93°}{7,10}$' },
     { zeile:'$∢PAC ≈ 21,89°$', ende:true } ] },
   { titel:'e) Für Füchse: kleinster Abstand', schritte:[
     { tipp:'Der kürzeste Abstand von $A$ zur Kante $[CS]$ steht senkrecht auf $[CS]$.', zeile:'$[AP_0] ⊥ [CS]$ – das Dreieck $AP_0C$ ist rechtwinklig bei $P_0$.' },
     { tipp:'$[AC]$ ist die Hypotenuse, $[AP_0]$ liegt dem Winkel bei $C$ gegenüber.', zeile:'$sin 61,93° = @f{@l{AP_0}}{8}  ⇒  @l{AP_0} ≈ 7,06 cm$', ende:true } ] }
 ]},

 { chip:'A15', untertitel:'Teil B · mit Taschenrechner', titel:'Aufgabe 15: Funktionale Abhängigkeit', html:
   '<div class="aufgabentext">Im Dreieck $ABC$ gilt $@l{AB} = 10 cm$, $@l{AC} = 8 cm$ und $∢BAC = 70°$. Auf $[AB]$ liegen Punkte $D_n$ mit $@l{AD_n} = 2x cm$, auf $[AC]$ liegen Punkte $E_n$ mit $@l{CE_n} = x cm$. Sie bilden mit $A$ die Dreiecke $AD_nE_n$.</div>' + SKIZZE15, teile:[
   { titel:'a) Zuerst mit einer Zahl: $x = 1,5$', schritte:[
     { tipp:'$@l{AD_1} = 2x$. Und Achtung: $x$ wird von $C$ aus abgemessen – $@l{AE_1}$ ist der <b>Rest</b> von $8 cm$.', zeile:'$@l{AD_1} = 2 · 1,5 cm = 3 cm$;  $@l{AE_1} = 8 cm − 1,5 cm = 6,5 cm$' },
     { tipp:'Für $[D_1E_1]$: zwei Seiten und der Winkel $70°$ dazwischen → Kosinussatz.', zeile:'$@l{D_1E_1}^2 = 3^2 + 6,5^2 − 2 · 3 · 6,5 · cos 70° ≈ 37,91  ⇒  @l{D_1E_1} ≈ 6,16 cm$' },
     { zeile:'$A = @f{1}{2} · 3 · 6,5 · sin 70° cm^2 ≈ 9,16 cm^2$', ende:true } ] },
   { titel:'b) Jetzt allgemein', frage:'Gib $@l{AD_n}$ und $@l{AE_n}$ in Abhängigkeit von $x$ an. Welche Werte darf $x$ annehmen?', schritte:[
     { tipp:'Dieselbe Rechnung wie in a) – nur mit $x$ statt $1,5$.', zeile:'$@l{AD_n}(x) = 2x cm$;  $@l{AE_n}(x) = (8 − x) cm$' },
     { tipp:'$D_n$ muss auf $[AB]$ bleiben: $2x ≤ 10$. Und für ein echtes Dreieck muss $x > 0$ sein.', zeile:'$2x ≤ 10$ und $x > 0$, also $0 < x ≤ 5$', ende:true } ] },
   { titel:'c) Flächeninhalt $A(x)$', frage:'Zeige: $A(x) = (−0,94x^2 + 7,52x) cm^2$', schritte:[
     { tipp:'Wie in a): $A = @f{1}{2} · b · c · sin α$ – mit den Termen aus b).', zeile:'$A(x) = @f{1}{2} · 2x · (8 − x) · sin 70° cm^2$' },
     { tipp:'$@f{1}{2} · 2x = x$. Dann $x$ in die Klammer multiplizieren.', zeile:'$= (8x − x^2) · sin 70° cm^2$' },
     { tipp:'$sin 70° ≈ 0,94$ in die Klammer multiplizieren und $x^2$ nach vorne.', zeile:'$A(x) ≈ (−0,94x^2 + 7,52x) cm^2$', ende:true } ] },
   { titel:'d) Größter Flächeninhalt', schritte:[
     { tipp:'TR (Scheitelpunkt): MENU → A Gleichung/Funkt → 2 Polynom → Grad 2. Hinten steht keine Zahl, also $c = 0$.', zeile:'$a = −0,94;  b = 7,52;  c = 0$' },
     { tipp:'Liegt der x-Wert im erlaubten Bereich aus b)?', zeile:'$x = 4$;  $A_{max} ≈ 15,04 cm^2$ ($0 < 4 ≤ 5$ ✓)', ende:true } ] },
   { titel:'e) Gleichschenklig mit Basis $[D_2E_2]$', schritte:[
     { tipp:'Basis $[D_2E_2]$ heißt: Die beiden Schenkel an $A$ sind gleich lang.', zeile:'$@l{AD_2} = @l{AE_2}  ⇒  2x = 8 − x$' },
     { zeile:'$3x = 8  ⇒  x = @f{8}{3} ≈ 2,67$', ende:true } ] },
   { titel:'f) Für Füchse: kürzeste Strecke $[D_nE_n]$', frage:'Zeige: $@l{D_nE_n}(x) = @w{6,37x^2 − 26,94x + 64} cm$. Wann ist die Strecke am kürzesten?', schritte:[
     { tipp:'Kosinussatz wie in a) – mit $2x$ und $(8 − x)$.', zeile:'$@l{D_nE_n}^2 = (2x)^2 + (8 − x)^2 − 2 · 2x · (8 − x) · cos 70°$' },
     { tipp:'Ausmultiplizieren: $(2x)^2 = 4x^2$, $(8 − x)^2 = 64 − 16x + x^2$, $2 · 2x · (8 − x) = 32x − 4x^2$ und $cos 70° ≈ 0,3420$.', zeile:'$= 4x^2 + 64 − 16x + x^2 − (32x − 4x^2) · 0,3420$' },
     { zeile:'$= 6,37x^2 − 26,94x + 64$  ⇒  $@l{D_nE_n}(x) = @w{6,37x^2 − 26,94x + 64} cm$' },
     { tipp:'In den TR kommt nur der Term <b>unter der Wurzel</b>: $a = 6,37;  b = −26,94;  c = 64$. Diesmal suchst du das Minimum.', zeile:'TR: $x ≈ 2,11$, kleinster Wert des Radikanden $≈ 35,52$' },
     { tipp:'Der TR-Wert ist noch das Quadrat der Länge.', zeile:'$@l{D_nE_n}_{min} ≈ @w{35,52} cm ≈ 5,96 cm$ für $x ≈ 2,11$', ende:true } ] }
 ]},
