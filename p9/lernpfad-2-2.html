<script>
/* =====================================================================
   Selbstlernpfad 2.2 – Pendant zur interaktiven H5P-Präsi im ByCS-Kurs.
   Formeln stehen zwischen $…$ (LaTeX, KaTeX).
   ===================================================================== */
var U = function (e) { return '\\,' + (e === 'l' ? '\\ell' : '\\mathrm{' + e + '}'); };
var C = '\\,{}^{\\circ}\\mathrm{C}';
var PF = '\\;\\rightarrow\\;';
var B = 'bilder/2-2/';

function tex(x) {
  if (window.katex) { try { return katex.renderToString(x, { throwOnError: false, strict: 'ignore' }); } catch (e) {} }
  return x.replace(/\\dfrac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)').replace(/\\,|\\;|\\mathrm|\\cdot|\\ldots|\\approx|\\vartheta|\\circ|\\rightarrow|\\ell|[{}\\^_]/g, function (m) {
    return { '\\cdot': '·', '\\ldots': '…', '\\approx': '≈', '\\vartheta': 'ϑ', '\\circ': '°', '\\rightarrow': '→', '\\ell': 'l' }[m] || ''; });
}
function fmt(s) { return (s || '').replace(/\$([^$]+)\$/g, function (_, x) { return '<span class="f">' + tex(x) + '</span>'; }); }
function zahl(s) {
  s = String(s).replace(/[\s  ']/g, '').replace(/−|–/g, '-');
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return s === '' ? NaN : Number(s);
}
function gleich(a, b) { return Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(b)); }
function mischen(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function bild(datei, alt, extra) { return '<figure class="bild rahmen' + (extra ? ' ' + extra : '') + '"><img src="' + B + datei + '" alt="' + alt + '" loading="lazy"></figure>'; }

var main = document.getElementById('main');
function karte(chip, html) {
  var sec = document.createElement('section'); sec.className = 'karte';
  if (chip) sec.dataset.chip = chip;
  sec.innerHTML = html; main.appendChild(sec); return sec;
}

/* ---------- Quiz-Bausteine ---------- */
/* Auswahlaufgabe: typ 'einzel' oder 'mehr'; antworten: [{t, ok, fb}] */
function auswahl(sec, typ, frage, antworten) {
  var box = document.createElement('div');
  box.innerHTML = '<p><b>' + frage + '</b>' + (typ === 'mehr' ? ' <span class="klein">(mehrere Antworten möglich)</span>' : '') + '</p>' +
    '<ul class="mc ' + typ + '"></ul><div class="qknopf"><button class="pr" type="button">Überprüfen</button>' +
    '<button class="zeig" type="button" disabled>Lösung anzeigen</button><button class="nochmal" type="button" disabled>Nochmal</button></div><div class="rueck"></div>';
  sec.appendChild(box);
  var ul = box.querySelector('.mc'), rk = box.querySelector('.rueck'),
      bp = box.querySelector('.pr'), bz = box.querySelector('.zeig'), bn = box.querySelector('.nochmal');
  var knoepfe = [];
  function aufbauen() {
    ul.innerHTML = ''; knoepfe = []; rk.className = 'rueck'; rk.innerHTML = '';
    mischen(antworten).forEach(function (a) {
      var li = document.createElement('li');
      var b = document.createElement('button'); b.type = 'button';
      b.innerHTML = '<span class="kx"></span><span>' + fmt(a.t) + '</span>';
      b.onclick = function () {
        if (typ === 'einzel') knoepfe.forEach(function (k) { k.b.classList.remove('an'); });
        b.classList.toggle('an');
      };
      li.appendChild(b); ul.appendChild(li); knoepfe.push({ b: b, a: a, li: li });
    });
    bp.disabled = false; bz.disabled = true; bn.disabled = true;
  }
  bp.onclick = function () {
    var gewaehlt = knoepfe.filter(function (k) { return k.b.classList.contains('an'); });
    if (!gewaehlt.length) { rk.className = 'rueck fast'; rk.innerHTML = 'Wähle zuerst eine Antwort aus.'; return; }
    var alleRichtig = true;
    knoepfe.forEach(function (k) {
      var an = k.b.classList.contains('an');
      k.b.disabled = true;
      if (an) {
        k.b.classList.add(k.a.ok ? 'r' : 'f'); k.b.querySelector('.kx').textContent = k.a.ok ? '✓' : '✗';
        if (k.a.fb) { var d = document.createElement('div'); d.className = 'fb'; d.innerHTML = fmt(k.a.fb); k.li.appendChild(d); }
      }
      if (an !== !!k.a.ok) alleRichtig = false;
    });
    if (alleRichtig) { rk.className = 'rueck gut'; rk.innerHTML = '<b>Super, alles richtig!</b>'; }
    else { rk.className = 'rueck falsch'; rk.innerHTML = 'Noch nicht ganz. Lies die Folie davor noch einmal – dann <b>Nochmal</b> oder <b>Lösung anzeigen</b>.'; }
    bp.disabled = true; bz.disabled = alleRichtig; bn.disabled = false;
  };
  bz.onclick = function () {
    knoepfe.forEach(function (k) { if (k.a.ok && !k.b.classList.contains('r')) { k.b.classList.add('fehlt'); k.b.querySelector('.kx').textContent = '✓'; } });
    rk.className = 'rueck fast'; rk.innerHTML = 'Gestrichelt: Das wäre auch richtig gewesen.'; bz.disabled = true;
  };
  bn.onclick = aufbauen;
  aufbauen();
}

/* Lückentext mit Wortspeicher: saetze mit [Wort] als Lücke */
function lueckentext(sec, auftrag, saetze, tipp) {
  var woerter = [];
  var html = saetze.map(function (s) {
    return '<p>' + s.replace(/\[([^\]]+)\]/g, function (_, w) { woerter.push(w); return '<button type="button" class="luecke" data-w="' + w + '">&nbsp;</button>'; }) + '</p>';
  }).join('');
  var box = document.createElement('div');
  box.innerHTML = '<p><b>' + auftrag + '</b> <span class="klein">Tippe auf ein Wort – es kommt in die markierte Lücke. Tippe auf eine gefüllte Lücke, um sie zu leeren.</span></p>' +
    '<div class="speicher"></div><div class="lt">' + html + '</div>' +
    '<div class="qknopf"><button class="pr" type="button">Überprüfen</button><button class="zeig" type="button" disabled>Lösung anzeigen</button>' +
    '<button class="nochmal" type="button" disabled>Nochmal</button></div><div class="rueck"></div>';
  sec.appendChild(box);
  var sp = box.querySelector('.speicher'), lk = [].slice.call(box.querySelectorAll('.luecke')), rk = box.querySelector('.rueck'),
      bp = box.querySelector('.pr'), bz = box.querySelector('.zeig'), bn = box.querySelector('.nochmal'), ziel = null, fertig = false;
  function markiere(l) { lk.forEach(function (x) { x.classList.remove('ziel'); }); ziel = l; if (l) l.classList.add('ziel'); }
  function naechsteLeere() { for (var i = 0; i < lk.length; i++) if (!lk[i].dataset.v) return lk[i]; return null; }
  function aufbauen() {
    sp.innerHTML = ''; fertig = false; rk.className = 'rueck';
    lk.forEach(function (l) { l.dataset.v = ''; l.innerHTML = '&nbsp;'; l.className = 'luecke'; l.disabled = false; });
    mischen(woerter).forEach(function (w) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = w;
      b.onclick = function () {
        if (fertig) return;
        var l = ziel && !ziel.dataset.v ? ziel : naechsteLeere(); if (!l) return;
        l.dataset.v = w; l.textContent = w; l._quelle = b; b.classList.add('weg'); markiere(naechsteLeere());
      };
      sp.appendChild(b);
    });
    markiere(lk[0]); bp.disabled = false; bz.disabled = true; bn.disabled = true;
  }
  lk.forEach(function (l) {
    l.onclick = function () {
      if (fertig) return;
      if (l.dataset.v) { l._quelle.classList.remove('weg'); l.dataset.v = ''; l.innerHTML = '&nbsp;'; }
      markiere(l);
    };
  });
  bp.onclick = function () {
    if (naechsteLeere()) { rk.className = 'rueck fast'; rk.innerHTML = 'Fülle zuerst alle Lücken.'; return; }
    fertig = true; markiere(null);
    var n = 0;
    lk.forEach(function (l) { var ok = l.dataset.v === l.dataset.w; if (ok) n++; l.classList.add(ok ? 'r' : 'f'); l.disabled = true; });
    if (n === lk.length) { rk.className = 'rueck gut'; rk.innerHTML = '<b>Super!</b> ' + n + ' von ' + lk.length + ' richtig.'; }
    else { rk.className = 'rueck falsch'; rk.innerHTML = n + ' von ' + lk.length + ' richtig. ' + fmt(tipp); }
    bp.disabled = true; bz.disabled = n === lk.length; bn.disabled = false;
  };
  bz.onclick = function () { lk.forEach(function (l) { l.textContent = l.dataset.w; l.className = 'luecke r'; }); bz.disabled = true; };
  bn.onclick = aufbauen;
  aufbauen();
}

/* Lösungsweg Schritt für Schritt (wie 2.3 / 2.4) */
function schrittweise(div, schritte) {
  var ort = div.querySelector('.tipp-ort'), bt = div.querySelector('.k-tipp'), bz = div.querySelector('.k-zeile'),
      ba = div.querySelector('.k-alles'), fe = div.querySelector('.fertig'), leer = div.querySelector('.leer-hinweis');
  var n = 0, warn = false;
  function status() {
    var s = schritte[n];
    bt.disabled = !s || !s.tipp || ort.innerHTML !== '';
    bz.disabled = !s; ba.disabled = !s;
    fe.style.display = s ? 'none' : 'block';
    if (leer) leer.style.display = (s && s.s === 'l') ? 'block' : 'none';
    if (!s) { ba.classList.remove('warnung'); ba.textContent = 'Ganze Lösung'; }
  }
  function zeige() {
    var s = schritte[n]; if (!s) return;
    var li = document.createElement('li');
    li.innerHTML = (s.lab ? '<span class="lab">' + s.lab + '</span>' : '') + fmt(s.z);
    if (s.ende) li.className = 'ende'; if (s.cls) li.className = s.cls;
    div.querySelector('.zeilen[data-s="' + (s.s || 'a') + '"]').appendChild(li);
    n++; ort.innerHTML = '';
  }
  bt.onclick = function () { var s = schritte[n]; if (s && s.tipp) ort.innerHTML = '<div class="tipp">' + fmt(s.tipp) + '</div>'; status(); };
  bz.onclick = function () { zeige(); warn = false; ba.classList.remove('warnung'); ba.textContent = 'Ganze Lösung'; status(); };
  ba.onclick = function () {
    if (!warn) { warn = true; ba.classList.add('warnung'); ba.textContent = 'Wirklich? Erst selbst probieren! (nochmal tippen)'; return; }
    while (n < schritte.length) zeige(); warn = false; status();
  };
  status();
}
function teilAufdecken(sec, titel, frage, schritte, knopf) {
  var t = document.createElement('div'); t.className = 'teil';
  t.innerHTML = '<h3>' + titel + '</h3>' + (frage ? '<p class="frage">' + frage + '</p>' : '') +
    '<ul class="zeilen" data-s="a"></ul><div class="tipp-ort"></div><div class="knoepfe"><button class="k-tipp" type="button">Tipp</button>' +
    '<button class="k-zeile" type="button">' + (knopf || 'Nächster Schritt') + '</button><button class="k-alles" type="button">Ganze Lösung</button></div>' +
    '<div class="fertig">✓ Fertig – vergleiche mit deinem Blatt.</div>';
  sec.appendChild(t); schrittweise(t, schritte); return t;
}

/* =====================================================================
   Karten (Reihenfolge wie die interaktive Präsi in ByCS)
   ===================================================================== */

/* Folie 1 */
karte('Start',
  '<h2>Wie kalt kann es werden?</h2>' +
  '<div class="zweispaltig"><div>' +
  '<p>Heute arbeitest du <b>selbstständig</b>: mit einem Versuch, einem Diagramm und dem Teilchenmodell.</p>' +
  '<div class="auftrag"><b class="t">Bevor du startest</b>Halte dein <b>Arbeitsblatt 2.2</b> und ein <b>Lineal</b> bereit. Klicke dich mit <b>Weiter</b> Karte für Karte durch.</div>' +
  '<div class="pdfs"><a href="pdf/2-2-ab.pdf">Arbeitsblatt 2.2 (PDF)</a></div>' +
  '</div><div>' + bild('leiter.png', 'Thermometer mit Temperaturen von 100 °C bis −196 °C, darunter ein Fragezeichen') + '</div></div>');

/* Folie 2 – eigenes Bild statt Foto */
karte('Erinnerung',
  '<h2>Erinnerung: Zustandsgrößen eines Gases</h2>' +
  '<figure class="bild"><svg viewBox="0 0 410 200" width="360" style="max-width:100%" role="img" aria-label="Fahrradreifen in der Sonne: Temperatur steigt, Druck steigt">' +
  '<circle cx="52" cy="48" r="22" fill="#ffd23f"/><g stroke="#ffd23f" stroke-width="5" stroke-linecap="round">' +
  '<path d="M52 12v-8M52 92v-8M16 48h-8M96 48h-8M27 23l-6-6M83 79l6 6M27 73l-6 6M83 17l6-6"/></g>' +
  '<circle cx="200" cy="110" r="72" fill="none" stroke="#1f2f3d" stroke-width="16"/><circle cx="200" cy="110" r="58" fill="none" stroke="#6b7780" stroke-width="2"/>' +
  '<circle cx="200" cy="110" r="8" fill="#6b7780"/><g stroke="#9aa8b2" stroke-width="1.5"><path d="M200 52v116M142 110h116M159 69l82 82M241 69l-82 82"/></g>' +
  '<g font-family="Calibri,Segoe UI,Arial" font-weight="bold" font-size="18"><text x="292" y="62" fill="#c2410c">T ↑</text>' +
  '<text x="292" y="112" fill="#0E7490">V ≈ gleich</text><text x="292" y="162" fill="#c00000">p ↑</text></g></svg>' +
  '<figcaption>Fahrradreifen in der Sonne</figcaption></figure>' +
  '<p>Ein eingeschlossenes Gas beschreibst du mit drei <b>Zustandsgrößen</b>:</p>' +
  '<ul class="liste2"><li><b>Druck</b> <i>p</i></li><li><b>Volumen</b> <i>V</i></li><li><b>Temperatur</b> <i>T</i></li></ul>' +
  '<p>Ändert sich eine Zustandsgröße, ändert sich immer mindestens eine weitere.</p>' +

  t.innerHTML = '<h3>a) Lösungsweg Schritt für Schritt</h3><p class="frage">Erst selbst probieren – dann Schritt für Schritt vergleichen.</p>' +
    '<div class="loesung"><div class="spalte"><h4>links im Heft</h4><ul class="zeilen" data-s="l"></ul></div>' +
    '<div class="spalte"><h4>rechts im Heft</h4><ul class="zeilen" data-s="r"></ul><p class="leer-hinweis">… kommt nach der linken Seite</p></div>' +
    '<div class="antwort"><ul class="zeilen" data-s="a"></ul></div></div>' +
    '<div class="tipp-ort"></div><div class="knoepfe"><button class="k-tipp" type="button">Tipp</button>' +
    '<button class="k-zeile" type="button">Nächster Schritt</button><button class="k-alles" type="button">Ganze Lösung</button></div>' +
    '<div class="fertig">✓ Fertig – vergleiche mit deinem Heft.</div>';
  sec.appendChild(t);
  schrittweise(t, [
    { s: 'l', lab: 'geg.', z: '$V_1 = 3{,}0' + U('l') + '$<br>$\\vartheta_1 = 20' + C + PF + 'T_1 = 20 + 273 = 293' + U('K') + '$<br>$\\vartheta_2 = -196' + C + PF + 'T_2 = -196 + 273 = 77' + U('K') + '$<br>$p_1 = p_2$',
      tipp: 'Schreibe alle Angaben mit Formelzeichen und Einheit heraus – Temperaturen gleich in Kelvin: $T = \\vartheta + 273$. Bei −196 °C: $-196 + 273 = 77$.' },
    { s: 'l', lab: 'ges.', z: '$V_2$', tipp: 'Wonach wird gefragt? Das Gesuchte steht ganz unten links.' },
    { s: 'r', lab: 'Formel', z: '$\\dfrac{V_1}{T_1} = \\dfrac{V_2}{T_2}$ &nbsp;(Druck bleibt gleich)',
      tipp: 'Der Druck bleibt gleich – dann gilt: $V : T$ ist konstant (Aufgabe 1).' },
    { s: 'r', lab: 'Umstellen', z: '$V_2 = \\dfrac{V_1 \\cdot T_2}{T_1}$', tipp: 'Beide Seiten mit $T_2$ malnehmen.' },
    { s: 'r', lab: 'Einsetzen', z: '$V_2 = \\dfrac{3{,}0' + U('l') + ' \\cdot 77' + U('K') + '}{293' + U('K') + '}$',
      tipp: 'Zahlen <b>mit Einheiten</b> einsetzen. K kürzt sich, übrig bleibt l.' },
    { s: 'r', lab: 'Ergebnis', z: '$V_2 = 0{,}788\\ldots' + U('l') + '$', tipp: 'Taschenrechner: $3 \\cdot 77 : 293$.' },
    { s: 'r', lab: 'Runden', cls: 'runden', z: 'Angaben: 3,0 l (2) · 20 °C (2) · −196 °C (3) → <b>2 Ziffern</b><br>$V_2 \\approx$ <span class="erg">$0{,}79' + U('l') + '$</span>',
      tipp: 'Die Angabe mit den wenigsten Ziffern bestimmt die Genauigkeit (mindestens 2). Bei 0,788… zählen die Nullen vorne nicht mit.' },
    { s: 'a', lab: 'Antwortsatz', z: 'Im flüssigen Stickstoff hat der Ballon nur noch ein Volumen von etwa 0,79 l.', ende: true }
  ]);
  teilAufdecken(sec, 'b) Was passiert beim Herausnehmen?', null, [
    { z: 'Die Luft im Ballon erwärmt sich wieder, die Teilchen werden schneller → das Volumen nimmt zu, bis der Ballon wieder etwa 3,0 l hat.',

/* ---------- Navigation + Sprungleiste ---------- */
(function () {
  var karten = [].slice.call(document.querySelectorAll('.karte')), i = 0;
  var chips = document.getElementById('chips'), chipKarte = [];
  karten.forEach(function (k, j) {
    if (k.dataset.chip) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = k.dataset.chip;
      b.onclick = function () { zeigeK(j); }; chips.appendChild(b); chipKarte.push([b, j]);
    }
  });
  function zeigeK(n) {
    i = Math.max(0, Math.min(karten.length - 1, n));
    karten.forEach(function (k, j) { k.classList.toggle('aktiv', j === i); });
    if (karten[i] !== videoKarte) videoStopp();
    var aktiv = null; chipKarte.forEach(function (c) { if (c[1] <= i) aktiv = c[0]; });
    chipKarte.forEach(function (c) { c[0].classList.toggle('an', c[0] === aktiv); });
    if (aktiv) aktiv.scrollIntoView({ inline: 'center', block: 'nearest' });
    document.getElementById('zurueck').disabled = (i === 0);
    document.getElementById('weiter').textContent = (i === karten.length - 1) ? 'Zum Start ↺' : 'Weiter ▶';
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
    window.scrollTo(0, 0);
  }
  document.getElementById('weiter').onclick = function () { zeigeK(i === karten.length - 1 ? 0 : i + 1); };
  document.getElementById('zurueck').onclick = function () { zeigeK(i - 1); };
  var start = parseInt((location.hash || '').slice(1), 10);
  zeigeK(isNaN(start) ? 0 : start - 1);
})();
