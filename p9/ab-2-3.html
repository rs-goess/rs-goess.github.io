<script>
/* =====================================================================
   Physik 9b · 2.3 Allgemeine Zustandsgleichung idealer Gase – Lernpfad auf dem Blatt
   Bilder: bilder/2-3/*.webp (Ausschnitte aus dem Schüler-AB)
   Maße in cm wie in der PowerPoint (Blatt 19,05 × 27,52 cm).
   Regel: jede Zeile mit Einheit; Umrechnen in die Grundeinheit mit Zehnerpotenzen.
   ===================================================================== */
var U = function (e) { return '\\,\\mathrm{' + e + '}'; };
var C = '\\,{}^{\\circ}\\mathrm{C}';
var PF = '\\,\\rightarrow\\,';
var PA = function (z, e) { return z + '\\cdot 10^{' + e + '}' + U('Pa'); };
var M3 = function (z, e) { return z + '\\cdot 10^{' + e + '}' + U('m^3'); };
/* ϑ = … °C → T = (… + 273) K = … K */
var TK = function (i, c, k) { return '$\\vartheta_' + i + ' = ' + c + C + PF + 'T_' + i + ' = (' + c + ' + 273)' + U('K') + ' = ' + k + U('K') + '$'; };
/* Zeilen-Helfer: links (geg.), ges., rechts, Antwort */
var LX = 1.85, RX = 9.95;
function L(y, z, o) { return Object.assign({ x: LX, y: y, z: z, s: 'geg.' }, o || {}); }
function GEG(y, z, o) { return Object.assign(L(y, z, o), { lab: 'geg.:' }); }
function GES(y, z, o) { return Object.assign({ x: LX, y: y, z: z, s: 'ges.', lab: 'ges.:' }, o || {}); }
function R(y, z, s, o) { return Object.assign({ x: RX, y: y, z: z, s: s }, o || {}); }
function ANT(y, z, o) { return Object.assign({ x: 2.75, y: y, z: z, s: 'Antwortsatz', lab: 'Antwort:', cls: 'satz' }, o || {}); }
function ZIFF(y, t) { return { x: RX, y: y, z: '<span class="klein">' + t + '</span>', s: 'Ziffern' }; }

/* ---------- Erklärungen ---------- */
var E_KELVIN = function (c, k) { return { schritte: [
  { k: 'Warum Kelvin?', t: 'Die Gasgesetze gelten nur mit der <b>absoluten Temperatur</b>. Bei 0 K hätte das Gas keinen Druck mehr – in °C ist das −273 °C.' },
  { k: 'Umrechnen', t: 'Zur Temperatur in °C immer 273 dazuzählen. Die Klammer zeigt: Das Ergebnis ist in Kelvin.', f: '$T = (\\vartheta + 273)' + U('K') + '$' },
  { k: 'Hier', f: '$T = (' + c + ' + 273)' + U('K') + ' = ' + k + U('K') + '$' }] }; };
var E_MINUS = function (c, k) { return { schritte: [
  { k: 'Negative Temperatur', t: '$' + c + C + '$ heißt: ' + String(c).replace('-', '') + ' Grad unter null.' },
  { k: 'Rechnen', t: 'Du zählst 273 dazu – das ist dasselbe wie 273 minus ' + String(c).replace('-', '') + ':', f: '$T = (' + c + ' + 273)' + U('K') + ' = ' + k + U('K') + '$' },
  { k: 'Typischer Fehler', t: 'Wer das Minus vergisst, rechnet $(' + String(c).replace('-', '') + ' + 273)' + U('K') + '$ – das ist viel zu warm.' }] }; };
var E_BAR = { schritte: [
  { k: 'Grundeinheit des Drucks', t: 'Die Grundeinheit des Drucks ist das <b>Pascal</b>: $1' + U('Pa') + ' = 1\\,\\tfrac{\\mathrm{N}}{\\mathrm{m^2}}$.' },
  { k: 'bar in Pa', t: '$1' + U('bar') + ' = 100\\,000' + U('Pa') + ' = 10^{5}' + U('Pa') + '$ – du hängst also einfach $\\cdot 10^5$ an und schreibst Pa.' },
  { k: 'Gut zu wissen', t: 'Gleiche Einheiten kürzen sich beim Einsetzen – auch in bar käme dasselbe heraus. Mit der Grundeinheit bist du aber immer auf der sicheren Seite.' }] };
var E_HPA = function (z, z1, e1) { return { schritte: [
  { k: 'Was heißt „h“?', t: '„Hekto“ heißt hundert: $1' + U('hPa') + ' = 100' + U('Pa') + ' = 10^{2}' + U('Pa') + '$.' },
  { k: 'In Pa', f: '$' + z + U('hPa') + ' = ' + PA(z, 2) + '$' },
  { k: 'Schöner schreiben', t: 'Vor dem Komma soll nur eine Ziffer stehen. Wandert das Komma nach links, wird die Hochzahl um genauso viele Stellen größer:', f: '$' + PA(z, 2) + ' = ' + PA(z1, e1) + '$' }] }; };
var E_KREUZ = function (ges, f) { return { schritte: [
  { k: 'Ziel', t: 'Die gesuchte Größe $' + ges + '$ soll allein auf einer Seite stehen.' },
  { k: 'Malnehmen', t: 'Steht $' + ges + '$ oben und darunter eine Temperatur, nimmst du beide Seiten mit dieser Temperatur mal. Dann teilst du durch alles, was noch neben $' + ges + '$ steht.' },
  { k: 'Ergebnis', f: f },
  { k: 'Probe mit dem Verstand', t: 'Wird das Gas wärmer, muss der Druck (bzw. das Volumen) größer werden. Passt das zu deiner Formel?' }] }; };
var E_TR = { schritte: [
  { k: 'Zehnerpotenz eintippen', t: 'Nutze die Taste <b>×10<sup>x</sup></b> (bei manchen Rechnern <b>EXP</b>). $4{,}0\\cdot10^5$ tippst du als <b>4 ×10<sup>x</sup> 5</b>.' },
  { k: 'Teilen durch zwei Größen', t: 'Steht hinter dem „:“ eine Klammer, musst du auch im Taschenrechner eine Klammer setzen: <b>… ÷ ( … × … )</b>.' },
  { k: 'Anzeige lesen', t: 'Zeigt der Rechner z. B. <b>468259,3…</b>, schreibst du $4{,}68\\text{…}\\cdot 10^5$: Komma 5 Stellen nach links, Hochzahl 5.' }] };
var E_ZIFFERN = function (angaben, erg) { return { schritte: [
  { k: 'Regel', t: 'Das Ergebnis bekommt so viele Ziffern wie die Angabe mit den <b>wenigsten Ziffern</b> – aber mindestens 2.' },
  { k: 'Ziffern zählen', t: angaben },
  { k: 'Zehnerpotenz zählt nicht mit', t: 'Bei $4{,}7 \\cdot 10^5$ zählst du nur 4 und 7. Das $\\cdot 10^5$ sagt nur, wie groß die Zahl ist.' },
  { k: 'Also', f: erg }] }; };

window.PFAD = {
  fach: 'Physik 9b', titel: '2.3 Allgemeine Zustandsgleichung', zurueck: 'material.html',

    '<ol class="start"><li>Rechne zuerst <b>selbst</b> auf deinem Blatt.</li>' +
    '<li>Gib dein Ergebnis bei <b>Ergebnis prüfen</b> ein.</li>' +
    '<li>Hängst du fest? <span class="mini" style="background:var(--gelb)">Tipp</span> hilft beim nächsten Schritt. Der gelbe Rahmen zeigt, wo die nächste Zeile hinkommt.</li>' +
    '<li>Bei schwierigen Zeilen erscheint eine <span class="mini" style="background:var(--orange);color:#fff">Glühbirne</span> – tippe darauf, dann bekommst du eine Erklärung.</li></ol>' +
    '<div class="box">📱 Am Handy: <b>quer halten</b>, dann ist das Blatt größer. Du kannst auch mit zwei Fingern zoomen.</div>' +
    '<div class="merk"><b>Umrechnen in die Grundeinheit</b><br>' +

    'Volumen: $1' + U('l') + ' = 1' + U('dm^3') + ' = 10^{-3}' + U('m^3') + '$, $1' + U('cm^3') + ' = 10^{-6}' + U('m^3') + '$</div>' +
    '<div class="box"><b>In der Physik gilt:</b> Jede Zeile bekommt eine Einheit. <b>Sinnvolle Ziffern:</b> so viele wie die Angabe mit den wenigsten Ziffern – mindestens 2. Die Zehnerpotenz zählt nicht mit.</div>' },

  /* ===================== Tabelle ===================== */
  { chip: 'Tabelle', name: 'Die Gasgesetze im Überblick', bild: { src: 'bilder/2-3/tabelle.webp', y0: 2.0, y1: 7.15 },
    zeilen: [

      { x: 11.5, y: 4.09, mitte: true, z: 'Druck $p$', s: 'bleibt gleich', tipp: 'Gay-Lussac: Ein dehnbarer Luftballon passt seinen Druck immer dem Luftdruck außen an.' },
      { x: 16.2, y: 4.09, mitte: true, z: 'Volumen $V$', s: 'bleibt gleich', tipp: 'Amontons: Die Spraydose kann sich nicht ausdehnen.' },
      { x: 6.8, y: 5.24, mitte: true, z: '$p \\cdot V = \\text{konstant}$', s: 'Formel', birne: [8.85, 4.75], tipp: 'Halbes Volumen → doppelter Druck. Was bleibt dann gleich: Produkt oder Quotient?',
        erkl: { schritte: [{ k: 'Je – desto', t: 'Je kleiner das Volumen, desto größer der Druck (antiproportional).' }, { k: 'Formel', t: 'Bei antiproportionalen Größen bleibt das <b>Produkt</b> gleich:', f: '$p \\cdot V = \\text{konstant}$' }] } },
      { x: 11.5, y: 5.24, mitte: true, z: '$V : T = \\text{konstant}$', s: 'Formel', tipp: 'Doppelte Temperatur (in K) → doppeltes Volumen. Bei proportionalen Größen bleibt der <b>Quotient</b> gleich.' },
      { x: 16.2, y: 5.24, mitte: true, z: '$p : T = \\text{konstant}$', s: 'Formel', tipp: 'Doppelte Temperatur (in K) → doppelter Druck.' },
      { x: 6.8, y: 6.39, mitte: true, w: 4.4, cls: 'zwei', z: 'Luftblase steigt beim Tauchen auf', s: 'Beispiel', tipp: 'Denk an Taucher: Je weiter oben, desto kleiner der Wasserdruck …' },
      { x: 11.5, y: 6.39, mitte: true, w: 4.4, cls: 'zwei', z: 'Ballon in flüssigem Stickstoff', s: 'Beispiel', tipp: 'Denk an den Versuch aus 2.2.' },
      { x: 16.2, y: 6.39, mitte: true, w: 4.4, cls: 'zwei', z: 'Spraydose im heißen Auto', s: 'Beispiel', tipp: 'Denk an den Warnhinweis auf Spraydosen.' }

      { x: 1.15, y: 10.48, z: '2. Für zwei Zustände gilt: &nbsp;$\\dfrac{p_1 \\cdot V_1}{T_1} = \\dfrac{p_2 \\cdot V_2}{T_2}$', s: '2.', tipp: 'Index 1 = vorher, Index 2 = nachher.' },
      { x: 1.15, y: 11.98, z: '3. Die Temperatur immer in Kelvin einsetzen!', s: '3.', tipp: 'Was muss man bei der Temperatur immer beachten?' }

      { x: 1.65, y: 17.58, cls: 'satz', z: 'Gegebene und gesuchte Größen herausschreiben, Temperaturen in Kelvin umrechnen', s: '1. Schritt', tipp: 'Was schreibst du ganz am Anfang links hin?' },
      { x: 1.65, y: 18.48, cls: 'satz', z: 'Ansatz notieren: allgemeine Zustandsgleichung', s: '2. Schritt', tipp: 'Mit welcher Gleichung startest du immer?' },
      { x: 1.65, y: 19.38, cls: 'satz', z: 'Nach der gesuchten Größe umstellen', s: '3. Schritt', tipp: 'Bevor du Zahlen einsetzt, muss die gesuchte Größe allein stehen.' },
      { x: 1.65, y: 20.28, cls: 'satz', z: 'Zahlen mit Einheiten einsetzen und Ergebnis angeben', s: '4. Schritt', tipp: 'Was kommt ganz zum Schluss?' },
      { x: 1.15, y: 22.18, cls: 'satz', z: 'Die Gasgesetze gelten nur mit der absoluten Temperatur – mit °C stimmen die Verhältnisse nicht.', s: 'b)',
        tipp: 'Rechne testweise: Von 10 °C auf 20 °C – verdoppelt sich dann der Druck?',
        erkl: { schritte: [
          { k: 'Test mit °C', t: 'Von 10 °C auf 20 °C wäre „doppelt so warm“ – dann müsste sich der Druck verdoppeln. Das stimmt aber nicht!' },
          { k: 'Test mit Kelvin', t: '10 °C sind 283 K, 20 °C sind 293 K. Das sind nur gut 3 % mehr – genau so viel steigt der Druck.' },
          { k: 'Deshalb', t: 'Nur bei der Kelvin-Skala liegt der Nullpunkt dort, wo das Gas keinen Druck mehr hätte. Bei 0 °C würde man sogar durch 0 teilen.' }] } },
      { x: 1.15, y: 23.83, cls: 'satz', z: 'Beide Seiten „über Kreuz“ mit $T_1$ und $T_2$ malnehmen, dann durch die übrigen Größen teilen.', s: 'c)', tipp: 'Die Temperaturen stehen unten. Wie bekommst du sie nach oben?' },
      { x: 1.15, y: 25.48, cls: 'satz', z: 'Gleiche Größen in gleichen Einheiten einsetzen (z. B. beide Drücke in Pa), damit sie sich kürzen.', s: 'd)', tipp: 'Was passiert, wenn ein Druck in bar und der andere in hPa dasteht?' }
    ] },

  /* ===================== Aufgabe 2 ===================== */
  { chip: 'A2', name: 'Aufgabe 2', bild: { src: 'bilder/2-3/a2.webp', y0: 0.85, y1: 8.85 },
    check: { einh: 'bar', ok: [4.7], exakt: 4.68, bsp: '4,7', runden: 'Wie viele Ziffern hat die Angabe 4,0 bar?',
      fehler: [{ w: 14, t: '<b>Achtung, °C!</b> Du hast mit 20 °C und 70 °C gerechnet. In die Gasgesetze gehört die Temperatur in <b>Kelvin</b>.' },
               { w: 3.42, t: '<b>Falsch umgestellt?</b> Die Dose wird wärmer – dann muss der Druck <b>größer</b> werden, nicht kleiner.' },
               { w: 468259, rel: 0.01, t: 'Das ist der Druck in <b>Pascal</b>. Gib ihn in bar an: $10^5' + U('Pa') + ' = 1' + U('bar') + '$.' }] },
    striche: [[9.65, 2.71, 8.21]],

      L(3.23, TK(1, 20, 293), { s: 'geg. (Kelvin)', tipp: 'Temperaturen sofort in Kelvin: $T = (\\vartheta + 273)' + U('K') + '$.', erkl: E_KELVIN(20, 293) }),
      L(3.73, TK(2, 70, 343), { s: 'geg. (Kelvin)', tipp: 'Genauso wie $T_1$.' }),
      L(4.23, '$V_1 = V_2$ &nbsp;(Dose gibt nicht nach)', { tipp: 'Kann sich eine Spraydose ausdehnen? Was weißt du also über das Volumen?' }),
      GES(7.73, '$p_2$', { tipp: 'Wonach ist gefragt? Das schreibst du ganz unten links hin.' }),
      R(2.73, '$p_1 \\cdot V_1 : T_1 = p_2 \\cdot V_2 : T_2$', 'Formel', { tipp: 'Starte immer mit der allgemeinen Zustandsgleichung.' }),

          if (h <= 11) { var T = 288.15 - 6.5 * h; return [T, 1013.25 * Math.pow(T / 288.15, 5.2559)]; }

            '<text x="8" y="16" font-size="12" fill="#555">' + zahl(h, 1) + ' km</text>';
        }
        r.oninput = neu; neu();
      } }] },
