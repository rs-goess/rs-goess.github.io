var U = function (e) { return '\\,\\mathrm{' + e + '}'; };
var C = '\\,{}^{\\circ}\\mathrm{C}';
var PF = '\\,\\rightarrow\\,';
var CU = '\\,\\dfrac{\\mathrm{kJ}}{\\mathrm{kg}\\cdot{}^{\\circ}\\mathrm{C}}';
var CUL = '\\,\\mathrm{kJ}/(\\mathrm{kg}\\cdot{}^{\\circ}\\mathrm{C})';

var EURKWH = '\\,\\dfrac{\\text{€}}{\\mathrm{kWh}}';
var W = 'W_{\\mathrm{th}}';
var GESETZ = '$' + W + ' = m \\cdot c \\cdot \\Delta\\vartheta$';

var E_C = function (stoff, wert) { return { schritte: [
  { k: 'Woher kommt c?', t: 'Die spezifische Wärmekapazität $c$ steht in der <b>Tabelle unten auf Seite 1</b>.' },
  { k: stoff, f: '$c = ' + wert + CU + '$' },
  { k: 'Bedeutung', t: '1 kg ' + stoff + ' braucht ' + wert + ' kJ, um 1 °C wärmer zu werden.' }] }; };
var E_DELTA = function (a, b, d) { return { schritte: [
  { k: 'Δϑ heißt Temperatur<b>unterschied</b>', t: 'Für das Gesetz zählt nicht die Endtemperatur, sondern um wie viel Grad sich das Wasser erwärmt (oder abkühlt).' },
  { k: 'Größere minus kleinere Temperatur', f: '$\\Delta\\vartheta = (' + b + ' - ' + a + ')' + C + ' = ' + d + C + '$' },
  { k: 'Typischer Fehler', t: 'Wer nur mit der Endtemperatur ' + b + ' °C rechnet, bekommt viel zu viel Energie heraus.' }] }; };
var E_EINHEITEN = { schritte: [
  { k: 'Mit Einheiten einsetzen', t: 'Setze jede Größe <b>mit Einheit</b> ein. Dann siehst du sofort, ob das Ergebnis die richtige Einheit hat.' },

  { k: 'Ziffern zählen', t: angaben },
  { k: 'Also', f: erg }] }; };
var E_KWH = { schritte: [
  { k: 'Strom wird in kWh bezahlt', t: 'Der Strompreis gilt pro <b>Kilowattstunde</b>. Du musst die Energie also zuerst von kJ in kWh umrechnen.' },
  { k: '1 kWh = 3600 kJ', t: 'Frage: Wie oft passen 3600 kJ in die Energie? Das rechnest du mit einem Bruch:', f: '$' + W + ' = \\dfrac{89\\,037{,}5' + U('kJ') + '}{3600' + U('kJ') + '} \\cdot 1' + U('kWh') + '$' },

  { k: 'Das Erwärmungsgesetz', f: GESETZ }] };

/* ---------- Kleiner Ergebnis-Check als Zusatz (für die zweite Antwort einer Aufgabe) ---------- */
function miniCheck(titel, einh, ok, exakt, fehler) {
  return { titel: titel,
    html: '<div class="mini-check"><div class="reihe"><input type="text" inputmode="decimal" autocomplete="off" placeholder="z. B. 1,23"><span>' + einh + '</span><button type="button">Prüfen</button></div><div class="ort"></div></div>',
    init: function (s, fmt) {
      var inp = s.querySelector('input'), ort = s.querySelector('.ort');
      function zahl(t) { t = (t || '').trim().replace(/\s/g, '').replace('−', '-').replace(',', '.'); var m = t.match(/^(-?\d*\.?\d+)(?:[·*x]10\^?(-?\d+))?$/i); return m ? parseFloat(m[1]) * (m[2] ? Math.pow(10, +m[2]) : 1) : NaN; }
      function nah(a, b, r) { return Math.abs(a - b) <= Math.abs(b) * r + 1e-9; }
      function rm(art, t) { ort.innerHTML = '<div class="rm ' + art + '">' + fmt(t) + '</div>'; }
      function pruef() {
        var x = zahl(inp.value);
        if (isNaN(x)) return rm('nein', 'Gib nur eine Zahl ein. Die Einheit steht schon dahinter.');
        if (ok.some(function (o) { return nah(x, o, 0.0001); })) return rm('gut', '<b>Richtig!</b> Vergleiche trotzdem deinen Rechenweg.');
        if (nah(x, exakt, 0.012)) return rm('fast', '<b>Richtig gerechnet</b> – aber noch nicht sinnvoll gerundet.');
        for (var i = 0; i < fehler.length; i++) if (nah(x, fehler[i].w, 0.012)) return rm('nein', fehler[i].t);
        rm('nein', '<b>Das stimmt noch nicht.</b> Deck oben die Lösung Zeile für Zeile auf.');
      }
      s.querySelector('button').onclick = pruef;
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') pruef(); });
    } };
}
