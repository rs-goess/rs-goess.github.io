<script>
/* =====================================================================
   Physik 9b · 2.4 Übung Gasgesetze – Lernpfad auf dem Blatt (QR-Code auf dem AB führt hierher)
   Bilder: bilder/2-4/*.webp · Maße in cm wie in der PowerPoint (19,05 × 27,52 cm)
   Regel: jede Zeile mit Einheit; Umrechnen in die Grundeinheit mit Zehnerpotenzen.
   ===================================================================== */
var U = function (e) { return '\\,\\mathrm{' + e + '}'; };
var C = '\\,{}^{\\circ}\\mathrm{C}';
var PF = '\\,\\rightarrow\\,';
var PA = function (z, e) { return z + '\\cdot 10^{' + e + '}' + U('Pa'); };
var M3 = function (z, e) { return z + '\\cdot 10^{' + e + '}' + U('m^3'); };
var TK = function (i, c, k) { return '$\\vartheta_' + i + ' = ' + c + C + PF + 'T_' + i + ' = (' + c + ' + 273)' + U('K') + ' = ' + k + U('K') + '$'; };
var LX = 1.85, RX = 10.15;
function L(y, z, o) { return Object.assign({ x: LX, y: y, z: z, s: 'geg.' }, o || {}); }
function GEG(y, z, o) { return Object.assign(L(y, z, o), { lab: 'geg.:' }); }
function GES(y, z, o) { return Object.assign({ x: LX, y: y, z: z, s: 'ges.', lab: 'ges.:' }, o || {}); }
function R(y, z, s, o) { return Object.assign({ x: RX, y: y, z: z, s: s }, o || {}); }
function ANT(y, z, o) { return Object.assign({ x: 2.75, y: y, z: z, s: 'Antwortsatz', lab: 'Antwort:', cls: 'satz' }, o || {}); }
function ZIFF(y, t) { return { x: RX, y: y, z: '<span class="klein">' + t + '</span>', s: 'Ziffern' }; }
function ZELLE(x, y, z, s, o) { return Object.assign({ x: x, y: y, z: z, s: s, mitte: true }, o || {}); }

var E_KELVIN = function (c, k) { return { schritte: [
  { k: 'Warum Kelvin?', t: 'Die Gasgesetze gelten nur mit der <b>absoluten Temperatur</b> in Kelvin.' },
  { k: 'Umrechnen', t: 'Zur Temperatur in °C immer 273 dazuzählen:', f: '$T = (\\vartheta + 273)' + U('K') + '$' },
  { k: 'Hier', f: '$T = (' + c + ' + 273)' + U('K') + ' = ' + k + U('K') + '$' }] }; };
var E_MINUS = function (c, k) { var b = String(c).replace('-', ''); return { schritte: [
  { k: 'Negative Temperatur', t: '$' + c + C + '$ heißt: ' + b + ' Grad unter null.' },
  { k: 'Rechnen', t: 'Du zählst 273 dazu – das ist dasselbe wie 273 minus ' + b + ':', f: '$T = (' + c + ' + 273)' + U('K') + ' = ' + k + U('K') + '$' },
  { k: 'Typischer Fehler', t: 'Wer das Minus vergisst, rechnet $(' + b + ' + 273)' + U('K') + ' = ' + (+b + 273) + U('K') + '$ – viel zu warm.' }] }; };
var E_BAR = { schritte: [
  { k: 'Grundeinheit des Drucks', t: 'Die Grundeinheit des Drucks ist das <b>Pascal</b> ($1' + U('Pa') + ' = 1\\,\\tfrac{\\mathrm{N}}{\\mathrm{m^2}}$).' },
  { k: 'bar in Pa', t: '$1' + U('bar') + ' = 100\\,000' + U('Pa') + ' = 10^{5}' + U('Pa') + '$ – also $\\cdot 10^5$ anhängen und Pa schreiben.' },
  { k: 'Gut zu wissen', t: 'Gleiche Einheiten kürzen sich beim Einsetzen – in bar käme dasselbe heraus. Mit der Grundeinheit bist du aber immer auf der sicheren Seite.' }] };
var E_LITER = function (z) { return { schritte: [
  { k: 'Liter ist ein Kubikdezimeter', t: '$1' + U('l') + ' = 1' + U('dm^3') + '$ – ein Würfel mit 10 cm Kantenlänge.' },
  { k: 'In m³', t: 'In einen Kubikmeter passen $10 \\cdot 10 \\cdot 10 = 1000$ solche Würfel. Also:', f: '$1' + U('l') + ' = 10^{-3}' + U('m^3') + '$' },
  { k: 'Hier', f: '$' + z + U('l') + ' = ' + M3(z, -3) + '$' }] }; };
var E_ZIFFERN = function (angaben, erg) { return { schritte: [
  { k: 'Regel', t: 'Das Ergebnis bekommt so viele Ziffern wie die Angabe mit den <b>wenigsten Ziffern</b> – aber mindestens 2.' },
  { k: 'Ziffern zählen', t: angaben },
  { k: 'Zehnerpotenz zählt nicht mit', t: 'Bei $8{,}7 \\cdot 10^4' + U('Pa') + '$ zählst du nur 8 und 7. Das $\\cdot 10^4$ sagt nur, wie groß die Zahl ist.' },
  { k: 'Also', f: erg }] }; };
var E_TR = { schritte: [
  { k: 'Zehnerpotenz eintippen', t: 'Taste <b>×10<sup>x</sup></b> (manchmal <b>EXP</b>): $1{,}0\\cdot10^5$ tippst du als <b>1 ×10<sup>x</sup> 5</b>.' },
  { k: 'Abkürzung', t: 'Stehen vor und nach dem „:“ die gleichen Zehnerpotenzen (z. B. $10^{-3}$ bei beiden Volumen), kürzen sie sich – du musst sie nicht eintippen.' }] };
var E_KOMMA = function (a, b) { return { schritte: [
  { k: 'Komma verschieben', t: 'Vor dem Komma soll eine Ziffer stehen, die nicht 0 ist. Schiebe das Komma 1 Stelle nach <b>rechts</b> – dafür wird die Hochzahl um 1 <b>kleiner</b>:', f: '$' + a + ' = ' + b + '$' },
  { k: 'Probe', t: 'Beides ist dieselbe Zahl – nur anders geschrieben.' }] }; };

window.PFAD = {
  fach: 'Physik 9b', titel: '2.4 Übung Gasgesetze', zurueck: 'material.html',
  ueberschrift: 'Lernpfad zum Übungsblatt – Lösung Zeile für Zeile',
  karten: [

  /* ===================== Start ===================== */
  { chip: 'Start', start: true, titel: '2.4 Übung: Gasgesetze',
    html:
    '<p>Hier siehst du dein Übungsblatt. Mit <span class="mini" style="background:var(--petrol2);color:#fff">Nächster Schritt</span> erscheint die Lösung <b>Zeile für Zeile</b> in Blau.</p>' +
    '<ol class="start"><li>Erst <b>selbst</b> rechnen.</li><li>Ergebnis bei <b>Ergebnis prüfen</b> eingeben.</li>' +
    '<li>Hängst du fest? <span class="mini" style="background:var(--gelb)">Tipp</span> hilft beim nächsten Schritt. Der gelbe Rahmen zeigt, wo die nächste Zeile hinkommt.</li>' +
    '<li><span class="mini" style="background:var(--orange);color:#fff">Glühbirne</span> = Erklärung zu einer schwierigen Zeile.</li></ol>' +
    '<div class="box">📱 Am Handy: <b>quer halten</b> oder die <b>Lupe</b> nehmen. Zoomen mit zwei Fingern geht auch.</div>' +
    '<div class="box"><b>Fahrplan:</b> geg. (gleich in die Grundeinheit umrechnen) → ges. → Formel → Umstellen → Einsetzen → Ergebnis (sinnvoll runden) → Antwort. <b>Jede Zeile bekommt eine Einheit.</b></div>' +
    '<div class="merk"><b>Umrechnen in die Grundeinheit</b><br>Temperatur: $T = (\\vartheta + 273)' + U('K') + '$ &nbsp;·&nbsp; Druck: $1' + U('bar') + ' = 10^5' + U('Pa') + '$, $1' + U('hPa') + ' = 10^2' + U('Pa') + '$<br>' +
    'Volumen: $1' + U('l') + ' = 10^{-3}' + U('m^3') + '$, $1' + U('cm^3') + ' = 10^{-6}' + U('m^3') + '$</div>' },

  /* ===================== Aufgabe 1 ===================== */
  { chip: 'A1', name: 'Aufgabe 1', bild: { src: 'bilder/2-4/a1.webp', y0: 4.1, y1: 7.8 },
    zeilen: [
      ZELLE(2.64, 6.29, '$298$', '25 °C → K', { birne: [4.76, 5.94], tipp: 'Zur Temperatur in °C 273 dazuzählen.', erkl: E_KELVIN(25, 298) }),
      ZELLE(7.35, 6.29, '$255$', '−18 °C → K', { birne: [9.27, 5.95], tipp: 'Vorsicht Minus: 18 Grad <b>unter</b> null.', erkl: E_MINUS('-18', 255) }),
      ZELLE(11.73, 6.29, '$77$', '350 K → °C', { birne: [13.79, 5.95], tipp: 'Rückwärts: 273 abziehen.', erkl: { schritte: [{ k: 'Rückwärts', f: '$\\vartheta = (T - 273)' + C + '$' }, { k: 'Hier', f: '$\\vartheta = (350 - 273)' + C + ' = 77' + C + '$' }] } }),
      ZELLE(15.87, 6.29, '$-273$', '0 K → °C', { birne: [18.30, 5.95], tipp: '$0 - 273$ – das Ergebnis ist negativ. Das ist der absolute Nullpunkt.' }),
      ZELLE(3.17, 7.12, '$1{,}013$', 'hPa → bar', { birne: [4.76, 6.80], tipp: 'Erst in Pa: $1' + U('hPa') + ' = 10^2' + U('Pa') + '$. Dann: $10^5' + U('Pa') + ' = 1' + U('bar') + '$.',
        erkl: { schritte: [
          { k: 'In die Grundeinheit', f: '$1013' + U('hPa') + ' = ' + PA('1013', 2) + '$' },
          { k: 'Komma verschieben', t: 'Komma 3 Stellen nach links – Hochzahl 3 größer:', f: '$' + PA('1013', 2) + ' = ' + PA('1{,}013', 5) + '$' },
          { k: 'In bar', t: '$10^5' + U('Pa') + '$ ist genau $1' + U('bar') + '$:', f: '$' + PA('1{,}013', 5) + ' = 1{,}013' + U('bar') + '$' },
          { k: 'Kurz', t: 'Von hPa nach bar: durch 1000 teilen.' }] } }),
      ZELLE(7.33, 7.12, '$2400$', 'bar → hPa', { birne: [9.27, 6.80], tipp: '$2{,}4' + U('bar') + ' = ' + PA('2{,}4', 5) + '$ – wie viele hPa sind das?',
        erkl: { schritte: [
          { k: 'In Pa', f: '$2{,}4' + U('bar') + ' = ' + PA('2{,}4', 5) + '$' },
          { k: 'In hPa', t: 'hPa heißt $10^2' + U('Pa') + '$. Schreibe die Zahl also mit $10^2$:', f: '$' + PA('2{,}4', 5) + ' = ' + PA('2400', 2) + ' = 2400' + U('hPa') + '$' },
          { k: 'Kurz', t: 'Von bar nach hPa: mal 1000.' }] } }),
      ZELLE(12.13, 7.12, '$0{,}75$', 'cm³ → l', { birne: [13.79, 6.80], tipp: '$1' + U('cm^3') + ' = 10^{-6}' + U('m^3') + '$ und $1' + U('l') + ' = 10^{-3}' + U('m^3') + '$.',
        erkl: { schritte: [
          { k: 'In die Grundeinheit', f: '$750' + U('cm^3') + ' = ' + M3('750', -6) + '$' },
          { k: 'Mit 10⁻³ schreiben', t: 'Komma 3 Stellen nach links – die Hochzahl wird um 3 größer (von −6 auf −3):', f: '$' + M3('750', -6) + ' = ' + M3('0{,}75', -3) + '$' },
          { k: 'In Liter', t: '$10^{-3}' + U('m^3') + '$ ist genau $1' + U('l') + '$:', f: '$' + M3('0{,}75', -3) + ' = 0{,}75' + U('l') + '$' }] } }),
      ZELLE(16.25, 7.12, '$3500$', 'm³ → l', { birne: [18.30, 6.80], tipp: '$1' + U('m^3') + ' = 10^3' + U('l') + '$.',
        erkl: { schritte: [
          { k: 'Wie viele Liter hat ein m³?', t: 'In einen Würfel mit 1 m Kante passen $10 \\cdot 10 \\cdot 10 = 10^3$ Liter-Würfel (10 cm Kante).', f: '$1' + U('m^3') + ' = 10^3' + U('l') + '$' },
          { k: 'Hier', f: '$3{,}5' + U('m^3') + ' = 3{,}5 \\cdot 10^3' + U('l') + ' = 3500' + U('l') + '$' }] } })
    ],
    spiele: [{ titel: 'Ausprobieren: Celsius und Kelvin',
      html: '<input type="range" min="-273" max="120" step="1" value="20" aria-label="Temperatur in Grad Celsius"><div class="werte"></div><svg viewBox="0 0 320 110" role="img" aria-label="Thermometer"></svg>',
      init: function (s, fmt) {
        var r = s.querySelector('input'), w = s.querySelector('.werte'), svg = s.querySelector('svg');
        function neu() {
          var c = +r.value, k = c + 273, x = 20 + (c + 273) / 393 * 280, t = '';
          w.innerHTML = fmt('<span>$\\vartheta = $ <b>' + c + ' °C</b></span><span>$T = (' + c + ' + 273)\\,\\mathrm{K} = $ <b>' + k + ' K</b></span>' + (c === -273 ? '<span class="knall">absoluter Nullpunkt!</span>' : ''));
          [-273, -200, -100, 0, 100].forEach(function (g) { var gx = 20 + (g + 273) / 393 * 280;
            t += '<line x1="' + gx + '" y1="38" x2="' + gx + '" y2="82" stroke="#9aa3aa"/><text x="' + gx + '" y="30" font-size="11" text-anchor="middle" fill="#7A2E8E">' + g + ' °C</text>' +
                 '<text x="' + gx + '" y="98" font-size="11" text-anchor="middle" fill="#1F3FBF">' + (g + 273) + ' K</text>'; });
          svg.innerHTML = '<rect x="20" y="50" width="280" height="20" rx="10" fill="#eef1f3" stroke="#9aa3aa"/><rect x="20" y="50" width="' + Math.max(0, x - 20) + '" height="20" rx="10" fill="' + (c < 0 ? '#5aa9e6' : '#E97132') + '"/>' + t +
            '<circle cx="' + x + '" cy="60" r="9" fill="#fff" stroke="#1F2F3D" stroke-width="2"/>';
        }
        r.oninput = neu; neu();
      } }] },

  /* ===================== Aufgabe 2 ===================== */
  { chip: 'A2', name: 'Aufgabe 2', bild: { src: 'bilder/2-4/a2.webp', y0: 7.75, y1: 13.15 },
    zeilen: [
      ZELLE(11.575, 10.877, 'Volumen $V$', 'Autoreifen: bleibt gleich', { tipp: 'Kann sich ein Autoreifen beim Erwärmen stark ausdehnen?' }),
      ZELLE(15.8, 10.877, 'Gesetz von Amontons', 'Autoreifen: Gesetz', { tipp: 'Welches Gesetz gilt, wenn $V$ gleich bleibt?' }),
      ZELLE(11.575, 11.497, 'Temperatur $T$', 'Spritze: bleibt gleich', { tipp: 'Volumen und Druck ändern sich. „Langsam“ heißt: Die Luft hat Zeit, Wärme abzugeben.' }),
      ZELLE(15.8, 11.497, 'Gesetz von Boyle-Mariotte', 'Spritze: Gesetz', { tipp: 'Welches Gesetz gilt, wenn $T$ gleich bleibt?' }),
      ZELLE(11.575, 12.117, 'Druck $p$', 'Luftballon: bleibt gleich', { tipp: 'Ein dehnbarer Ballon passt sich dem Luftdruck außen an – und der ist im Garten genauso groß wie im Zimmer.' }),
      ZELLE(15.8, 12.117, 'Gesetz von Gay-Lussac', 'Luftballon: Gesetz', { tipp: 'Welches Gesetz gilt, wenn $p$ gleich bleibt?' }),
      ZELLE(11.575, 12.737, 'keine', 'Wetterballon: bleibt gleich', { tipp: 'Oben ist es kälter, der Luftdruck ist kleiner und der Ballon wird größer.' }),
      ZELLE(15.8, 12.737, '<span class="klein">allgemeine Zustandsgleichung</span>', 'Wetterballon: Gesetz', { birne: [18.3, 12.5], tipp: 'Wenn sich alles ändert …',
        erkl: { schritte: [
          { k: 'Erst fragen: Was ändert sich nicht?', t: 'Kann sich das Gefäß ausdehnen? Hat das Gas Zeit, die Temperatur auszugleichen? Passt sich der Druck dem Luftdruck außen an?' },
          { k: 'Dann das Gesetz', t: '$T$ gleich → <b>Boyle-Mariotte</b> ($p \\cdot V$ konstant)<br>$p$ gleich → <b>Gay-Lussac</b> ($V : T$ konstant)<br>$V$ gleich → <b>Amontons</b> ($p : T$ konstant)<br>alles ändert sich → <b>allgemeine Zustandsgleichung</b>' },
          { k: 'Eselsbrücke', t: 'Die drei Gesetze sind die allgemeine Zustandsgleichung, bei der eine Größe weggekürzt wurde.' }] } })
    ] },

  /* ===================== Aufgabe 3 ===================== */
  { chip: 'A3', name: 'Aufgabe 3', bild: { src: 'bilder/2-4/a3.webp', y0: 13.2, y1: 20.0 },
    check: { einh: 'bar', ok: [2.5], exakt: 2.5, bsp: '2,5',
      fehler: [{ w: 0.4, t: '<b>Falsch umgestellt?</b> Je kleiner das Volumen, desto <b>größer</b> der Druck.' },
               { w: 250000, t: 'Das ist der Druck in <b>Pascal</b>. Gib ihn in bar an: $10^5' + U('Pa') + ' = 1' + U('bar') + '$.' }] },
    striche: [[9.85, 15.91, 19.41]],
    zeilen: [
      GEG(15.93, '$p_1 = 1{,}0' + U('bar') + ' = ' + PA('1{,}0', 5) + '$', { tipp: 'Druck mit Formelzeichen $p_1$ aufschreiben und gleich in Pa umrechnen.', erkl: E_BAR }),
      L(16.43, '$V_1 = 0{,}30' + U('l') + ' = ' + M3('0{,}30', -3) + '$', { s: 'geg. (Umrechnen)', tipp: '$1' + U('l') + ' = 10^{-3}' + U('m^3') + '$', erkl: E_LITER('0{,}30') }),
      L(16.93, '$V_2 = 0{,}12' + U('l') + ' = ' + M3('0{,}12', -3) + '$', { s: 'geg. (Umrechnen)', tipp: 'Genauso wie $V_1$.' }),
      L(17.43, '$T_1 = T_2$ &nbsp;(Temperatur bleibt gleich)', { tipp: 'Was steht im Text über die Temperatur?' }),
      GES(18.93, '$p_2$', { tipp: 'Gesucht ist der Druck nach dem Zusammendrücken.' }),
      R(15.93, '$p_1 \\cdot V_1 : T_1 = p_2 \\cdot V_2 : T_2$', 'Formel', { tipp: 'Starte mit der allgemeinen Zustandsgleichung.' }),
      R(16.43, '$T$ kürzt sich: &nbsp;$p_1 \\cdot V_1 = p_2 \\cdot V_2$', 'Kürzen', { tipp: 'Was passiert mit $T$, wenn $T_1 = T_2$?',
        erkl: { schritte: [{ k: 'Warum fällt T weg?', t: 'Bei $T_1 = T_2$ nimmst du beide Seiten mit $T$ mal – dann ist die Temperatur weg.' }, { k: 'Übrig', t: 'Das ist das Gesetz von <b>Boyle-Mariotte</b>:', f: '$p_1 \\cdot V_1 = p_2 \\cdot V_2$' }] } }),
      R(16.93, '$p_2 = p_1 \\cdot V_1 : V_2$', 'Umstellen', { tipp: 'Beide Seiten durch $V_2$ teilen.',
        erkl: { schritte: [{ k: 'Ziel', t: '$p_2$ soll allein stehen. Neben $p_2$ steht noch „$\\cdot V_2$“.' }, { k: 'Gegenteil von mal', t: 'Teile beide Seiten durch $V_2$:', f: '$p_1 \\cdot V_1 = p_2 \\cdot V_2 \\quad |:V_2 \\qquad\\Rightarrow\\qquad p_2 = p_1 \\cdot V_1 : V_2$' }, { k: 'Probe mit dem Verstand', t: 'Kleineres Volumen → größerer Druck. ✓' }] } }),
      R(17.43, '$p_2 = ' + PA('1{,}0', 5) + ' \\cdot ' + M3('0{,}30', -3) + ' : ' + M3('0{,}12', -3) + '$', 'Einsetzen', { tipp: 'Mit Einheiten einsetzen – m³ und $10^{-3}$ kürzen sich.', erkl: E_TR }),
      R(17.93, '$p_2 = 2{,}5 \\cdot 10^5' + U('Pa') + ' =$&nbsp;<span class="unter">$2{,}5' + U('bar') + '$</span>', 'Ergebnis',
        { tipp: 'Taschenrechner: $1{,}0 \\cdot 0{,}30 : 0{,}12$.', erkl: E_ZIFFERN('$1{,}0$ bar, $0{,}30$ l und $0{,}12$ l haben je 2 Ziffern (Nullen vorne zählen nicht).', '$p_2 = 2{,}5\\cdot10^5' + U('Pa') + ' = 2{,}5' + U('bar') + '$') }),
      ZIFF(18.43, '(2 sinnvolle Ziffern wie 1,0 bar)'),
      ANT(19.43, 'Die Luft in der Pumpe hat dann einen Druck von 2,5 bar.', { tipp: 'Ganzer Satz mit Ergebnis.' })
    ],
    spiele: [{ titel: 'Ausprobieren: Drück den Kolben hinein',
      html: '<input type="range" min="0.06" max="0.30" step="0.01" value="0.30" aria-label="Volumen in Liter" style="direction:rtl"><div class="werte"></div><svg viewBox="0 0 320 110" role="img" aria-label="Fahrradpumpe"></svg><p class="hinweis-klein">Schiebe nach rechts: Das Volumen wird kleiner. Achte auf p · V – was fällt dir auf?</p>',
      init: function (s, fmt) {
        var r = s.querySelector('input'), w = s.querySelector('.werte'), svg = s.querySelector('svg'), pkt = [];
        for (var j = 0; j < 36; j++) pkt.push([Math.random(), Math.random()]);
        function zahl(x, d) { return x.toFixed(d).replace('.', ','); }
        function neu() {
          var V = +r.value, p = 0.30 / V, len = V / 0.30 * 230, x0 = 30;
          w.innerHTML = fmt('<span>$V$: <b>' + zahl(V, 2) + ' l</b></span><span>$p$: <b>' + zahl(p, 1) + ' bar</b></span><span>$p \\cdot V$: <b>' + zahl(p * V, 2) + ' bar·l</b></span>');
          var dots = pkt.map(function (q) { return '<circle cx="' + (x0 + 4 + q[0] * (len - 8)) + '" cy="' + (32 + q[1] * 46) + '" r="3" fill="#1F3FBF"/>'; }).join('');
          svg.innerHTML = '<rect x="' + x0 + '" y="26" width="250" height="58" fill="#f4f6f7" stroke="#1F2F3D" stroke-width="2"/><rect x="' + (x0 - 14) + '" y="48" width="14" height="14" fill="#1F2F3D"/>' + dots +
            '<rect x="' + (x0 + len) + '" y="26" width="8" height="58" fill="#7a8791"/><rect x="' + (x0 + len + 8) + '" y="50" width="' + (280 - len) + '" height="10" fill="#7a8791"/>' +
            '<text x="' + (x0 + 2) + '" y="18" font-size="12" fill="#555">Öffnung zugehalten</text>';
        }
        r.oninput = neu; neu();
      } }] },

  /* ===================== Aufgabe 4 ===================== */
  { chip: 'A4', name: 'Aufgabe 4', bild: { src: 'bilder/2-4/a4.webp', y0: 20.05, y1: 26.85 },
